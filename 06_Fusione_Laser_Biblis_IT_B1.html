<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>«È qui che verrà costruito»: la prima centrale a fusione laser — Goodman Italiano B1</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: Calibri, 'Segoe UI', sans-serif;
  background: #0e8388;
  color: #1e2a2e;
}

/* ── TOP BAR ── */
#pb-wrap { position: fixed; top: 0; left: 0; right: 0; height: 5px; background: rgba(255,255,255,0.2); z-index: 200; }
#pb { height: 5px; background: #fb6a5a; transition: width 0.3s; width: 0%; }

#topbar {
  position: fixed; top: 5px; left: 0; right: 0; height: 50px;
  background: #0e8388; z-index: 199;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2vw;
  border-bottom: 1px solid rgba(255,255,255,0.18);
}
#slide-label { color: white; font-size: 1.5vw; font-weight: 700; }
#nav-btns { display: flex; gap: 1vw; }
.nbtn {
  background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.3);
  color: white; padding: 0.4vh 1.5vw; border-radius: 5px;
  cursor: pointer; font-size: 1.3vw; font-family: inherit; font-weight: 600;
}
.nbtn:hover { background: rgba(255,255,255,0.28); }
.nbtn:disabled { opacity: 0.3; cursor: default; }

/* ── VIEWPORT ── */
#viewport {
  position: fixed;
  top: 55px; left: 0; right: 0; bottom: 0;
}

/* ── SLIDES ── */
.slide {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease;
  overflow: hidden;
}
.slide.active { opacity: 1; pointer-events: all; }

/* ════════════════════════════════
   DIVIDER SLIDES
════════════════════════════════ */
.div-slide {
  background: linear-gradient(160deg, #073c40 0%, #0e8388 60%, #0a5458 100%);
  color: white;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  padding: 3vh 6vw;
  position: relative;
}
.div-slide::after {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0;
  height: 0.8vh; background: #fb6a5a;
}
.div-icon { font-size: 7vw; line-height: 1; margin-bottom: 2vh; }
.div-num { font-size: 1.2vw; letter-spacing: 0.4vw; text-transform: uppercase; opacity: 0.5; margin-bottom: 1.5vh; font-weight: 700; }
.div-slide h2 { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 5.5vw; line-height: 1.1; margin-bottom: 2.5vh; }
.div-desc { font-size: 1.7vw; opacity: 0.78; max-width: 70vw; line-height: 1.6; margin-bottom: 3.5vh; }
.div-tags { display: flex; flex-wrap: wrap; gap: 1vw; justify-content: center; max-width: 75vw; }
.div-tag {
  background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.28);
  border-radius: 3vw; padding: 0.8vh 2vw; font-size: 1.3vw;
}

/* ════════════════════════════════
   TITLE SLIDE
════════════════════════════════ */
.title-slide {
  background: linear-gradient(150deg, #052b2e 0%, #0e8388 100%);
  color: white;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  padding: 3vh 4vw;
}
.pod-label { font-size: 1.5vw; letter-spacing: 0.4vw; text-transform: uppercase; color: #fb6a5a; margin-bottom: 3vh; font-weight: 700; }
.title-slide h1 { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 6.5vw; line-height: 1.15; width: 90vw; margin-bottom: 3.5vh; }
.red-line { width: 6vw; height: 0.6vh; background: #fb6a5a; margin: 0 auto 3vh; }
.title-meta { display: flex; gap: 4vw; font-size: 1.8vw; opacity: 0.65; flex-wrap: wrap; justify-content: center; }

/* ════════════════════════════════
   CONTENT SLIDE BASE
════════════════════════════════ */
.con-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.slide-head {
  border-left: 0.5vw solid #fb6a5a;
  padding-left: 1.5vw;
  margin-bottom: 2.5vh;
  flex-shrink: 0;
}
.slide-head h2 { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; color: #0e8388; font-size: 3.2vw; line-height: 1.15; margin-bottom: 0.4vh; }
.sub { color: #5e7377; font-size: 1.3vw; }

/* ════════════════════════════════
   ANTICIPAZIONE — split slides
════════════════════════════════ */
.single-box {
  flex: 1;
  background: #e6f3f2;
  border-radius: 1vw;
  padding: 3vh 3vw;
  border-top: 0.5vh solid #0e8388;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.single-box h3 { color: #0e8388; font-size: 2.2vw; margin-bottom: 2.5vh; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; }
.single-box ol { padding-left: 2.5vw; flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
.single-box ol li { font-size: 2vw; line-height: 1.6; }
.single-box p { font-size: 2vw; line-height: 1.75; flex: 1; display: flex; align-items: center; }

/* ════════════════════════════════
   FIGURE CHIAVE
════════════════════════════════ */
.figures-slide {
  background: #ffeae6;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.figures-slide .slide-head { border-color: #fb6a5a; }
.figures-slide .slide-head h2 { color: #e24e3e; }
.figures-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr 1fr;
  gap: 1.5vh 2vw;
  flex: 1;
}
.figure-card {
  background: white; border-radius: 0.8vw;
  border-left: 0.5vw solid #fb6a5a;
  padding: 1.5vh 2vw;
  display: flex; flex-direction: column; justify-content: center;
}
.figure-card .fname { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 1.9vw; font-weight: 700; color: #0e8388; margin-bottom: 0.8vh; }
.figure-card .fdesc { font-size: 1.35vw; color: #3a4a4e; line-height: 1.5; }

/* ════════════════════════════════
   VOCABULARY
════════════════════════════════ */
.vocab-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 2vh 4vw 2vh;
  overflow: hidden;
}
.vocab-group-label {
  font-size: 1.1vw; letter-spacing: 0.2vw; text-transform: uppercase;
  color: #5e7377; font-weight: 700; margin: 1.2vh 0 1vh;
  padding-bottom: 0.6vh; border-bottom: 2px solid #d7e6e4;
  flex-shrink: 0;
}
.vocab-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 1.2vh 2vw; flex: 1;
}
.vcard {
  background: white; border-radius: 0.8vw;
  box-shadow: 0 3px 12px rgba(0,0,0,0.09);
  cursor: pointer; perspective: 900px;
}
.vcard-inner {
  width: 100%; height: 100%; position: relative;
  transform-style: preserve-3d; transition: transform 0.45s;
}
.vcard.flipped .vcard-inner { transform: rotateY(180deg); }
.vfront, .vback {
  position: absolute; width: 100%; height: 100%;
  border-radius: 0.8vw; padding: 1.8vh 1.8vw;
  backface-visibility: hidden;
  display: flex; flex-direction: column; justify-content: space-between;
}
.vfront { background: white; }
.vfront .term { font-size: 2vw; font-weight: 700; color: #1e2a2e; line-height: 1.3; flex: 1; display: flex; align-items: center; }
.vfront .vbottom { display: flex; flex-direction: column; gap: 0.6vh; flex-shrink: 0; }
.vfront .rtag { display: inline-block; font-size: 1vw; padding: 0.3vh 0.8vw; border-radius: 2vw; background: #e6f3f2; color: #0e8388; font-weight: 600; align-self: flex-start; }
.vfront .hint { font-size: 1.1vw; color: #9bb0b2; }
.vback { background: #e6f3f2; transform: rotateY(180deg); }
.vback .en { font-size: 1.8vw; font-weight: 700; color: #0e8388; margin-bottom: 1vh; }
.vback .ex { font-size: 1.2vw; font-style: italic; color: #1e2a2e; border-left: 0.3vw solid #fb6a5a; padding-left: 0.8vw; line-height: 1.55; flex: 1; }
.vback .rnote { font-size: 0.95vw; color: #5e7377; margin-top: 0.8vh; flex-shrink: 0; }

/* ════════════════════════════════
   GRAMMAR
════════════════════════════════ */
.gram-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.gram-block {
  background: white; border-radius: 1vw;
  padding: 3vh 3vw;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  border-left: 0.6vw solid #0a6e72;
  flex: 1; display: flex; flex-direction: column;
}
.gram-block h3 { color: #0e8388; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 2.5vw; margin-bottom: 1.5vh; line-height: 1.2; }
.gram-block .expl { font-size: 1.55vw; color: #3a4a4e; line-height: 1.7; margin-bottom: 2vh; flex-shrink: 0; }
.gram-block ul { list-style: none; padding: 0; flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
.gram-block ul li { background: #e6f3f2; border-radius: 0.6vw; padding: 1.5vh 1.5vw; font-size: 1.45vw; font-style: italic; line-height: 1.6; }
.gram-block ul li strong { font-style: normal; color: #fb6a5a; font-size: 1.5vw; }
.gram-block .snote { font-size: 1.35vw; color: #1E8449; font-weight: 600; margin-top: 2vh; line-height: 1.55; padding: 1.5vh 1.5vw; background: #EAFAF1; border-radius: 0.6vw; flex-shrink: 0; }

/* ════════════════════════════════
   COMPREHENSION
════════════════════════════════ */
.comp-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.comp-label { font-size: 1.2vw; letter-spacing: 0.2vw; text-transform: uppercase; color: #5e7377; margin-bottom: 2vh; font-weight: 700; padding-bottom: 1vh; border-bottom: 2px solid #d7e6e4; flex-shrink: 0; }
.qlist { flex: 1; display: flex; flex-direction: column; gap: 1.5vh; }
.qitem { background: white; border-radius: 0.8vw; padding: 2vh 2.5vw; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; gap: 1.5vw; font-size: 1.8vw; line-height: 1.65; flex: 1; align-items: center; }
.qnum { color: #fb6a5a; font-weight: 700; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 2.2vw; min-width: 2.5vw; flex-shrink: 0; }

/* ════════════════════════════════
   CULTURAL
════════════════════════════════ */
.cult-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.cult-block {
  background: white; border-radius: 1vw;
  padding: 3vh 3vw;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  border-left: 0.6vw solid #fb6a5a;
  flex: 1; display: flex; flex-direction: column;
}
.cult-block h3 { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; color: #0e8388; font-size: 2.4vw; margin-bottom: 2vh; line-height: 1.2; flex-shrink: 0; }
.cult-block p { font-size: 1.6vw; line-height: 1.8; flex: 1; }
.en-gl { font-style: italic; color: #5e7377; font-size: 1.2vw; margin-top: 1.5vh; display: block; flex-shrink: 0; }
.cult-hook { margin-top: 2.5vh; padding: 1.5vh 2vw; background: #fff1ef; border-radius: 0.6vw; font-size: 1.45vw; color: #e24e3e; line-height: 1.6; flex-shrink: 0; }

/* ════════════════════════════════
   EXERCISES
════════════════════════════════ */
.ex-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.ex-block {
  background: white; border-radius: 1vw;
  padding: 2.5vh 3vw;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  flex: 1; display: flex; flex-direction: column;
}
.ex-block h3 { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; color: #0e8388; font-size: 2.2vw; margin-bottom: 0.8vh; flex-shrink: 0; }
.ex-instr { font-size: 1.3vw; color: #5e7377; margin-bottom: 1.8vh; line-height: 1.6; flex-shrink: 0; }

/* Gap fill */
.word-bank { display: flex; flex-wrap: wrap; gap: 1vw; margin-bottom: 2vh; padding: 1.5vh 1.5vw; background: #e6f3f2; border-radius: 0.8vw; flex-shrink: 0; }
.dword { background: #0e8388; color: white; padding: 0.8vh 2vw; border-radius: 3vw; font-size: 1.5vw; cursor: pointer; user-select: none; font-weight: 600; }
.dword.sel-w { outline: 0.3vw solid #fb6a5a; outline-offset: 0.2vw; }
.dword.used { opacity: 0.3; cursor: default; }
.gap-sentences { flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
.gap-sentence { font-size: 1.6vw; line-height: 1.4; }
.drop-zone { display: inline-block; min-width: 10vw; border-bottom: 0.2vw solid #0e8388; margin: 0 0.5vw; padding: 0 0.5vw; color: #9bb0b2; font-style: italic; cursor: pointer; vertical-align: bottom; font-size: 1.5vw; }
.drop-zone.filled { color: #1e2a2e; font-style: normal; font-weight: 700; background: #e6f3f2; border-radius: 0.3vw; border-bottom-color: #0a6e72; }
.drop-zone.ok { border-bottom-color: #1E8449; background: #EAFAF1; color: #1E8449; }
.drop-zone.wrong { border-bottom-color: #fb6a5a; background: #ffeae6; color: #fb6a5a; }
.ex-btns { display: flex; gap: 1vw; margin-top: 1.5vh; flex-shrink: 0; }

/* Answer key slide */
.ak-slide {
  background: #EAFAF1;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.ak-slide .slide-head { border-color: #1E8449; }
.ak-slide .slide-head h2 { color: #1E8449; }
.ak-content { background: white; border-radius: 1vw; padding: 2vh 3vw; box-shadow: 0 4px 16px rgba(0,0,0,0.08); border-left: 0.6vw solid #1E8449; flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
.ak-item { display: flex; gap: 1.5vw; align-items: center; padding: 1.5vh 2vw; background: #F4FDF8; border-radius: 0.6vw; font-size: 1.55vw; line-height: 1.6; }
.ak-num { color: #1E8449; font-weight: 700; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 2vw; min-width: 2.5vw; }
.ak-word { font-weight: 700; color: #1E8449; }
.ak-quote { font-style: italic; color: #5e7377; }

/* Matching */
.match-wrap { flex: 1; display: flex; flex-direction: column; }
.match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2vw; flex: 1; margin-bottom: 1.5vh; }
.match-col-label { font-size: 1.1vw; letter-spacing: 0.2vw; text-transform: uppercase; color: #5e7377; margin-bottom: 1vh; font-weight: 700; }
.mitem { padding: 1.5vh 1.8vw; border-radius: 0.6vw; margin-bottom: 0.8vh; font-size: 1.45vw; cursor: pointer; border: 0.2vw solid transparent; background: #e6f3f2; transition: all 0.18s; line-height: 1.45; }
.mitem:hover { border-color: #0a6e72; }
.mitem.sel { border-color: #0e8388; background: #cde9e7; font-weight: 700; }
.mitem.matched { border-color: #1E8449; background: #EAFAF1; color: #1E8449; cursor: default; font-weight: 600; }
.mitem.bad { border-color: #fb6a5a; background: #ffeae6; }

/* VF */
.vf-list { flex: 1; display: flex; flex-direction: column; gap: 1.2vh; }
.vf-row { display: flex; gap: 1.5vw; align-items: center; padding: 1.8vh 2vw; background: white; border-radius: 0.8vw; box-shadow: 0 2px 8px rgba(0,0,0,0.06); font-size: 1.5vw; line-height: 1.6; flex: 1; }
.vf-btns { display: flex; gap: 0.6vw; flex-shrink: 0; }
.vfb { padding: 0.6vh 1.2vw; border-radius: 2vw; border: 0.2vw solid; font-size: 1.2vw; font-weight: 700; cursor: pointer; background: transparent; font-family: inherit; }
.vfb.V { border-color: #1E8449; color: #1E8449; }
.vfb.F { border-color: #fb6a5a; color: #fb6a5a; }
.vfb.N { border-color: #5e7377; color: #5e7377; }
.vfb.correct { background: #1E8449; color: white; border-color: #1E8449; }
.vfb.incorrect { background: #fb6a5a; color: white; border-color: #fb6a5a; }
.vf-note { font-size: 1.1vw; color: #1E8449; font-style: italic; margin-top: 0.5vh; display: none; }
.vf-note.show { display: block; }

/* Buttons */
.ak-btn { padding: 1vh 2vw; background: #1E8449; color: white; border: none; border-radius: 0.5vw; cursor: pointer; font-size: 1.3vw; font-weight: 700; font-family: inherit; flex-shrink: 0; }
.ak-btn:hover { opacity: 0.85; }
.ak-btn.grey { background: #5e7377; }
.answer-key { display: none; margin-top: 1.5vh; padding: 1.5vh 2vw; background: #EAFAF1; border-radius: 0.8vw; border-left: 0.4vw solid #1E8449; font-size: 1.3vw; line-height: 1.9; flex-shrink: 0; }
.answer-key.show { display: block; }

/* ════════════════════════════════
   DISCUSSION
════════════════════════════════ */
.disc-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.disc-card { background: white; border-radius: 1vw; padding: 2.5vh 3vw; box-shadow: 0 4px 16px rgba(0,0,0,0.08); flex: 1; display: flex; flex-direction: column; }
.disc-topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2vh; flex-shrink: 0; }
.disc-dots { display: flex; gap: 0.8vw; }
.disc-dot { width: 1.2vw; height: 1.2vw; border-radius: 50%; background: #e6f3f2; border: 0.2vw solid #0a6e72; cursor: pointer; }
.disc-dot.active { background: #0e8388; }
.disc-dot.done { background: #1E8449; border-color: #1E8449; }
.disc-qnum { font-size: 1.4vw; color: #5e7377; font-weight: 600; }
.disc-q { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 2vw; line-height: 1.6; color: #1e2a2e; margin-bottom: 2vh; flex-shrink: 0; }
.disc-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 2vw; flex: 1; min-height: 0; }
.disc-col { display: flex; flex-direction: column; min-height: 0; }
.disc-col-label { font-size: 1.1vw; letter-spacing: 0.2vw; text-transform: uppercase; color: #5e7377; margin-bottom: 0.8vh; font-weight: 700; flex-shrink: 0; }
.disc-user-box { flex: 1; padding: 1.5vh 1.5vw; border-radius: 0.8vw; background: #e6f3f2; font-size: 1.4vw; line-height: 1.7; border: 0.2vw solid transparent; min-height: 0; overflow-y: auto; }
.disc-user-box.listening { border-color: #fb6a5a; background: #ffeae6; }
.disc-user-box .ph { color: #9bb0b2; font-style: italic; }
.disc-model-box { flex: 1; padding: 1.5vh 1.5vw; border-radius: 0.8vw; background: #EAFAF1; font-size: 1.3vw; line-height: 1.8; min-height: 0; overflow-y: auto; }
.disc-model-box.blur .mtext { filter: blur(6px); user-select: none; }
.reveal-btn { display: inline-block; margin-top: 0.8vh; padding: 0.7vh 1.8vw; background: #1E8449; color: white; border: none; border-radius: 0.5vw; font-size: 1.2vw; font-weight: 700; cursor: pointer; font-family: inherit; flex-shrink: 0; }
.mic-row { display: flex; align-items: center; gap: 1.5vw; margin-top: 1.5vh; flex-shrink: 0; }
.mic-btn { width: 5vw; height: 5vw; border-radius: 50%; border: none; background: #fb6a5a; color: white; font-size: 2.2vw; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(192,57,43,0.38); flex-shrink: 0; }
.mic-btn.on { background: #1E8449; animation: pulse 1.2s infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(30,132,73,0.5); } 50% { box-shadow: 0 0 0 1vw rgba(30,132,73,0); } }
.mic-status { font-size: 1.2vw; color: #5e7377; line-height: 1.5; }
.disc-nav { display: flex; gap: 1vw; justify-content: flex-end; margin-top: 1.5vh; flex-shrink: 0; }

n schedule"}, {"it": "la centrale pilota", "en": "the pilot plant", "ex": "tra dieci anni vogliamo costruire lì la centrale pilota", "reg": "neutral; pilota stays invariable as an adjective: progetti pilota, centrali pilota"}]}, {"group": "🗣  Espressioni utili", "items": [{"it": "fare sul serio", "en": "to mean business, to be serious about it", "ex": "la Germania fa sul serio con l'uscita dal nucleare a fissione", "reg": "colloquial but standard; dire sul serio = to be serious in what one says"}, {"it": "essere in cima all'agenda", "en": "to be top of the agenda", "ex": "lo sviluppo dell'energia da fusione è in cima all'agenda politico-tecnologica della Germania", "reg": "neutral, journalistic; also in cima alla lista, in cima alle priorità"}, {"it": "sfruttare", "en": "to make use of, to exploit", "ex": "possiamo sfruttare l'infrastruttura esistente, dal collegamento alla rete fino agli edifici", "reg": "neutral here; with people it is negative (sfruttare i lavoratori = to exploit)"}, {"it": "irrisolto", "en": "unresolved, still open", "ex": "ci sono problemi ancora irrisolti legati al ciclo del combustibile", "reg": "neutral, formal; from risolvere; compare insoluto, used mainly of debts"}]}], "video": {"url": "https://www.youtube.com/watch?v=wpAv4j8Q5A0", "title": "La prima centrale a fusione laser al mondo viene costruita in Germania", "channel": "euronews (in italiano)", "parts": [{"summary": "Il servizio comincia con una domanda: chi vincerà la corsa all'energia del futuro, gli Stati Uniti, la Cina o l'Europa? La start-up tedesca Focused Energy, con sede a Darmstadt, vuole diventare il leader mondiale delle centrali a fusione laser commerciali, e questa primavera ha raccolto da sola 240 milioni di dollari. Dopo un severo controllo di sicurezza, i cancelli della vecchia centrale nucleare di Biblis si aprono per Euronews: è qui che verrà costruito il nuovo impianto. La Germania fa sul serio con l'uscita dal nucleare a fissione — gli edifici vengono decontaminati e le torri di raffreddamento demolite — ma le enormi cupole dei reattori di Biblis resteranno al loro posto: in futuro, dentro, ci sarà la fusione e non più la fissione. RWE, proprietaria del sito, ha investito 60 milioni di euro nella start-up. Ulrich Sigel, vicepresidente di Focused Energy, accompagna la troupe e spiega la tabella di marcia: un primo dimostratore tra cinque anni, la centrale pilota tra dieci, la prima centrale commercialmente competitiva tra quindici. Perché proprio Biblis? Perché si può sfruttare l'infrastruttura esistente, dal collegamento alla rete fino agli edifici. La futura centrale dovrebbe produrre quasi un gigawatt, abbastanza per due milioni di famiglie. I critici, però, ritengono che la tecnologia non sia ancora matura e che costi troppo, e restano enormi sfide tecniche: il ciclo del combustibile e la messa in scala dei primi risultati di laboratorio."}]}, "reading": {"title": "La prima centrale a fusione laser al mondo viene costruita in Germania", "lead": "Nell'ex centrale nucleare di Biblis nascerà il primo impianto a fusione laser del mondo. Il reporter di Euronews Hans von der Brelie ha avuto accesso al sito protetto.", "paragraphs": ["La corsa per sviluppare la fonte di energia del futuro si sta intensificando. Chi vincerà? Gli Stati Uniti e la Cina? Oppure l'Europa? La start-up tedesca Focused Energy, con sede a Darmstadt, punta a diventare il leader mondiale nella costruzione di centrali a fusione laser commerciali.", "Lo sviluppo dell'energia da fusione è in cima all'agenda politico-tecnologica della Germania e dell'Unione europea. In tutto il mondo nascono start-up della fusione, e la tecnologia della fusione laser attira enormi quantità di capitale di rischio. Questa primavera Focused Energy ha raccolto da sola 240 milioni di dollari: la cifra più alta mai ottenuta in un primo round di finanziamento nel settore mondiale della fusione.", "Dopo un severo controllo di sicurezza, i cancelli della centrale di Biblis si aprono per Euronews. Il sito ospitava una delle più grandi centrali nucleari a fissione della Germania. Ora è qui che verrà costruito il nuovo impianto a fusione laser.", "La Germania fa sul serio con l'uscita dal nucleare a fissione: in tutto il Paese gli edifici vengono decontaminati e le torri di raffreddamento demolite. Le enormi cupole dei reattori di Biblis, però, resteranno al loro posto. In futuro, all'interno, ci sarà la fusione nucleare e non più la fissione. RWE, una delle maggiori aziende energetiche europee e proprietaria del sito, ha investito 60 milioni di euro in Focused Energy.", "La società presenta una tabella di marcia estremamente ambiziosa. «Tra cinque anni voglio avere qui a Biblis un primo dimostratore di fusione laser», racconta a Euronews Ulrich Sigel, vicepresidente di Focused Energy. «Tra dieci anni vogliamo costruire lì la centrale pilota e tra 15 anni la prima centrale a fusione laser commercialmente competitiva al mondo». Perché proprio Biblis? «Le condizioni qui sono semplicemente eccellenti», spiega Sigel: «possiamo sfruttare l'infrastruttura esistente, dal collegamento alla rete fino agli edifici».", "La centrale a fusione dovrebbe produrre quasi un gigawatt di elettricità, sufficiente per due milioni di famiglie. I critici ritengono che la tecnologia non sia ancora abbastanza matura e che sia troppo costosa; Focused Energy, invece, è convinta che la fusione laser sarà competitiva, anche rispetto all'elettricità dei reattori a fissione o delle fonti rinnovabili. Restano però enormi sfide tecniche: ci sono problemi ancora irrisolti legati al ciclo del combustibile e alla messa in scala dei primi risultati ottenuti in laboratorio."], "url": "https://it.euronews.com/my-europe/2026/09/18/la-prima-centrale-a-fusione-laser-al-mondo-viene-costruita-in-germania"}, "grammar": [{"label": "Grammatica — Le frasi scisse e la messa in rilievo", "subtitle": "è qui che... · sono loro a... · quello che conta è...", "title": "«Ora è qui che verrà costruito il nuovo impianto» — come l'italiano mette in primo piano una parola", "expl": "In italiano l'ordine delle parole è abbastanza libero, e la lingua lo usa per dire che cosa è importante. Il posto naturale dell'informazione nuova è la fine della frase; quando però un elemento va messo in rilievo più fortemente, entrano in gioco alcune strutture precise. 1) LA FRASE SCISSA (o frase spezzata): essere + l'elemento in rilievo + che + il resto. «Ora è qui che verrà costruito il nuovo impianto»: la frase semplice sarebbe «il nuovo impianto verrà costruito qui», ma il giornalista vuole sottolineare il luogo, e così lo estrae e lo mette dopo essere. Attenzione al verbo essere: sta di solito al presente o all'imperfetto e NON segue il tempo della relativa (è qui che verrà costruito, era allora che tutto cominciò). 2) QUANDO L'ELEMENTO IN RILIEVO È IL SOGGETTO, l'italiano ha due costruzioni: con che + verbo coniugato (è la Germania che investe di più) e, molto più elegante e frequente, con a + infinito (è la Germania a investire di più; sono gli Stati Uniti a correre più veloce). La seconda si usa soltanto per il soggetto: non si dice «era Biblis a scegliere» se Biblis è il luogo. 3) CON UNA PREPOSIZIONE il che diventa cui oppure resta che nella lingua parlata: è di questo che parliamo / è questo di cui parliamo; è con RWE che hanno firmato. 4) LA FRASE PSEUDOSCISSA: quello che / ciò che / quel che + verbo + è + l'elemento in rilievo. «Quello che resta irrisolto è il ciclo del combustibile». Serve soprattutto a mettere in rilievo un'intera idea, ed è tipica del parlato e dei testi argomentativi. 5) SENZA SCISSA: spesso basta spostare le parole. «Restano però enormi sfide tecniche»: il verbo viene prima e il soggetto va in fondo, cioè nel punto in cui cade l'informazione nuova. Oppure si usa un avverbio focalizzante: proprio, solo, soltanto, perfino, anche («perché proprio Biblis?»). 6) NELLE DOMANDE la scissa è frequentissima: chi è che paga? dove è che si costruisce? (nel parlato: dov'è che...?). 7) NELLA NEGAZIONE la scissa serve a correggere: «non è la tecnologia che manca, è il tempo». Nota per chi traduce: l'inglese usa la it-cleft in casi simili, ma molto più spesso affida il rilievo all'intonazione o all'ordine SVO fisso; l'italiano, che può muovere gli elementi, sceglie tra scissa, inversione e dislocazione a seconda del registro. La scissa appartiene alla lingua scritta controllata e al parlato sorvegliato; la dislocazione («il combustibile, quello resta un problema») è più colloquiale.", "examples": [["Ora è qui che verrà costruito il nuovo impianto a fusione laser.", " — frase scissa di luogo: essere al presente + qui + che; il verbo della relativa resta al futuro"], ["Restano però enormi sfide tecniche.", " — nessuna scissa: basta l'inversione, il soggetto va in fondo, dove cade l'informazione nuova"], ["Perché proprio Biblis?", " — messa in rilievo lessicale con proprio; equivale a «perché è proprio Biblis che è stata scelta?»"], ["Focused Energy punta a diventare il leader mondiale. → È Focused Energy a puntare a diventare il leader mondiale.", " — scissa di soggetto con a + infinito: la variante più elegante, accanto a «è Focused Energy che punta...»"], ["Restano problemi irrisolti. → Quello che resta irrisolto è il ciclo del combustibile.", " — frase pseudoscissa: quello che / ciò che ... è ...; mette in rilievo un'intera idea"]], "snote": "Regola pratica: essere + l'elemento in rilievo + che (o a + infinito, ma soltanto per il soggetto). Il verbo essere non copia il tempo della relativa: è qui che verrà costruito. Se l'elemento da mettere in rilievo è un'idea intera, usa la pseudoscissa: quello che conta è..."}], "comprehension": [{"label": "Comprensione", "h2": "Comprensione", "sub": "1–3: fatti dal servizio · 4–6: domande aperte", "compLabel": "📺 Fatti dal servizio (1–3)  ·  💭 Domande aperte (4–6)", "questions": [["1.", "Dove verrà costruita la nuova centrale a fusione laser, e che cosa c'era prima in quel sito?", "A Biblis, in Germania, nel sito di una delle più grandi centrali nucleari a fissione del Paese, oggi dismessa. Le enormi cupole dei reattori resteranno al loro posto, ma dentro ci sarà la fusione e non più la fissione."], ["2.", "Quanti soldi ha raccolto Focused Energy questa primavera, e perché quella cifra è importante?", "240 milioni di dollari. È la cifra più alta mai ottenuta in un primo round di finanziamento nel settore mondiale della fusione. In più, RWE — la grande azienda energetica proprietaria del sito — ha investito altri 60 milioni di euro nella start-up."], ["3.", "Qual è la tabella di marcia della società, secondo Ulrich Sigel?", "Tra cinque anni un primo dimostratore di fusione laser a Biblis; tra dieci anni la centrale pilota; tra quindici anni la prima centrale a fusione laser commercialmente competitiva al mondo."], ["4.", "Il servizio si apre con una domanda: «Chi vincerà? Gli Stati Uniti e la Cina? Oppure l'Europa?». Perché, secondo te, un servizio sull'energia comincia parlando di una corsa tra Paesi?", "Perché l'energia non è soltanto una questione tecnica: chi arriva primo vende la tecnologia agli altri e decide le regole. La parola «corsa» trasforma un tema difficile in una storia con dei protagonisti, e questo aiuta il pubblico a seguirla. È anche un modo per dire che l'Europa rischia di restare indietro, senza doverlo affermare apertamente: la domanda lascia il giudizio a chi guarda. Dal punto di vista giornalistico è un'ottima apertura, perché crea una tensione che il resto del servizio dovrà sciogliere."], ["5.", "Costruire una centrale del futuro dentro una centrale nucleare dismessa: quali sono, secondo te, i vantaggi pratici e quali i problemi?", "I vantaggi li dice Sigel stesso: le condizioni sono eccellenti perché si può sfruttare l'infrastruttura esistente, dal collegamento alla rete elettrica fino agli edifici, e c'è già personale abituato a lavorare in un sito sorvegliato. Ci sono però dei problemi: una parte del sito va ancora decontaminata, le norme sono severe e i tempi burocratici lunghi. E c'è un problema di parole: per molte persone «nucleare» resta una parola sola, e spiegare la differenza tra fissione e fusione a chi abita lì vicino non è semplice."], ["6.", "I critici dicono che la fusione non è ancora matura e che costa troppo. Secondo te, uno Stato deve finanziare tecnologie che forse funzioneranno tra quindici anni, o conviene investire tutto in quelle che già funzionano?", "Ci sono due argomenti seri. Da una parte, quindici anni sono tanti e il clima non aspetta: i soldi pubblici danno un risultato sicuro se vanno oggi nelle rinnovabili, nelle reti e nel risparmio energetico. Dall'altra, nessuna azienda privata pagherebbe da sola una ricerca così lunga e rischiosa, e se l'Europa non la paga la pagheranno gli Stati Uniti e la Cina, e poi compreremo da loro la tecnologia. La risposta ragionevole, credo, non è scegliere ma dosare: la maggior parte dei fondi a ciò che funziona adesso, una quota piccola e costante alla ricerca di lungo periodo, con verifiche regolari e la libertà di fermarsi se i risultati non arrivano."]]}], "gapfill": {"heading": "Completa le frasi in base al servizio!", "words": ["fusione", "fissione", "decontaminati", "tabella", "gigawatt"], "sents": [{"pre": "1.  La start-up tedesca Focused Energy vuole costruire centrali a", "blank": "fusione", "post": "laser commerciali."}, {"pre": "2.  Il sito di Biblis ospitava una delle più grandi centrali nucleari a", "blank": "fissione", "post": "della Germania."}, {"pre": "3.  In tutto il Paese gli edifici vengono", "blank": "decontaminati", "post": "e le torri di raffreddamento demolite."}, {"pre": "4.  La società presenta una", "blank": "tabella", "post": "di marcia estremamente ambiziosa."}, {"pre": "5.  La centrale dovrebbe produrre quasi un", "blank": "gigawatt", "post": "di elettricità."}], "answers": [["1.", "fusione", "punta a diventare il leader mondiale nella costruzione di centrali a fusione laser commerciali"], ["2.", "fissione", "il sito ospitava una delle più grandi centrali nucleari a fissione della Germania"], ["3.", "decontaminati", "in tutto il Paese gli edifici vengono decontaminati e le torri di raffreddamento demolite"], ["4.", "tabella", "la società presenta una tabella di marcia estremamente ambiziosa"], ["5.", "gigawatt", "la centrale a fusione dovrebbe produrre quasi un gigawatt di elettricità, sufficiente per due milioni di famiglie"]]}, "verofalso": {"items": [{"s": "La nuova centrale a fusione laser sorgerà nel sito di una vecchia centrale nucleare.", "a": "V", "note": ""}, {"s": "Le enormi cupole dei reattori di Biblis verranno demolite.", "a": "F", "note": "Resteranno al loro posto: si demoliscono le torri di raffreddamento, non le cupole."}, {"s": "Focused Energy ha raccolto 240 milioni di dollari in un primo round di finanziamento.", "a": "V", "note": ""}, {"s": "Secondo Ulrich Sigel, la prima centrale commercialmente competitiva sarà pronta tra cinque anni.", "a": "F", "note": "Tra cinque anni è previsto un primo dimostratore; la centrale commerciale è attesa tra quindici anni."}, {"s": "RWE, proprietaria del sito, ha investito 60 milioni di euro nella start-up.", "a": "V", "note": ""}, {"s": "Il governo tedesco ha già dato tutte le autorizzazioni per costruire l'impianto.", "a": "N", "note": "Il servizio non parla delle autorizzazioni."}], "key_html": "<b>1.</b> Vero &nbsp; <b>2.</b> Falso (resteranno al loro posto) &nbsp; <b>3.</b> Vero &nbsp; <b>4.</b> Falso (tra cinque anni un dimostratore) &nbsp; <b>5.</b> Vero &nbsp; <b>6.</b> Non detto"}, "discussion": [{"q": "Racconta una grande opera o un grande cantiere del tuo Paese: che cos'è, dove si trova, chi lo paga e che cosa ne pensa la gente. Usa almeno una frase scissa («è lì che...», «è lo Stato a...»).", "m": "A Budapest il cantiere di cui si parla di più è quello dei musei del Parco della Città. È lì, in mezzo agli alberi, che sono stati costruiti il nuovo Museo di Etnografia e la Casa della Musica Ungherese. È lo Stato a pagare quasi tutto, e questo è esattamente il punto discusso: c'è chi dice che una capitale ha bisogno di edifici belli e di turisti, e c'è chi risponde che con quei soldi si potevano riparare le scuole e gli ospedali. Quello che colpisce me, però, è un'altra cosa: gli edifici piacciono quasi a tutti, anche a chi era contrario. Non è l'architettura che divide la gente, è il modo in cui la decisione è stata presa."}, {"q": "Fusione, intelligenza artificiale, nuovi farmaci: sono promesse che chiedono molti anni e molti soldi. Secondo te, come dovrebbe decidere un governo quali tecnologie finanziare?", "m": "Secondo me un governo non dovrebbe scegliere il vincitore, ma le condizioni. Quello che conta è finanziare la ricerca di base, formare le persone e poi lasciare che siano le aziende a rischiare sui prodotti. È per questo che i fondi pubblici dovrebbero andare soprattutto alle università e ai laboratori, dove nessun investitore privato metterebbe i soldi. Poi servono regole semplici: tappe chiare, verifiche ogni due o tre anni e il coraggio di chiudere i progetti che non funzionano. Il problema è proprio questo: fermare un progetto costa voti, e così si continua a pagare per anni cose che nessuno crede più. Non è il denaro che manca in Europa, è la disciplina nel dire di no."}, {"q": "Il reporter entra nel sito «dopo un severo controllo di sicurezza» e ci mostra le cupole da vicino. Secondo te, che cosa aggiunge un servizio filmato sul posto rispetto a un articolo scritto? E che cosa, invece, si perde?", "m": "Aggiunge le dimensioni. Leggendo «cupola del reattore» uno capisce le parole, ma è vedendo un uomo piccolissimo davanti a quel cemento che si capisce di che cosa si parla. Aggiunge anche le facce e le voci: quando Sigel dice «tra cinque anni», il tono conta quanto le parole. Si perde però la possibilità di fermarsi. In un articolo torno indietro, rileggo una cifra, controllo una data; in un video la cifra passa e resta l'impressione. E l'impressione è quasi sempre positiva, perché chi apre i cancelli decide anche che cosa fai vedere. Nel mio lavoro di traduttore è lo stesso: è rileggendo che si trovano gli errori, non ascoltando."}], "homework": [{"label": "Compiti — Scrittura", "bgCls": "red", "blockCls": "red-b", "h3color": "#E24E3E", "h3text": "✍ Una tecnologia del futuro (80–100 parole)", "bodyHTML": "Scrivi un breve testo su una tecnologia che secondo te cambierà la vita nei prossimi vent'anni: quale è, chi ci sta lavorando, dove, e perché proprio quella.<br><br><b>Domande guida:</b> Di che tecnologia si tratta? Chi la sviluppa e con quali soldi? Dove si costruisce o si sperimenta? Che cosa resta ancora irrisolto? Tu ci credi o no?<br><br>Usa almeno <b>cinque parole</b> della lezione (per esempio: <i>la centrale, il capitale di rischio, la tabella di marcia, sfruttare, irrisolto</i>) e almeno <b>tre strutture di messa in rilievo</b>: una <b>frase scissa</b> (<i>è in Germania che...</i>), una <b>scissa di soggetto con a + infinito</b> (<i>sono i privati a...</i>) e una <b>pseudoscissa</b> (<i>quello che manca è...</i>). Attenzione al verbo <i>essere</i>: non copia il tempo della relativa!", "chips": ["80–100 parole", "5 parole nuove", "è... che / è... a / quello che"]}], "grammar_practice": [{"title": "Scissa, pseudoscissa o niente?", "instr": "Per ogni frase indica se contiene una FRASE SCISSA, una PSEUDOSCISSA, oppure NESSUNA DELLE DUE (rilievo ottenuto solo con l'ordine delle parole o con un avverbio).", "items": ["1.  Ora è qui che verrà costruito il nuovo impianto a fusione laser.", "2.  Restano però enormi sfide tecniche.", "3.  Quello che resta irrisolto è il ciclo del combustibile.", "4.  Perché proprio Biblis?", "5.  È RWE ad aver investito 60 milioni di euro.", "6.  Le enormi cupole dei reattori, però, resteranno al loro posto.", "7.  Ciò che attira il capitale di rischio è la tecnologia laser.", "8.  Non è la tecnologia che manca, è il tempo."], "answers": ["1.  SCISSA — essere + qui (luogo) + che; il verbo essere resta al presente.", "2.  NESSUNA — solo inversione: il verbo precede e il soggetto va in fondo, dove cade l'informazione nuova.", "3.  PSEUDOSCISSA — quello che + verbo + è + l'elemento in rilievo.", "4.  NESSUNA — rilievo lessicale con l'avverbio focalizzante proprio.", "5.  SCISSA — scissa di soggetto nella variante a + infinito (qui a + infinito composto).", "6.  NESSUNA — il soggetto è anteposto e ripreso dalla pausa; è enfasi tematica, non una scissa.", "7.  PSEUDOSCISSA — ciò che equivale a quello che.", "8.  SCISSA (negativa) — la scissa serve qui a correggere: non X, ma Y."]}, {"title": "Metti in rilievo l'elemento indicato", "instr": "Riscrivi la frase con una frase scissa, mettendo in rilievo l'elemento tra parentesi. Scrivi solo la frase nuova.", "items": ["1.  Il nuovo impianto verrà costruito a Biblis.  (a Biblis)", "2.  RWE ha investito 60 milioni di euro.  (RWE)", "3.  Focused Energy ha raccolto 240 milioni di dollari questa primavera.  (questa primavera)", "4.  I critici ritengono che la tecnologia sia troppo costosa.  (i critici)", "5.  Parliamo del ciclo del combustibile.  (del ciclo del combustibile)", "6.  Sigel ha accompagnato la troupe nel sito.  (Sigel)"], "answers": ["1.  È a Biblis che verrà costruito il nuovo impianto.  — scissa di luogo; essere al presente.", "2.  È RWE che ha investito 60 milioni di euro.  (oppure: È RWE ad avere investito 60 milioni di euro.)", "3.  È questa primavera che Focused Energy ha raccolto 240 milioni di dollari.  — scissa di tempo.", "4.  Sono i critici a ritenere che la tecnologia sia troppo costosa.  (oppure: Sono i critici che ritengono...)", "5.  È del ciclo del combustibile che parliamo.  (più formale: È il ciclo del combustibile di cui parliamo.)", "6.  È Sigel ad avere accompagnato la troupe nel sito.  (oppure: È Sigel che ha accompagnato la troupe nel sito.)"]}, {"title": "Che o a + infinito? E quale tempo per «essere»?", "instr": "Cerchia la forma corretta. Ricorda:   const cols = el('div','disc-cols'); const col1 = el('div','disc-col');
  const ubox = el('div','disc-user-box'); ubox.id = 'dubox'; ubox.appendChild(el('span','ph', UI.micPh));
  ap(col1, el('div','disc-col-label', UI.yourAnswer), ubox);
  const col2 = el('div','disc-col'); const mbox = el('div','disc-model-box blur'); mbox.id = 'dmbox';
  const mtext = el('div','mtext',''); mtext.id = 'dmtext'; mbox.appendChild(mtext);
  const revBtn = el('button','reveal-btn', UI.reveal); revBtn.onclick = revealModel;
  ap(col2, el('div','disc-col-label', UI.modelAnswer), mbox, revBtn); ap(cols, col1, col2);
  const microw = el('div','mic-row'); const micbtn = el('button','mic-btn','🎤'); micbtn.id = 'micbtn'; micbtn.onclick = toggleMic;
  const micstat = el('div','mic-status', UI.micStart); micstat.id = 'micstat'; ap(microw, micbtn, micstat);
  const nav = el('div','disc-nav');
  const prevBtn = el('button','disc-nav-btn', UI.prev); prevBtn.id = 'dprev'; prevBtn.onclick = () => dNav(-1);
  const nextBtn = el('button','disc-nav-btn', UI.next); nextBtn.id = 'dnext'; nextBtn.onclick = () => { if (dIdx >= DISC.length - 1) go(1); else dNav(1); };
  ap(nav, prevBtn, nextBtn); ap(card, topbar, dq, cols, microw, nav); ap(s, head, warn, card);
}

function makeHWSlide(h) {
  const s = makeSlide(h.label, 'hw-slide ' + (h.bgCls || ''));
  const head = el('div','slide-head'); ap(head, el('h2','', h.label), el('div','sub', UI.hwSub));
  const block = el('div','hw-block ' + (h.blockCls || ''));
  const h3 = el('h3','', h.h3text); if (h.h3color) h3.style.color = h.h3color;
  const body = document.createElement('div'); body.innerHTML = h.bodyHTML; body.style.cssText = 'font-size:1.6vw;line-height:1.9;flex:1';
  ap(block, h3, body);
  if (h.chips && h.chips.length) { const row = el('div','chip-row'); h.chips.forEach(t => row.appendChild(el('span','chip', t))); block.appendChild(row); }
  ap(s, head, block);
}

// ── BUILD (B1 shape: warm-up → vocab → video → reading → grammar → comprehension → exercises → discussion → homework)
function build() {
  const D = SPEC.dividers || {};
  makeTitle(SPEC.title_slide || {});

  makeDivider(D.warmup);
  makeQuestionsSlide(UI.warmupLabel, UI.warmupH2, UI.warmupSub, UI.warmupBox, SPEC.warmup.questions);
  if (SPEC.warmup.episode) makeProseSlide('Riscaldamento — Di cosa parla?', SPEC.warmup.episode.h2, SPEC.warmup.episode.sub, SPEC.warmup.episode.body);
  if (SPEC.figures) makeFiguresSlide(SPEC.figures);

  makeDivider(D.vocab);
  const per = 2; // rule: 8 cards per slide (2 groups × 4)
  for (let i = 0; i < VOCAB.length; i += per) {
    makeVocabSlide('Parole chiave — ' + (Math.floor(i/per) + 1) + '/' + Math.ceil(VOCAB.length/per), VOCAB.slice(i, i + per));
  }

  if (SPEC.video && SPEC.video.parts && SPEC.video.parts.length) {
    makeDivider(D.video);
    const vid = ytId(SPEC.video.url || SPEC.video.video_id);
    SPEC.video.parts.forEach((p, i) => makeVideoPartSlide(p, i, SPEC.video.parts.length, vid));
  }

  if (SPEC.reading) { makeDivider(D.reading); makeReadingSlide(SPEC.reading); }

  if (SPEC.grammar && SPEC.grammar.length) { makeDivider(D.grammar); SPEC.grammar.forEach(makeGramSlide); }

  makeDivider(D.comprehension);
  (SPEC.comprehension || []).forEach(makeCompSlide);

  makeDivider(D.exercises);
  if (SPEC.gapfill) { makeGapSlide(SPEC.gapfill); makeGapAnswerSlide(SPEC.gapfill); }
  if (SPEC.match) makeMatchSlide(SPEC.match);
  if (SPEC.verofalso) makeVFSlide(SPEC.verofalso);

  makeDivider(D.discussion);
  makeDiscSlide();

  if (SPEC.homework && SPEC.homework.length) { makeDivider(D.homework); SPEC.homework.forEach(makeHWSlide); }
}
build();

// ── NAVIGATION ───────────────────────────────────────────────────
const TOTAL = SLIDES.length; let cur = 0;
SLIDES[0].el.classList.add('active');
const DISC_IDX = SLIDES.findIndex(s => s.el.classList.contains('disc-slide'));
function go(d) {
  SLIDES[cur].el.classList.remove('active');
  cur = Math.max(0, Math.min(TOTAL - 1, cur + d));
  SLIDES[cur].el.classList.add('active'); SLIDES[cur].el.scrollTop = 0; updateNav();
  if (cur === DISC_IDX) initMicPermission();
}
function updateNav() {
  document.getElementById('slide-label').textContent = (cur+1) + ' / ' + TOTAL + ' — ' + SLIDES[cur].label;
  document.getElementById('pb').style.width = ((cur+1)/TOTAL*100) + '%';
  document.getElementById('btn-prev').disabled = cur === 0;
  document.getElementById('btn-next').disabled = cur === TOTAL-1;
}
updateNav();
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(1);
  if (e.key === 'ArrowLeft') go(-1);
  if ((e.key==='r'||e.key==='R') && cur===DISC_IDX) toggleMic();
});

// ── GAP FILL ─────────────────────────────────────────────────────
let selWord = null;
function wireGap() {
  const wb = document.getElementById('wb'); const gs = document.getElementById('gap-sents'); if (!wb || !gs) return;
  [...GAP_WORDS].sort(()=>Math.random()-0.5).forEach(w => {
    const d = el('div','dword', w); d.dataset.w = w;
    d.onclick = () => { if (d.classList.contains('used')) return; document.querySelectorAll('.dword').forEach(x=>x.classList.remove('sel-w')); d.classList.add('sel-w'); selWord = w; };
    wb.appendChild(d);
  });
  GAP_SENTS.forEach(s => { const d = el('div','gap-sentence'); d.innerHTML = s.pre + ' <span class="drop-zone" data-blank="'+s.blank+'" onclick="fillZone(this)">_ _ _ _ _</span> ' + s.post; gs.appendChild(d); });
}
function fillZone(z) {
  if (!selWord || z.classList.contains('ok')) return;
  document.querySelectorAll('.drop-zone').forEach(oz=>{ if(oz!==z && oz.dataset.filled===selWord){oz.textContent='_ _ _ _ _';oz.classList.remove('filled','ok','wrong');oz.dataset.filled='';} });
  z.textContent = selWord; z.classList.add('filled'); z.dataset.filled = selWord;
  document.querySelectorAll('.dword').forEach(d=>d.classList.remove('sel-w')); selWord = null;
}
function checkGap() { document.querySelectorAll('.drop-zone').forEach(z=>{ z.classList.remove('ok','wrong'); if(z.dataset.filled===z.dataset.blank) z.classList.add('ok'); else if(z.dataset.filled) z.classList.add('wrong'); }); }
function resetGap() { document.querySelectorAll('.drop-zone').forEach(z=>{z.textContent='_ _ _ _ _';z.classList.remove('filled','ok','wrong');z.dataset.filled='';}); document.querySelectorAll('.dword').forEach(d=>d.classList.remove('used','sel-w')); selWord = null; }

// ── MATCHING ─────────────────────────────────────────────────────
let selTerm = null;
function wireMatch() {
  const tc = document.getElementById('mterms'), dc = document.getElementById('mdefs'); if (!tc || !dc) return;
  const shuffled = [...MATCH].sort(()=>Math.random()-0.5);
  MATCH.forEach((m,i)=>{ const e2 = el('div','mitem', m.t); e2.dataset.pair = i; e2.dataset.side='t';
    e2.onclick = () => { if (e2.classList.contains('matched')) return; document.querySelectorAll('.mitem[data-side="t"]').forEach(x=>x.classList.remove('sel')); e2.classList.add('sel'); selTerm = e2; };
    tc.appendChild(e2); });
  shuffled.forEach(m=>{ const oi = MATCH.findIndex(x=>x.d===m.d); const e2 = el('div','mitem', m.d); e2.dataset.pair = oi; e2.dataset.side='d';
    e2.onclick = () => { if (!selTerm || e2.classList.contains('matched')) return;
      if (selTerm.dataset.pair === e2.dataset.pair) { selTerm.classList.remove('sel'); selTerm.classList.add('matched'); e2.classList.add('matched'); selTerm = null; }
      else { e2.classList.add('bad'); setTimeout(()=>e2.classList.remove('bad'),500); const st = selTerm; selTerm = null; st.classList.add('bad'); setTimeout(()=>st.classList.remove('bad','sel'),500); } };
    dc.appendChild(e2); });
}

// ── VERO / FALSO / NON DETTO ──────────────────────────────────
function wireVF() {
  const root = document.getElementById('vf-root'); if (!root) return;
  VF.forEach((item,i)=>{
    const row = el('div','vf-row'); const btns = el('div','vf-btns');
    UI.vfBtns.forEach(([cls,val])=>{ const b = el('button','vfb '+cls, val); b.onclick = () => checkVF(b, cls, item.a, i); btns.appendChild(b); });
    const body = document.createElement('div'); body.style.flex='1';
    body.appendChild(el('div','', String(i+1)+'. '+item.s));
    if (item.note) { const n = el('div','vf-note','→ '+item.note); n.id='vfn'+i; body.appendChild(n); }
    ap(row, btns, body); root.appendChild(row);
  });
}
function checkVF(btn, chosen, correct, idx) {
  btn.closest('.vf-row').querySelectorAll('.vfb').forEach(b=>b.classList.remove('correct','incorrect'));
  if (chosen===correct) btn.classList.add('correct');
  else { btn.classList.add('incorrect'); const n=document.getElementById('vfn'+idx); if(n) n.classList.add('show'); }
}

// ── DISCUSSION + MIC ─────────────────────────────────────────────
let dIdx=0, recog=null, recording=false, micOK=false, micStream=null;
function wireDisc() {
  const dots = document.getElementById('ddots'); if (!dots) return;
  DISC.forEach((_,i)=>{ const d = el('div','disc-dot'+(i===0?' active':'')); d.onclick = () => gotoDisc(i); dots.appendChild(d); });
  loadDisc();
}
function loadDisc() {
  const dq = document.getElementById('dq'); if (!dq) return;
  dq.textContent = DISC[dIdx].q;
  document.getElementById('dqnum').textContent = (dIdx+1) + '. ' + UI.question + UI.ofN + DISC.length;
  document.getElementById('dmtext').textContent = DISC[dIdx].m;
  document.getElementById('dmbox').classList.add('blur');
  if (!recording) { const ub = document.getElementById('dubox'); ub.innerHTML=''; ub.appendChild(el('span','ph', UI.micPh)); ub.classList.remove('listening'); }
  document.querySelectorAll('.disc-dot').forEach((d,i)=>d.classList.toggle('active', i===dIdx));
  const pb = document.getElementById('dprev'), nb = document.getElementById('dnext');
  if (pb) pb.disabled = dIdx === 0;
  if (nb) { const last = dIdx >= DISC.length - 1; nb.textContent = last ? UI.nextSlide : UI.next; nb.classList.toggle('to-slide', last); }
}
function dNav(d) { document.querySelectorAll('.disc-dot')[dIdx].classList.add('done'); dIdx = Math.max(0, Math.min(DISC.length-1, dIdx+d)); loadDisc(); }
function gotoDisc(i){ dIdx=i; loadDisc(); }
function revealModel(){ document.getElementById('dmbox').classList.toggle('blur'); }
function initMicPermission() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { const w=document.getElementById('swarn'); if(w) w.style.display='block'; return; }
  if (micOK && micStream && micStream.active) return;
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(stream => { micStream = stream; micOK = true; const st = document.getElementById('micstat'); if (st) st.textContent = UI.micReady; })
      .catch(e => { if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) { const w=document.getElementById('swarn'); if(w) w.style.display='block'; } });
  }
}
function toggleMic(){ recording ? stopMic() : startMic(); }
function startMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) return;
  recog = new SR(); recog.lang='it-IT'; recog.continuous=true; recog.interimResults=true;
  const box = document.getElementById('dubox'); box.innerHTML=''; box.classList.add('listening');
  let final='';
  recog.onresult = e => { let interim=''; for (let i=e.resultIndex; i<e.results.length; i++) { if (e.results[i].isFinal) final += e.results[i][0].transcript + ' '; else interim += e.results[i][0].transcript; } box.textContent = final + interim; micOK = true; };
  recog.onerror = e => { if (e.error!=='no-speech') stopMic(); };
  recog.onend = () => { if (recording) recog.start(); };
  recog.start(); recording = true;
  document.getElementById('micbtn').classList.add('on'); document.getElementById('micbtn').textContent = '⏹';
  document.getElementById('micstat').textContent = UI.micRec;
}
function stopMic() {
  if (recog) { recog.stop(); recog=null; } recording=false;
  document.getElementById('micbtn').classList.remove('on'); document.getElementById('micbtn').textContent = '🎤';
  document.getElementById('micstat').textContent = UI.micPause; document.getElementById('dubox').classList.remove('listening');
}
function toggleAK(id){ document.getElementById(id).classList.toggle('show'); }

wireGap(); wireMatch(); wireVF(); wireDisc();

// ── Text-size control ────────────────────────────────────────────
(function(){
  let z = 100;
  const bar = document.createElement('div'); bar.id='tsize';
  bar.innerHTML = '<span>' + UI.tsize + '</span><button id="tsm">A−</button><span id="tsv">100%</span><button id="tsp">A+</button><button id="tsr">⟲</button>';
  const _tb=document.getElementById('topbar'), _nb=document.getElementById('nav-btns');
  if(_tb && _nb) _tb.insertBefore(bar, _nb); else document.body.appendChild(bar);
  function apply(){ document.getElementById('viewport').style.zoom = (z/100); document.getElementById('tsv').textContent = z+'%'; }
  document.getElementById('tsm').onclick = ()=>{ z=Math.max(70,z-10); apply(); };
  document.getElementById('tsp').onclick = ()=>{ z=Math.min(220,z+10); apply(); };
  document.getElementById('tsr').onclick = ()=>{ z=100; apply(); };
})();
</script>
