<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Il primo astronauta greco: «La conoscenza è un antidoto alla paura» — Goodman Italiano B1</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: Calibri, 'Segoe UI', sans-serif;
  background: #0e8388;
  color: #1e2a2e;
}

/* ── TOP BAR ── */
#pb-wrap { position: fixed; top: 0; left: 0; right: 0; height: 5px; background: rgba(255,255,255,0.2); z-index: 200; }
#pb { height: 5px; background: #fb6a5a; transition: width 0.3s; width: 0%; }

#topbar {
  position: fixed; top: 5px; left: 0; right: 0; height: 50px;
  background: #0e8388; z-index: 199;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2vw;
  border-bottom: 1px solid rgba(255,255,255,0.18);
}
#slide-label { color: white; font-size: 1.5vw; font-weight: 700; }
#nav-btns { display: flex; gap: 1vw; }
.nbtn {
  background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.3);
  color: white; padding: 0.4vh 1.5vw; border-radius: 5px;
  cursor: pointer; font-size: 1.3vw; font-family: inherit; font-weight: 600;
}
.nbtn:hover { background: rgba(255,255,255,0.28); }
.nbtn:disabled { opacity: 0.3; cursor: default; }

/* ── VIEWPORT ── */
#viewport {
  position: fixed;
  top: 55px; left: 0; right: 0; bottom: 0;
}

/* ── SLIDES ── */
.slide {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease;
  overflow: hidden;
}
.slide.active { opacity: 1; pointer-events: all; }

/* ════════════════════════════════
   DIVIDER SLIDES
════════════════════════════════ */
.div-slide {
  background: linear-gradient(160deg, #073c40 0%, #0e8388 60%, #0a5458 100%);
  color: white;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  padding: 3vh 6vw;
  position: relative;
}
.div-slide::after {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0;
  height: 0.8vh; background: #fb6a5a;
}
.div-icon { font-size: 7vw; line-height: 1; margin-bottom: 2vh; }
.div-num { font-size: 1.2vw; letter-spacing: 0.4vw; text-transform: uppercase; opacity: 0.5; margin-bottom: 1.5vh; font-weight: 700; }
.div-slide h2 { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 5.5vw; line-height: 1.1; margin-bottom: 2.5vh; }
.div-desc { font-size: 1.7vw; opacity: 0.78; max-width: 70vw; line-height: 1.6; margin-bottom: 3.5vh; }
.div-tags { display: flex; flex-wrap: wrap; gap: 1vw; justify-content: center; max-width: 75vw; }
.div-tag {
  background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.28);
  border-radius: 3vw; padding: 0.8vh 2vw; font-size: 1.3vw;
}

/* ════════════════════════════════
   TITLE SLIDE
════════════════════════════════ */
.title-slide {
  background: linear-gradient(150deg, #052b2e 0%, #0e8388 100%);
  color: white;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  padding: 3vh 4vw;
}
.pod-label { font-size: 1.5vw; letter-spacing: 0.4vw; text-transform: uppercase; color: #fb6a5a; margin-bottom: 3vh; font-weight: 700; }
.title-slide h1 { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 6.5vw; line-height: 1.15; width: 90vw; margin-bottom: 3.5vh; }
.red-line { width: 6vw; height: 0.6vh; background: #fb6a5a; margin: 0 auto 3vh; }
.title-meta { display: flex; gap: 4vw; font-size: 1.8vw; opacity: 0.65; flex-wrap: wrap; justify-content: center; }

/* ════════════════════════════════
   CONTENT SLIDE BASE
════════════════════════════════ */
.con-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.slide-head {
  border-left: 0.5vw solid #fb6a5a;
  padding-left: 1.5vw;
  margin-bottom: 2.5vh;
  flex-shrink: 0;
}
.slide-head h2 { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; color: #0e8388; font-size: 3.2vw; line-height: 1.15; margin-bottom: 0.4vh; }
.sub { color: #5e7377; font-size: 1.3vw; }

/* ════════════════════════════════
   ANTICIPAZIONE — split slides
════════════════════════════════ */
.single-box {
  flex: 1;
  background: #e6f3f2;
  border-radius: 1vw;
  padding: 3vh 3vw;
  border-top: 0.5vh solid #0e8388;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.single-box h3 { color: #0e8388; font-size: 2.2vw; margin-bottom: 2.5vh; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; }
.single-box ol { padding-left: 2.5vw; flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
.single-box ol li { font-size: 2vw; line-height: 1.6; }
.single-box p { font-size: 2vw; line-height: 1.75; flex: 1; display: flex; align-items: center; }

/* ════════════════════════════════
   FIGURE CHIAVE
════════════════════════════════ */
.figures-slide {
  background: #ffeae6;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.figures-slide .slide-head { border-color: #fb6a5a; }
.figures-slide .slide-head h2 { color: #e24e3e; }
.figures-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr 1fr;
  gap: 1.5vh 2vw;
  flex: 1;
}
.figure-card {
  background: white; border-radius: 0.8vw;
  border-left: 0.5vw solid #fb6a5a;
  padding: 1.5vh 2vw;
  display: flex; flex-direction: column; justify-content: center;
}
.figure-card .fname { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 1.9vw; font-weight: 700; color: #0e8388; margin-bottom: 0.8vh; }
.figure-card .fdesc { font-size: 1.35vw; color: #3a4a4e; line-height: 1.5; }

/* ════════════════════════════════
   VOCABULARY
════════════════════════════════ */
.vocab-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 2vh 4vw 2vh;
  overflow: hidden;
}
.vocab-group-label {
  font-size: 1.1vw; letter-spacing: 0.2vw; text-transform: uppercase;
  color: #5e7377; font-weight: 700; margin: 1.2vh 0 1vh;
  padding-bottom: 0.6vh; border-bottom: 2px solid #d7e6e4;
  flex-shrink: 0;
}
.vocab-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 1.2vh 2vw; flex: 1;
}
.vcard {
  background: white; border-radius: 0.8vw;
  box-shadow: 0 3px 12px rgba(0,0,0,0.09);
  cursor: pointer; perspective: 900px;
}
.vcard-inner {
  width: 100%; height: 100%; position: relative;
  transform-style: preserve-3d; transition: transform 0.45s;
}
.vcard.flipped .vcard-inner { transform: rotateY(180deg); }
.vfront, .vback {
  position: absolute; width: 100%; height: 100%;
  border-radius: 0.8vw; padding: 1.8vh 1.8vw;
  backface-visibility: hidden;
  display: flex; flex-direction: column; justify-content: space-between;
}
.vfront { background: white; }
.vfront .term { font-size: 2vw; font-weight: 700; color: #1e2a2e; line-height: 1.3; flex: 1; display: flex; align-items: center; }
.vfront .vbottom { display: flex; flex-direction: column; gap: 0.6vh; flex-shrink: 0; }
.vfront .rtag { display: inline-block; font-size: 1vw; padding: 0.3vh 0.8vw; border-radius: 2vw; background: #e6f3f2; color: #0e8388; font-weight: 600; align-self: flex-start; }
.vfront .hint { font-size: 1.1vw; color: #9bb0b2; }
.vback { background: #e6f3f2; transform: rotateY(180deg); }
.vback .en { font-size: 1.8vw; font-weight: 700; color: #0e8388; margin-bottom: 1vh; }
.vback .ex { font-size: 1.2vw; font-style: italic; color: #1e2a2e; border-left: 0.3vw solid #fb6a5a; padding-left: 0.8vw; line-height: 1.55; flex: 1; }
.vback .rnote { font-size: 0.95vw; color: #5e7377; margin-top: 0.8vh; flex-shrink: 0; }

/* ════════════════════════════════
   GRAMMAR
════════════════════════════════ */
.gram-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.gram-block {
  background: white; border-radius: 1vw;
  padding: 3vh 3vw;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  border-left: 0.6vw solid #0a6e72;
  flex: 1; display: flex; flex-direction: column;
}
.gram-block h3 { color: #0e8388; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 2.5vw; margin-bottom: 1.5vh; line-height: 1.2; }
.gram-block .expl { font-size: 1.55vw; color: #3a4a4e; line-height: 1.7; margin-bottom: 2vh; flex-shrink: 0; }
.gram-block ul { list-style: none; padding: 0; flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
.gram-block ul li { background: #e6f3f2; border-radius: 0.6vw; padding: 1.5vh 1.5vw; font-size: 1.45vw; font-style: italic; line-height: 1.6; }
.gram-block ul li strong { font-style: normal; color: #fb6a5a; font-size: 1.5vw; }
.gram-block .snote { font-size: 1.35vw; color: #1E8449; font-weight: 600; margin-top: 2vh; line-height: 1.55; padding: 1.5vh 1.5vw; background: #EAFAF1; border-radius: 0.6vw; flex-shrink: 0; }

/* ════════════════════════════════
   COMPREHENSION
════════════════════════════════ */
.comp-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.comp-label { font-size: 1.2vw; letter-spacing: 0.2vw; text-transform: uppercase; color: #5e7377; margin-bottom: 2vh; font-weight: 700; padding-bottom: 1vh; border-bottom: 2px solid #d7e6e4; flex-shrink: 0; }
.qlist { flex: 1; display: flex; flex-direction: column; gap: 1.5vh; }
.qitem { background: white; border-radius: 0.8vw; padding: 2vh 2.5vw; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; gap: 1.5vw; font-size: 1.8vw; line-height: 1.65; flex: 1; align-items: center; }
.qnum { color: #fb6a5a; font-weight: 700; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 2.2vw; min-width: 2.5vw; flex-shrink: 0; }

/* ════════════════════════════════
   CULTURAL
════════════════════════════════ */
.cult-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.cult-block {
  background: white; border-radius: 1vw;
  padding: 3vh 3vw;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  border-left: 0.6vw solid #fb6a5a;
  flex: 1; display: flex; flex-direction: column;
}
.cult-block h3 { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; color: #0e8388; font-size: 2.4vw; margin-bottom: 2vh; line-height: 1.2; flex-shrink: 0; }
.cult-block p { font-size: 1.6vw; line-height: 1.8; flex: 1; }
.en-gl { font-style: italic; color: #5e7377; font-size: 1.2vw; margin-top: 1.5vh; display: block; flex-shrink: 0; }
.cult-hook { margin-top: 2.5vh; padding: 1.5vh 2vw; background: #fff1ef; border-radius: 0.6vw; font-size: 1.45vw; color: #e24e3e; line-height: 1.6; flex-shrink: 0; }

/* ════════════════════════════════
   EXERCISES
════════════════════════════════ */
.ex-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.ex-block {
  background: white; border-radius: 1vw;
  padding: 2.5vh 3vw;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  flex: 1; display: flex; flex-direction: column;
}
.ex-block h3 { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; color: #0e8388; font-size: 2.2vw; margin-bottom: 0.8vh; flex-shrink: 0; }
.ex-instr { font-size: 1.3vw; color: #5e7377; margin-bottom: 1.8vh; line-height: 1.6; flex-shrink: 0; }

/* Gap fill */
.word-bank { display: flex; flex-wrap: wrap; gap: 1vw; margin-bottom: 2vh; padding: 1.5vh 1.5vw; background: #e6f3f2; border-radius: 0.8vw; flex-shrink: 0; }
.dword { background: #0e8388; color: white; padding: 0.8vh 2vw; border-radius: 3vw; font-size: 1.5vw; cursor: pointer; user-select: none; font-weight: 600; }
.dword.sel-w { outline: 0.3vw solid #fb6a5a; outline-offset: 0.2vw; }
.dword.used { opacity: 0.3; cursor: default; }
.gap-sentences { flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
.gap-sentence { font-size: 1.6vw; line-height: 1.4; }
.drop-zone { display: inline-block; min-width: 10vw; border-bottom: 0.2vw solid #0e8388; margin: 0 0.5vw; padding: 0 0.5vw; color: #9bb0b2; font-style: italic; cursor: pointer; vertical-align: bottom; font-size: 1.5vw; }
.drop-zone.filled { color: #1e2a2e; font-style: normal; font-weight: 700; background: #e6f3f2; border-radius: 0.3vw; border-bottom-color: #0a6e72; }
.drop-zone.ok { border-bottom-color: #1E8449; background: #EAFAF1; color: #1E8449; }
.drop-zone.wrong { border-bottom-color: #fb6a5a; background: #ffeae6; color: #fb6a5a; }
.ex-btns { display: flex; gap: 1vw; margin-top: 1.5vh; flex-shrink: 0; }

/* Answer key slide */
.ak-slide {
  background: #EAFAF1;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.ak-slide .slide-head { border-color: #1E8449; }
.ak-slide .slide-head h2 { color: #1E8449; }
.ak-content { background: white; border-radius: 1vw; padding: 2vh 3vw; box-shadow: 0 4px 16px rgba(0,0,0,0.08); border-left: 0.6vw solid #1E8449; flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
.ak-item { display: flex; gap: 1.5vw; align-items: center; padding: 1.5vh 2vw; background: #F4FDF8; border-radius: 0.6vw; font-size: 1.55vw; line-height: 1.6; }
.ak-num { color: #1E8449; font-weight: 700; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 2vw; min-width: 2.5vw; }
.ak-word { font-weight: 700; color: #1E8449; }
.ak-quote { font-style: italic; color: #5e7377; }

/* Matching */
.match-wrap { flex: 1; display: flex; flex-direction: column; }
.match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2vw; flex: 1; margin-bottom: 1.5vh; }
.match-col-label { font-size: 1.1vw; letter-spacing: 0.2vw; text-transform: uppercase; color: #5e7377; margin-bottom: 1vh; font-weight: 700; }
.mitem { padding: 1.5vh 1.8vw; border-radius: 0.6vw; margin-bottom: 0.8vh; font-size: 1.45vw; cursor: pointer; border: 0.2vw solid transparent; background: #e6f3f2; transition: all 0.18s; line-height: 1.45; }
.mitem:hover { border-color: #0a6e72; }
.mitem.sel { border-color: #0e8388; background: #cde9e7; font-weight: 700; }
.mitem.matched { border-color: #1E8449; background: #EAFAF1; color: #1E8449; cursor: default; font-weight: 600; }
.mitem.bad { border-color: #fb6a5a; background: #ffeae6; }

/* VF */
.vf-list { flex: 1; display: flex; flex-direction: column; gap: 1.2vh; }
.vf-row { display: flex; gap: 1.5vw; align-items: center; padding: 1.8vh 2vw; background: white; border-radius: 0.8vw; box-shadow: 0 2px 8px rgba(0,0,0,0.06); font-size: 1.5vw; line-height: 1.6; flex: 1; }
.vf-btns { display: flex; gap: 0.6vw; flex-shrink: 0; }
.vfb { padding: 0.6vh 1.2vw; border-radius: 2vw; border: 0.2vw solid; font-size: 1.2vw; font-weight: 700; cursor: pointer; background: transparent; font-family: inherit; }
.vfb.V { border-color: #1E8449; color: #1E8449; }
.vfb.F { border-color: #fb6a5a; color: #fb6a5a; }
.vfb.N { border-color: #5e7377; color: #5e7377; }
.vfb.correct { background: #1E8449; color: white; border-color: #1E8449; }
.vfb.incorrect { background: #fb6a5a; color: white; border-color: #fb6a5a; }
.vf-note { font-size: 1.1vw; color: #1E8449; font-style: italic; margin-top: 0.5vh; display: none; }
.vf-note.show { display: block; }

/* Buttons */
.ak-btn { padding: 1vh 2vw; background: #1E8449; color: white; border: none; border-radius: 0.5vw; cursor: pointer; font-size: 1.3vw; font-weight: 700; font-family: inherit; flex-shrink: 0; }
.ak-btn:hover { opacity: 0.85; }
.ak-btn.grey { background: #5e7377; }
.answer-key { display: none; margin-top: 1.5vh; padding: 1.5vh 2vw; background: #EAFAF1; border-radius: 0.8vw; border-left: 0.4vw solid #1E8449; font-size: 1.3vw; line-height: 1.9; flex-shrink: 0; }
.answer-key.show { display: block; }

/* ════════════════════════════════
   DISCUSSION
════════════════════════════════ */
.disc-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.disc-card { background: white; border-radius: 1vw; padding: 2.5vh 3vw; box-shadow: 0 4px 16px rgba(0,0,0,0.08); flex: 1; display: flex; flex-direction: column; }
.disc-topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2vh; flex-shrink: 0; }
.disc-dots { display: flex; gap: 0.8vw; }
.disc-dot { width: 1.2vw; height: 1.2vw; border-radius: 50%; background: #e6f3f2; border: 0.2vw solid #0a6e72; cursor: pointer; }
.disc-dot.active { background: #0e8388; }
.disc-dot.done { background: #1E8449; border-color: #1E8449; }
.disc-qnum { font-size: 1.4vw; color: #5e7377; font-weight: 600; }
.disc-q { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 2vw; line-height: 1.6; color: #1e2a2e; margin-bottom: 2vh; flex-shrink: 0; }
.disc-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 2vw; flex: 1; min-height: 0; }
.disc-col { display: flex; flex-direction: column; min-height: 0; }
.disc-col-label { font-size: 1.1vw; letter-spacing: 0.2vw; text-transform: uppercase; color: #5e7377; margin-bottom: 0.8vh; font-weight: 700; flex-shrink: 0; }
.disc-user-box { flex: 1; padding: 1.5vh 1.5vw; border-radius: 0.8vw; background: #e6f3f2; font-size: 1.4vw; line-height: 1.7; border: 0.2vw solid transparent; min-height: 0; overflow-y: auto; }
.disc-user-box.listening { border-color: #fb6a5a; background: #ffeae6; }
.disc-user-box .ph { color: #9bb0b2; font-style: italic; }
.disc-model-box { flex: 1; padding: 1.5vh 1.5vw; border-radius: 0.8vw; background: #EAFAF1; font-size: 1.3vw; line-height: 1.8; min-height: 0; overflow-y: auto; }
.disc-model-box.blur .mtext { filter: blur(6px); user-select: none; }
.reveal-btn { display: inline-block; margin-top: 0.8vh; padding: 0.7vh 1.8vw; background: #1E8449; color: white; border: none; border-radius: 0.5vw; font-size: 1.2vw; font-weight: 700; cursor: pointer; font-family: inherit; flex-shrink: 0; }
.mic-row { display: flex; align-items: center; gap: 1.5vw; margin-top: 1.5vh; flex-shrink: 0; }
.mic-btn { width: 5vw; height: 5vw; border-radius: 50%; border: none; background: #fb6a5a; color: white; font-size: 2.2vw; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(192,57,43,0.38); flex-shrink: 0; }
.mic-btn.on { background: #1E8449; animation: pulse 1.2s infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(30,132,73,0.5); } 50% { box-shadow: 0 0 0 1vw rgba(30,132,73,0); } }
.mic-status { font-size: 1.2vw; color: #5e7377; line-height: 1.5; }
.disc-nav { display: flex; gap: 1vw; justify-content: flex-end; margin-top: 1.5vh; flex-shrink: 0; }

possibile e seguendo protocolli ben definiti. Come medico di missioni spaziali conosce il lato sanitario del viaggio: le forti sollecitazioni del lancio, la nausea e la stanchezza dei primi giorni, poi l'adattamento del corpo a condizioni «esotiche» — la fase che, dice, lo colpisce di più. Parla anche del grande team che sostiene gli astronauti da terra, psicologi e psichiatri compresi, e insiste: su questo non deve esistere nessuno stigma, chiedere aiuto è normale e può avere un ruolo preventivo. Ammette un piccolo punto interrogativo, ma non lo chiama paura: «La conoscenza è in larga misura un antidoto alla paura». Vorrebbe portare con sé un oggetto simbolico greco — cita la musica di Vangelis come ponte tra cultura ed esplorazione dello spazio — ma è ancora presto: peso, volume e materiali devono rispettare limiti severi e un lungo processo di approvazione. Infine si dice certo che altri greci seguiranno le sue orme, perché l'ESA, di cui la Grecia è membro, seleziona nuovi astronauti circa ogni dieci-quindici anni."}]}, "reading": {"title": "Nel 2027 il primo astronauta greco sulla Stazione spaziale internazionale", "lead": "Adrianos Golemis racconta la missione storica che il prossimo anno lo porterà in orbita e che cosa si aspetta da questa esperienza.", "paragraphs": ["Se solo pochi anni fa qualcuno avesse detto che la Grecia avrebbe mandato una persona nello spazio, probabilmente nessuno gli avrebbe creduto. Ora però sta per diventare realtà: Adrianos Golemis raggiungerà la Stazione spaziale internazionale nel 2027. Come racconta lui stesso, sia il governo greco sia l'Hellenic Space Center hanno avuto un ruolo decisivo in questa scelta, e il merito va soprattutto alla dott.ssa Anezina Solomonidou e ai suoi colleghi, «che hanno lavorato instancabilmente per molto tempo».", "Che cosa farà lassù? «È un ruolo in parte simile a quello che avevo in Antartide», spiega. «In pratica sei le mani e i muscoli dei ricercatori che si trovano in Grecia e in Europa ed esegui gli esperimenti in questo ambiente unico di assenza di gravità, cercando di essere il più preciso e efficiente possibile. Ogni azione deve essere fatta con grande accuratezza e seguendo protocolli ben definiti.»", "Golemis è anche medico di missioni spaziali e conosce bene il lato sanitario di un viaggio del genere. Quello che lo colpisce di più è la fase centrale: «il modo in cui il corpo si abitua a queste condizioni esotiche». Lo ha già vissuto in parte in Antartide, dove ha trascorso un anno in isolamento svolgendo esperimenti per l'ESA: «quando arrivi hai molti interrogativi, ma quando torni ti sei già adattato, almeno mentalmente».", "Sul lancio non nasconde un piccolo punto interrogativo, ma non lo chiama paura: «So, ovviamente anche come medico, che cosa accade al corpo. Ci sono le forti sollecitazioni al momento del lancio, la normale apprensione in quell'istante e poi l'adattamento dell'organismo alle nuove condizioni. I primi giorni possono essere difficili, con nausea, vomito e una stanchezza molto intensa. D'altra parte, molti astronauti sono già stati prima di noi. La conoscenza, sapete, è in larga misura un antidoto alla paura.»", "Un grande team sostiene gli astronauti da terra, prima e durante la missione, e comprende psicologi e psichiatri. «È importante sottolinearlo», dice Golemis, «perché spesso pensiamo di rivolgerci a uno psicologo solo quando affrontiamo un problema molto grave. È fondamentale che non esista questo stigma.»", "Gli piacerebbe portare con sé un oggetto simbolico greco: «con la cultura che abbiamo la fortuna di rappresentare, credo che meriti fare qualcosa del genere». Cita la musica di Vangelis come ponte affascinante tra la cultura e l'esplorazione dello spazio. Per ora, però, è presto: tutto ciò che viaggia nello spazio deve essere piccolo e leggero, i materiali vengono analizzati e il processo di approvazione è lungo. Ed è certo che altri connazionali seguiranno le sue orme: l'Agenzia spaziale europea, di cui la Grecia è membro, seleziona nuovi astronauti circa ogni dieci-quindici anni."], "url": "https://it.euronews.com/2026/09/24/nel-2027-il-primo-astronauta-greco-sulla-stazione-spaziale-in-futuro-altri-connazionali-in"}, "grammar": [{"label": "Grammatica — Il periodo ipotetico controfattuale e le forme miste", "subtitle": "se avesse detto… nessuno avrebbe creduto · e quando i due tempi non coincidono", "title": "«Se solo pochi anni fa qualcuno avesse detto…» — parlare di ciò che non è accaduto", "expl": "Il servizio si apre con una frase che vale una lezione intera: «Se solo pochi anni fa qualcuno avesse detto che la Grecia avrebbe mandato una persona nello spazio, probabilmente nessuno gli avrebbe creduto». È il periodo ipotetico dell'IRREALTÀ, il terzo tipo. Ripassiamo prima lo schema generale. Il periodo ipotetico ha due parti: la PROTASI (la frase con se) e l'APODOSI (la conseguenza). Nel I tipo, la realtà, si usa l'indicativo: se studi, impari. Nel II tipo, la possibilità o l'irrealtà del presente, si usa se + congiuntivo imperfetto e il condizionale presente: se avessi tempo, studierei di più. Nel III tipo, l'irrealtà del passato, si usa se + congiuntivo trapassato e il condizionale passato: se qualcuno lo avesse detto, nessuno gli avrebbe creduto. Il III tipo si chiama anche CONTROFATTUALE, perché va contro i fatti: la condizione non si è realizzata, e quindi nemmeno la conseguenza. Attenzione a tre punti. 1) MAI il congiuntivo presente e MAI il condizionale dopo se: non si dice *se avrei tempo*, *se sia possibile*. Dopo se, nell'ipotesi, stanno solo l'indicativo (I tipo) o il congiuntivo imperfetto e trapassato (II e III tipo). 2) SE SOLO / SE SOLTANTO + congiuntivo esprime rimpianto o desiderio, e l'apodosi può anche mancare: «Se solo lo avessi saputo!». Nel testo, quel «se solo» segnala che siamo davanti a un'ipotesi che i fatti hanno smentito: la Grecia manda davvero una persona nello spazio. 3) Nella stessa frase c'è un secondo condizionale passato con un valore diverso: «la Grecia AVREBBE MANDATO una persona nello spazio» non è un'ipotesi, è il FUTURO NEL PASSATO. Quando il verbo principale è al passato (qualcuno avesse detto che…), il futuro della frase dipendente diventa condizionale passato, esattamente come nel discorso indiretto: «La Grecia manderà una persona nello spazio» → «disse che la Grecia avrebbe mandato una persona nello spazio». In inglese lo stesso lavoro lo fa would: la forma è identica a quella del condizionale, ma la funzione è temporale, non ipotetica. Ora le FORME MISTE, che nella lingua reale sono frequentissime. Non è obbligatorio che protasi e apodosi stiano sullo stesso piano temporale: si mescolano secondo la logica. a) Condizione nel passato, conseguenza nel presente: «Se non avesse trascorso un anno in Antartide, oggi non sarebbe così tranquillo» (congiuntivo trapassato + condizionale presente). b) Condizione permanente o attuale, conseguenza nel passato: «Se non fosse medico, non avrebbe capito subito che cosa gli stava accadendo» (congiuntivo imperfetto + condizionale passato). c) Condizione permanente, conseguenza nel futuro: «Se la Grecia non fosse membro dell'ESA, il suo astronauta non partirebbe nel 2027». La regola pratica è semplice: ogni metà della frase prende il tempo del suo proprio momento. Nel parlato, infine, esistono due varianti da riconoscere ma da non usare nello scritto formale: il doppio imperfetto indicativo, molto comune («se lo sapevo, non venivo»), e il doppio congiuntivo trapassato dell'Italia centro-meridionale («se lo avessi saputo, non fossi venuto»). Nota per chi traduce: l'inglese segna l'irrealtà con il backshift (if he had said… nobody would have believed him), l'italiano con il congiuntivo. Due trappole tipiche nella traduzione verso l'italiano: il would inglese va reso a volte con il condizionale (ipotesi) e a volte con l'imperfetto o il condizionale passato (abitudine nel passato, futuro nel passato); e l'inglese ammette if + would in cortesia (if you would follow me), mentre l'italiano non lo permette mai.", "examples": [["Se solo pochi anni fa qualcuno avesse detto che la Grecia avrebbe mandato una persona nello spazio, nessuno gli avrebbe creduto.", " — III tipo (irreale del passato): se + congiuntivo trapassato → condizionale passato. Dentro la dipendente, «avrebbe mandato» non è un'ipotesi: è il futuro nel passato."], ["Se non fossi medico, non saprei che cosa aspettarmi dal lancio.", " — II tipo (irreale del presente): se + congiuntivo imperfetto → condizionale presente. Condizione e conseguenza stanno entrambe nel presente."], ["Se non avesse trascorso un anno in Antartide, oggi non sarebbe così tranquillo.", " — forma MISTA: condizione nel passato (congiuntivo trapassato) e conseguenza nel presente (condizionale presente); «oggi» lo rende evidente."], ["Se la Grecia non fosse membro dell'ESA, il suo astronauta non partirebbe nel 2027.", " — forma MISTA: condizione permanente (congiuntivo imperfetto) e conseguenza nel futuro, espressa con il condizionale presente."], ["Se non fosse medico, non avrebbe capito subito che cosa gli stava accadendo.", " — forma MISTA rovesciata: condizione attuale e permanente, conseguenza nel passato (condizionale passato)."]], "snote": "Regola pratica: dopo se, mai il condizionale. Irreale del presente → congiuntivo imperfetto + condizionale presente; irreale del passato → congiuntivo trapassato + condizionale passato. Nelle forme miste ogni metà prende il tempo del suo momento (se non lo avesse fatto allora, oggi non sarebbe qui). E ricorda che «avrebbe mandato» dentro una frase al passato può essere semplicemente futuro nel passato, non un'ipotesi."}], "comprehension": [{"label": "Comprensione", "h2": "Comprensione", "sub": "1–3: fatti dal servizio · 4–6: domande aperte", "compLabel": "📺 Fatti dal servizio (1–3)  ·  💭 Domande aperte (4–6)", "questions": [["1.", "Chi è Adrianos Golemis e che cosa farà nel 2027?", "È un medico di missioni spaziali e sarà il primo astronauta greco: nel 2027 raggiungerà la Stazione spaziale internazionale. Dà il merito della scelta al governo greco e all'Hellenic Space Center, in particolare alla dott.ssa Anezina Solomonidou e ai suoi colleghi."], ["2.", "Come descrive il suo ruolo sulla Stazione spaziale, e a quale esperienza precedente lo paragona?", "Dice che sarà «le mani e i muscoli» dei ricercatori che restano in Grecia e in Europa: eseguirà gli esperimenti nell'assenza di gravità, con grande accuratezza e seguendo protocolli ben definiti. Lo paragona al ruolo che aveva in Antartide, dove ha trascorso un anno in isolamento svolgendo esperimenti per l'ESA."], ["3.", "Che cosa dice del lato sanitario della missione e del sostegno psicologico?", "Come medico sa che cosa accade al corpo: le forti sollecitazioni al momento del lancio, la normale apprensione, poi l'adattamento dell'organismo; i primi giorni possono essere difficili, con nausea e una stanchezza molto intensa. Un grande team lo sostiene da terra, psicologi e psichiatri compresi, e insiste che su questo non deve esistere nessuno stigma: chiedere aiuto è normale e può avere un ruolo preventivo. Aggiunge che «la conoscenza è in larga misura un antidoto alla paura»."], ["4.", "«La conoscenza è in larga misura un antidoto alla paura.» Nella tua esperienza funziona davvero così? Pensa a una situazione in cui sapere in anticipo che cosa ti aspettava ti ha aiutato — o non ti ha aiutato affatto.", "In gran parte funziona, almeno per me. La prima volta che ho fatto interpretazione simultanea ero teso, perché non sapevo come sarebbe andata; dalla seconda volta in poi conoscevo la procedura e l'apprensione è diventata semplicemente concentrazione. Però la conoscenza non basta sempre: se sai che una cosa sarà dolorosa, la paura resta, e anzi diventa più precisa. Direi che la conoscenza toglie la paura dell'ignoto, non la paura del pericolo reale. Golemis mi sembra molto onesto su questo: non dice di non avere paura, dice che ha «un piccolo punto interrogativo»."], ["5.", "Golemis parla apertamente di psicologi e psichiatri e dice che non deve esistere «questo stigma». Perché, secondo te, è utile che sia proprio un astronauta a dirlo?", "Perché un astronauta è l'immagine classica della persona forte, selezionata, preparata, che non dovrebbe avere bisogno di aiuto: se lo dice lui, l'argomento «è una cosa da debole» cade da solo. Poi c'è la questione pratica: nel suo lavoro il sostegno psicologico fa parte dei protocolli, come i controlli medici, e questo sposta il discorso dalla malattia alla prevenzione. È lo stesso meccanismo per cui gli sportivi che parlano del loro preparatore mentale cambiano l'idea che la gente ha di quel mestiere."], ["6.", "La Grecia investe in una missione spaziale «anche come catalizzatore per la scienza, la tecnologia, l'istruzione e l'innovazione». Se fossi tu a decidere, come spenderesti quei soldi? E se la Grecia non fosse membro dell'ESA, questa missione sarebbe possibile?", "Se la Grecia non fosse membro dell'ESA, una missione così non sarebbe possibile: da sola nessun Paese piccolo potrebbe pagarla, e infatti è proprio l'appartenenza all'agenzia europea che apre la porta. Sul come spendere i soldi sono in dubbio. Una missione ha un effetto simbolico enorme, soprattutto sui ragazzi: se a quindici anni avessi visto un ungherese partire per la Stazione spaziale, forse avrei studiato fisica invece di lingue. Però il simbolo dura poco se dietro non c'è niente: senza laboratori, borse di studio e stipendi decenti per i ricercatori, i giovani che quell'immagine ha ispirato vanno a lavorare all'estero. Quindi terrei la missione, perché costa relativamente poco, ma metterei la maggior parte del denaro nelle scuole e nelle università."]]}], "gapfill": {"heading": "Completa le frasi in base al servizio!", "words": ["assenza", "protocolli", "isolamento", "orme", "antidoto"], "sents": [{"pre": "1.  Sulla Stazione spaziale si eseguono gli esperimenti in un ambiente unico di", "blank": "assenza", "post": "di gravità."}, {"pre": "2.  Ogni azione deve essere fatta con grande accuratezza e seguendo", "blank": "protocolli", "post": "ben definiti."}, {"pre": "3.  In Antartide Golemis ha trascorso un anno in", "blank": "isolamento", "post": ", svolgendo esperimenti per l'ESA."}, {"pre": "4.  È certo che in futuro altri greci seguiranno le sue", "blank": "orme", "post": "."}, {"pre": "5.  «La conoscenza è in larga misura un", "blank": "antidoto", "post": "alla paura.»"}], "answers": [["1.", "assenza", "esegui gli esperimenti in questo ambiente unico di assenza di gravità"], ["2.", "protocolli", "ogni azione deve essere fatta con grande accuratezza e seguendo protocolli ben definiti"], ["3.", "isolamento", "ho trascorso lì un anno, in isolamento, svolgendo alcuni esperimenti per l'ESA"], ["4.", "orme", "in futuro altri nostri connazionali seguiranno le sue orme"], ["5.", "antidoto", "la conoscenza è in larga misura un antidoto alla paura"]]}, "verofalso": {"items": [{"s": "Adrianos Golemis raggiungerà la Stazione spaziale internazionale nel 2027.", "a": "V", "note": ""}, {"s": "Prima di questa missione ha trascorso un anno in isolamento in Antartide.", "a": "V", "note": ""}, {"s": "Secondo Golemis, sulla Stazione spaziale l'astronauta decide da solo quali esperimenti fare.", "a": "F", "note": "Dice di essere «le mani e i muscoli» dei ricercatori che restano a terra e di seguire protocolli ben definiti."}, {"s": "L'Agenzia spaziale europea seleziona nuovi astronauti ogni anno.", "a": "F", "note": "Circa ogni dieci-quindici anni."}, {"s": "Golemis ha già scelto l'oggetto simbolico greco che porterà con sé.", "a": "F", "note": "Dice che è ancora un po' presto e spera di riuscirci nei prossimi mesi."}, {"s": "Il servizio dice quanti giorni durerà la permanenza sulla Stazione spaziale.", "a": "N", "note": "La durata della missione non viene detta."}], "key_html": "<b>1.</b> Vero &nbsp; <b>2.</b> Vero &nbsp; <b>3.</b> Falso (segue i protocolli) &nbsp; <b>4.</b> Falso (ogni 10–15 anni) &nbsp; <b>5.</b> Falso (è presto) &nbsp; <b>6.</b> Non detto"}, "discussion": [{"q": "Racconta una strada che non hai preso: uno studio, un lavoro, un trasferimento. Che cosa sarebbe successo se avessi scelto diversamente? Usa almeno due periodi ipotetici dell'irrealtà.", "m": "Dopo l'università avrei potuto restare all'università come ricercatore: me lo avevano proposto. Se avessi accettato, oggi probabilmente insegnerei linguistica in un dipartimento, con uno stipendio fisso e molte riunioni. Ho scelto invece la traduzione e l'interpretazione, e non me ne pento: se fossi rimasto lì, non avrei viaggiato così tanto e non avrei conosciuto i settori più strani, dall'edilizia alla medicina. Certo, se avessi avuto una cattedra avrei scritto più libri miei e meno parole di altri. La verità è che non era una scelta tra giusto e sbagliato: se non fossi curioso come sono, quella vita tranquilla mi sarebbe piaciuta molto."}, {"q": "Se ti offrissero un anno in un posto isolato come l'Antartide — stipendio buono, lavoro interessante, nessuna possibilità di tornare a casa prima — accetteresti? A quali condizioni?", "m": "Sinceramente credo che non accetterei, o almeno non per un anno intero. Se avessi venticinque anni ci andrei subito, perché a quell'età un anno sembra breve e l'idea di tornare con una storia da raccontare vale molto. Oggi però ho clienti, corsi e persone che contano su di me: se sparissi per dodici mesi, al ritorno dovrei ricostruire tutto da zero. Accetterei a due condizioni: una connessione internet decente, così potrei continuare a insegnare e a tradurre, e la possibilità di rientrare in caso di emergenza in famiglia. Con quelle due cose, l'isolamento non mi spaventerebbe: mi spaventa di più perdere il filo del mio lavoro."}, {"q": "Golemis vorrebbe portare in orbita un oggetto simbolico greco e cita la musica di Vangelis. Se dovessi scegliere tu un oggetto piccolo e leggero che rappresenta il tuo Paese o la tua lingua, quale sarebbe e perché?", "m": "Porterei un libro sottile di poesie di Attila József, in ungherese. È un oggetto piccolo e leggero, quindi passerebbe i limiti di peso e volume, e dice molto più di una bandiera: una lingua che fuori dall'Ungheria quasi nessuno legge, scritta da un uomo che ha avuto una vita difficilissima. Se dovessi spiegarlo a un equipaggio internazionale, direi che è la prova che una cultura piccola può produrre cose grandi. In alternativa porterei un cubo di Rubik: è ungherese, è leggero, e nello spazio sarebbe anche un buon passatempo. Da traduttore, però, il libro mi sembra più giusto: le parole viaggiano meglio degli oggetti."}], "homework": [{"label": "Compiti — Scrittura", "bgCls": "red", "blockCls": "red-b", "h3color": "#E24E3E", "h3text": "✍ Una strada non presa (80–100 parole)", "bodyHTML": "Scrivi un breve testo su una decisione importante della tua vita e su che cosa sarebbe successo se avessi scelto diversamente: uno studio, un lavoro, un trasferimento, un incontro.<br><br><b>Domande guida:</b> Quando è stato? Quali erano le due possibilità? Perché hai scelto così? Che cosa sarebbe cambiato con l'altra scelta? Oggi te ne penti?<br><br>Usa almeno <b>cinque parole</b> della lezione (per esempio: <i>adattarsi, l'isolamento, il protocollo, seguire le orme di, in larga misura</i>) e almeno <b>tre periodi ipotetici dell'irrealtà</b>: uno del <b>III tipo</b> (<i>se avessi accettato, avrei…</i>), uno del <b>II tipo</b> (<i>se fossi…, sarei…</i>) e uno <b>misto</b> (<i>se non lo avessi fatto allora, oggi non…</i>).<br><br>Attenzione: dopo <i>se</i> mai il condizionale!", "chips": ["80–100 parole", "5 parole nuove", "III tipo · II tipo · misto"]}], "grammar_practice": [{"title": "Che tipo di periodo ipotetico?", "instr": "Per ogni frase indica se è (A) IRREALE DEL PRESENTE (II tipo: congiuntivo imperfetto + condizionale presente), (B) IRREALE DEL PASSATO (III tipo: congiuntivo trapassato + condizionale passato), (C) MISTA (i due tempi non coincidono), oppure (D) NON UN PERIODO IPOTE   const content = el('div','ak-content');
  (gf.answers || []).forEach(([num, word, quote]) => {
    const item = el('div','ak-item'); const body = document.createElement('div');
    body.innerHTML = UI.word + ': <span class="ak-word">' + word + '</span> &nbsp;—&nbsp; <span class="ak-quote">' + quote + '</span>';
    ap(item, el('span','ak-num', num), body); content.appendChild(item);
  });
  ap(s, head, content);
}
function makeMatchSlide(m) {
  const s = makeSlide(UI.matchLabel, 'ex-slide');
  const head = el('div','slide-head'); ap(head, el('h2','', UI.matchH2), el('div','sub', UI.matchSub));
  const block = el('div','ex-block'); const instr = el('div','ex-instr', UI.matchInstr);
  const wrap = el('div','match-wrap'); const grid = el('div','match-grid');
  const leftCol = document.createElement('div'); const rightCol = document.createElement('div');
  ap(leftCol, el('div','match-col-label', UI.matchTerm)); ap(rightCol, el('div','match-col-label', UI.matchDef));
  leftCol.id = 'mterms'; rightCol.id = 'mdefs'; ap(grid, leftCol, rightCol);
  const akBtn = el('button','ak-btn', UI.showAnswers); akBtn.onclick = () => toggleAK('mkey');
  const ak = el('div','answer-key'); ak.id = 'mkey'; ak.innerHTML = m.key_html || '';
  ap(wrap, grid, akBtn, ak); ap(block, el('h3','', UI.matchHeading), instr, wrap); ap(s, head, block);
}
function makeVFSlide(vfo) {
  const s = makeSlide(UI.vfLabel, 'ex-slide');
  const head = el('div','slide-head'); ap(head, el('h2','', UI.vfH2), el('div','sub', UI.vfSub));
  const block = el('div','ex-block'); const instr = el('div','ex-instr', UI.vfInstr);
  const list = el('div','vf-list'); list.id = 'vf-root';
  const akBtn = el('button','ak-btn', UI.vfAll); akBtn.onclick = () => toggleAK('vfkey');
  const ak = el('div','answer-key'); ak.id = 'vfkey'; ak.innerHTML = vfo.key_html || '';
  ap(block, el('h3','', UI.vfHeading), instr, list, akBtn, ak); ap(s, head, block);
}

function makeDiscSlide() {
  const s = makeSlide(UI.discLabel, 'disc-slide');
  const head = el('div','slide-head'); ap(head, el('h2','', UI.discH2), el('div','sub', UI.discSub));
  const warn = el('div','speech-warn', UI.speechWarn); warn.id = 'swarn';
  const card = el('div','disc-card'); const topbar = el('div','disc-topbar');
  const dots = el('div','disc-dots'); dots.id = 'ddots';
  const qnum = el('div','disc-qnum', '1. ' + UI.question + UI.ofN + DISC.length); qnum.id = 'dqnum';
  ap(topbar, dots, qnum);
  const dq = el('div','disc-q',''); dq.id = 'dq';
  const cols = el('div','disc-cols'); const col1 = el('div','disc-col');
  const ubox = el('div','disc-user-box'); ubox.id = 'dubox'; ubox.appendChild(el('span','ph', UI.micPh));
  ap(col1, el('div','disc-col-label', UI.yourAnswer), ubox);
  const col2 = el('div','disc-col'); const mbox = el('div','disc-model-box blur'); mbox.id = 'dmbox';
  const mtext = el('div','mtext',''); mtext.id = 'dmtext'; mbox.appendChild(mtext);
  const revBtn = el('button','reveal-btn', UI.reveal); revBtn.onclick = revealModel;
  ap(col2, el('div','disc-col-label', UI.modelAnswer), mbox, revBtn); ap(cols, col1, col2);
  const microw = el('div','mic-row'); const micbtn = el('button','mic-btn','🎤'); micbtn.id = 'micbtn'; micbtn.onclick = toggleMic;
  const micstat = el('div','mic-status', UI.micStart); micstat.id = 'micstat'; ap(microw, micbtn, micstat);
  const nav = el('div','disc-nav');
  const prevBtn = el('button','disc-nav-btn', UI.prev); prevBtn.id = 'dprev'; prevBtn.onclick = () => dNav(-1);
  const nextBtn = el('button','disc-nav-btn', UI.next); nextBtn.id = 'dnext'; nextBtn.onclick = () => { if (dIdx >= DISC.length - 1) go(1); else dNav(1); };
  ap(nav, prevBtn, nextBtn); ap(card, topbar, dq, cols, microw, nav); ap(s, head, warn, card);
}

function makeHWSlide(h) {
  const s = makeSlide(h.label, 'hw-slide ' + (h.bgCls || ''));
  const head = el('div','slide-head'); ap(head, el('h2','', h.label), el('div','sub', UI.hwSub));
  const block = el('div','hw-block ' + (h.blockCls || ''));
  const h3 = el('h3','', h.h3text); if (h.h3color) h3.style.color = h.h3color;
  const body = document.createElement('div'); body.innerHTML = h.bodyHTML; body.style.cssText = 'font-size:1.6vw;line-height:1.9;flex:1';
  ap(block, h3, body);
  if (h.chips && h.chips.length) { const row = el('div','chip-row'); h.chips.forEach(t => row.appendChild(el('span','chip', t))); block.appendChild(row); }
  ap(s, head, block);
}

// ── BUILD (B1 shape: warm-up → vocab → video → reading → grammar → comprehension → exercises → discussion → homework)
function build() {
  const D = SPEC.dividers || {};
  makeTitle(SPEC.title_slide || {});

  makeDivider(D.warmup);
  makeQuestionsSlide(UI.warmupLabel, UI.warmupH2, UI.warmupSub, UI.warmupBox, SPEC.warmup.questions);
  if (SPEC.warmup.episode) makeProseSlide('Riscaldamento — Di cosa parla?', SPEC.warmup.episode.h2, SPEC.warmup.episode.sub, SPEC.warmup.episode.body);
  if (SPEC.figures) makeFiguresSlide(SPEC.figures);

  makeDivider(D.vocab);
  const per = 2; // rule: 8 cards per slide (2 groups × 4)
  for (let i = 0; i < VOCAB.length; i += per) {
    makeVocabSlide('Parole chiave — ' + (Math.floor(i/per) + 1) + '/' + Math.ceil(VOCAB.length/per), VOCAB.slice(i, i + per));
  }

  if (SPEC.video && SPEC.video.parts && SPEC.video.parts.length) {
    makeDivider(D.video);
    const vid = ytId(SPEC.video.url || SPEC.video.video_id);
    SPEC.video.parts.forEach((p, i) => makeVideoPartSlide(p, i, SPEC.video.parts.length, vid));
  }

  if (SPEC.reading) { makeDivider(D.reading); makeReadingSlide(SPEC.reading); }

  if (SPEC.grammar && SPEC.grammar.length) { makeDivider(D.grammar); SPEC.grammar.forEach(makeGramSlide); }

  makeDivider(D.comprehension);
  (SPEC.comprehension || []).forEach(makeCompSlide);

  makeDivider(D.exercises);
  if (SPEC.gapfill) { makeGapSlide(SPEC.gapfill); makeGapAnswerSlide(SPEC.gapfill); }
  if (SPEC.match) makeMatchSlide(SPEC.match);
  if (SPEC.verofalso) makeVFSlide(SPEC.verofalso);

  makeDivider(D.discussion);
  makeDiscSlide();

  if (SPEC.homework && SPEC.homework.length) { makeDivider(D.homework); SPEC.homework.forEach(makeHWSlide); }
}
build();

// ── NAVIGATION ───────────────────────────────────────────────────
const TOTAL = SLIDES.length; let cur = 0;
SLIDES[0].el.classList.add('active');
const DISC_IDX = SLIDES.findIndex(s => s.el.classList.contains('disc-slide'));
function go(d) {
  SLIDES[cur].el.classList.remove('active');
  cur = Math.max(0, Math.min(TOTAL - 1, cur + d));
  SLIDES[cur].el.classList.add('active'); SLIDES[cur].el.scrollTop = 0; updateNav();
  if (cur === DISC_IDX) initMicPermission();
}
function updateNav() {
  document.getElementById('slide-label').textContent = (cur+1) + ' / ' + TOTAL + ' — ' + SLIDES[cur].label;
  document.getElementById('pb').style.width = ((cur+1)/TOTAL*100) + '%';
  document.getElementById('btn-prev').disabled = cur === 0;
  document.getElementById('btn-next').disabled = cur === TOTAL-1;
}
updateNav();
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(1);
  if (e.key === 'ArrowLeft') go(-1);
  if ((e.key==='r'||e.key==='R') && cur===DISC_IDX) toggleMic();
});

// ── GAP FILL ─────────────────────────────────────────────────────
let selWord = null;
function wireGap() {
  const wb = document.getElementById('wb'); const gs = document.getElementById('gap-sents'); if (!wb || !gs) return;
  [...GAP_WORDS].sort(()=>Math.random()-0.5).forEach(w => {
    const d = el('div','dword', w); d.dataset.w = w;
    d.onclick = () => { if (d.classList.contains('used')) return; document.querySelectorAll('.dword').forEach(x=>x.classList.remove('sel-w')); d.classList.add('sel-w'); selWord = w; };
    wb.appendChild(d);
  });
  GAP_SENTS.forEach(s => { const d = el('div','gap-sentence'); d.innerHTML = s.pre + ' <span class="drop-zone" data-blank="'+s.blank+'" onclick="fillZone(this)">_ _ _ _ _</span> ' + s.post; gs.appendChild(d); });
}
function fillZone(z) {
  if (!selWord || z.classList.contains('ok')) return;
  document.querySelectorAll('.drop-zone').forEach(oz=>{ if(oz!==z && oz.dataset.filled===selWord){oz.textContent='_ _ _ _ _';oz.classList.remove('filled','ok','wrong');oz.dataset.filled='';} });
  z.textContent = selWord; z.classList.add('filled'); z.dataset.filled = selWord;
  document.querySelectorAll('.dword').forEach(d=>d.classList.remove('sel-w')); selWord = null;
}
function checkGap() { document.querySelectorAll('.drop-zone').forEach(z=>{ z.classList.remove('ok','wrong'); if(z.dataset.filled===z.dataset.blank) z.classList.add('ok'); else if(z.dataset.filled) z.classList.add('wrong'); }); }
function resetGap() { document.querySelectorAll('.drop-zone').forEach(z=>{z.textContent='_ _ _ _ _';z.classList.remove('filled','ok','wrong');z.dataset.filled='';}); document.querySelectorAll('.dword').forEach(d=>d.classList.remove('used','sel-w')); selWord = null; }

// ── MATCHING ─────────────────────────────────────────────────────
let selTerm = null;
function wireMatch() {
  const tc = document.getElementById('mterms'), dc = document.getElementById('mdefs'); if (!tc || !dc) return;
  const shuffled = [...MATCH].sort(()=>Math.random()-0.5);
  MATCH.forEach((m,i)=>{ const e2 = el('div','mitem', m.t); e2.dataset.pair = i; e2.dataset.side='t';
    e2.onclick = () => { if (e2.classList.contains('matched')) return; document.querySelectorAll('.mitem[data-side="t"]').forEach(x=>x.classList.remove('sel')); e2.classList.add('sel'); selTerm = e2; };
    tc.appendChild(e2); });
  shuffled.forEach(m=>{ const oi = MATCH.findIndex(x=>x.d===m.d); const e2 = el('div','mitem', m.d); e2.dataset.pair = oi; e2.dataset.side='d';
    e2.onclick = () => { if (!selTerm || e2.classList.contains('matched')) return;
      if (selTerm.dataset.pair === e2.dataset.pair) { selTerm.classList.remove('sel'); selTerm.classList.add('matched'); e2.classList.add('matched'); selTerm = null; }
      else { e2.classList.add('bad'); setTimeout(()=>e2.classList.remove('bad'),500); const st = selTerm; selTerm = null; st.classList.add('bad'); setTimeout(()=>st.classList.remove('bad','sel'),500); } };
    dc.appendChild(e2); });
}

// ── VERO / FALSO / NON DETTO ──────────────────────────────────
function wireVF() {
  const root = document.getElementById('vf-root'); if (!root) return;
  VF.forEach((item,i)=>{
    const row = el('div','vf-row'); const btns = el('div','vf-btns');
    UI.vfBtns.forEach(([cls,val])=>{ const b = el('button','vfb '+cls, val); b.onclick = () => checkVF(b, cls, item.a, i); btns.appendChild(b); });
    const body = document.createElement('div'); body.style.flex='1';
    body.appendChild(el('div','', String(i+1)+'. '+item.s));
    if (item.note) { const n = el('div','vf-note','→ '+item.note); n.id='vfn'+i; body.appendChild(n); }
    ap(row, btns, body); root.appendChild(row);
  });
}
function checkVF(btn, chosen, correct, idx) {
  btn.closest('.vf-row').querySelectorAll('.vfb').forEach(b=>b.classList.remove('correct','incorrect'));
  if (chosen===correct) btn.classList.add('correct');
  else { btn.classList.add('incorrect'); const n=document.getElementById('vfn'+idx); if(n) n.classList.add('show'); }
}

// ── DISCUSSION + MIC ─────────────────────────────────────────────
let dIdx=0, recog=null, recording=false, micOK=false, micStream=null;
function wireDisc() {
  const dots = document.getElementById('ddots'); if (!dots) return;
  DISC.forEach((_,i)=>{ const d = el('div','disc-dot'+(i===0?' active':'')); d.onclick = () => gotoDisc(i); dots.appendChild(d); });
  loadDisc();
}
function loadDisc() {
  const dq = document.getElementById('dq'); if (!dq) return;
  dq.textContent = DISC[dIdx].q;
  document.getElementById('dqnum').textContent = (dIdx+1) + '. ' + UI.question + UI.ofN + DISC.length;
  document.getElementById('dmtext').textContent = DISC[dIdx].m;
  document.getElementById('dmbox').classList.add('blur');
  if (!recording) { const ub = document.getElementById('dubox'); ub.innerHTML=''; ub.appendChild(el('span','ph', UI.micPh)); ub.classList.remove('listening'); }
  document.querySelectorAll('.disc-dot').forEach((d,i)=>d.classList.toggle('active', i===dIdx));
  const pb = document.getElementById('dprev'), nb = document.getElementById('dnext');
  if (pb) pb.disabled = dIdx === 0;
  if (nb) { const last = dIdx >= DISC.length - 1; nb.textContent = last ? UI.nextSlide : UI.next; nb.classList.toggle('to-slide', last); }
}
function dNav(d) { document.querySelectorAll('.disc-dot')[dIdx].classList.add('done'); dIdx = Math.max(0, Math.min(DISC.length-1, dIdx+d)); loadDisc(); }
function gotoDisc(i){ dIdx=i; loadDisc(); }
function revealModel(){ document.getElementById('dmbox').classList.toggle('blur'); }
function initMicPermission() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { const w=document.getElementById('swarn'); if(w) w.style.display='block'; return; }
  if (micOK && micStream && micStream.active) return;
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(stream => { micStream = stream; micOK = true; const st = document.getElementById('micstat'); if (st) st.textContent = UI.micReady; })
      .catch(e => { if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) { const w=document.getElementById('swarn'); if(w) w.style.display='block'; } });
  }
}
function toggleMic(){ recording ? stopMic() : startMic(); }
function startMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) return;
  recog = new SR(); recog.lang='it-IT'; recog.continuous=true; recog.interimResults=true;
  const box = document.getElementById('dubox'); box.innerHTML=''; box.classList.add('listening');
  let final='';
  recog.onresult = e => { let interim=''; for (let i=e.resultIndex; i<e.results.length; i++) { if (e.results[i].isFinal) final += e.results[i][0].transcript + ' '; else interim += e.results[i][0].transcript; } box.textContent = final + interim; micOK = true; };
  recog.onerror = e => { if (e.error!=='no-speech') stopMic(); };
  recog.onend = () => { if (recording) recog.start(); };
  recog.start(); recording = true;
  document.getElementById('micbtn').classList.add('on'); document.getElementById('micbtn').textContent = '⏹';
  document.getElementById('micstat').textContent = UI.micRec;
}
function stopMic() {
  if (recog) { recog.stop(); recog=null; } recording=false;
  document.getElementById('micbtn').classList.remove('on'); document.getElementById('micbtn').textContent = '🎤';
  document.getElementById('micstat').textContent = UI.micPause; document.getElementById('dubox').classList.remove('listening');
}
function toggleAK(id){ document.getElementById(id).classList.toggle('show'); }

wireGap(); wireMatch(); wireVF(); wireDisc();

// ── Text-size control ────────────────────────────────────────────
(function(){
  let z = 100;
  const bar = document.createElement('div'); bar.id='tsize';
  bar.innerHTML = '<span>' + UI.tsize + '</span><button id="tsm">A−</button><span id="tsv">100%</span><button id="tsp">A+</button><button id="tsr">⟲</button>';
  const _tb=document.getElementById('topbar'), _nb=document.getElementById('nav-btns');
  if(_tb && _nb) _tb.insertBefore(bar, _nb); else document.body.appendChild(bar);
  function apply(){ document.getElementById('viewport').style.zoom = (z/100); document.getElementById('tsv').textContent = z+'%'; }
  document.getElementById('tsm').onclick = ()=>{ z=Math.max(70,z-10); apply(); };
  document.getElementById('tsp').onclick = ()=>{ z=Math.min(220,z+10); apply(); };
  document.getElementById('tsr').onclick = ()=>{ z=100; apply(); };
})();
</script>
