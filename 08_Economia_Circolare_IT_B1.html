<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ripensare i rifiuti: la strada verso l&#x27;economia circolare — Goodman Italiano B1</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: Calibri, 'Segoe UI', sans-serif;
  background: #0e8388;
  color: #1e2a2e;
}

/* ── TOP BAR ── */
#pb-wrap { position: fixed; top: 0; left: 0; right: 0; height: 5px; background: rgba(255,255,255,0.2); z-index: 200; }
#pb { height: 5px; background: #fb6a5a; transition: width 0.3s; width: 0%; }

#topbar {
  position: fixed; top: 5px; left: 0; right: 0; height: 50px;
  background: #0e8388; z-index: 199;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2vw;
  border-bottom: 1px solid rgba(255,255,255,0.18);
}
#slide-label { color: white; font-size: 1.5vw; font-weight: 700; }
#nav-btns { display: flex; gap: 1vw; }
.nbtn {
  background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.3);
  color: white; padding: 0.4vh 1.5vw; border-radius: 5px;
  cursor: pointer; font-size: 1.3vw; font-family: inherit; font-weight: 600;
}
.nbtn:hover { background: rgba(255,255,255,0.28); }
.nbtn:disabled { opacity: 0.3; cursor: default; }

/* ── VIEWPORT ── */
#viewport {
  position: fixed;
  top: 55px; left: 0; right: 0; bottom: 0;
}

/* ── SLIDES ── */
.slide {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease;
  overflow: hidden;
}
.slide.active { opacity: 1; pointer-events: all; }

/* ════════════════════════════════
   DIVIDER SLIDES
════════════════════════════════ */
.div-slide {
  background: linear-gradient(160deg, #073c40 0%, #0e8388 60%, #0a5458 100%);
  color: white;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  padding: 3vh 6vw;
  position: relative;
}
.div-slide::after {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0;
  height: 0.8vh; background: #fb6a5a;
}
.div-icon { font-size: 7vw; line-height: 1; margin-bottom: 2vh; }
.div-num { font-size: 1.2vw; letter-spacing: 0.4vw; text-transform: uppercase; opacity: 0.5; margin-bottom: 1.5vh; font-weight: 700; }
.div-slide h2 { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 5.5vw; line-height: 1.1; margin-bottom: 2.5vh; }
.div-desc { font-size: 1.7vw; opacity: 0.78; max-width: 70vw; line-height: 1.6; margin-bottom: 3.5vh; }
.div-tags { display: flex; flex-wrap: wrap; gap: 1vw; justify-content: center; max-width: 75vw; }
.div-tag {
  background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.28);
  border-radius: 3vw; padding: 0.8vh 2vw; font-size: 1.3vw;
}

/* ════════════════════════════════
   TITLE SLIDE
════════════════════════════════ */
.title-slide {
  background: linear-gradient(150deg, #052b2e 0%, #0e8388 100%);
  color: white;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  padding: 3vh 4vw;
}
.pod-label { font-size: 1.5vw; letter-spacing: 0.4vw; text-transform: uppercase; color: #fb6a5a; margin-bottom: 3vh; font-weight: 700; }
.title-slide h1 { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 6.5vw; line-height: 1.15; width: 90vw; margin-bottom: 3.5vh; }
.red-line { width: 6vw; height: 0.6vh; background: #fb6a5a; margin: 0 auto 3vh; }
.title-meta { display: flex; gap: 4vw; font-size: 1.8vw; opacity: 0.65; flex-wrap: wrap; justify-content: center; }

/* ════════════════════════════════
   CONTENT SLIDE BASE
════════════════════════════════ */
.con-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.slide-head {
  border-left: 0.5vw solid #fb6a5a;
  padding-left: 1.5vw;
  margin-bottom: 2.5vh;
  flex-shrink: 0;
}
.slide-head h2 { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; color: #0e8388; font-size: 3.2vw; line-height: 1.15; margin-bottom: 0.4vh; }
.sub { color: #5e7377; font-size: 1.3vw; }

/* ════════════════════════════════
   ANTICIPAZIONE — split slides
════════════════════════════════ */
.single-box {
  flex: 1;
  background: #e6f3f2;
  border-radius: 1vw;
  padding: 3vh 3vw;
  border-top: 0.5vh solid #0e8388;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.single-box h3 { color: #0e8388; font-size: 2.2vw; margin-bottom: 2.5vh; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; }
.single-box ol { padding-left: 2.5vw; flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
.single-box ol li { font-size: 2vw; line-height: 1.6; }
.single-box p { font-size: 2vw; line-height: 1.75; flex: 1; display: flex; align-items: center; }

/* ════════════════════════════════
   FIGURE CHIAVE
════════════════════════════════ */
.figures-slide {
  background: #ffeae6;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.figures-slide .slide-head { border-color: #fb6a5a; }
.figures-slide .slide-head h2 { color: #e24e3e; }
.figures-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr 1fr;
  gap: 1.5vh 2vw;
  flex: 1;
}
.figure-card {
  background: white; border-radius: 0.8vw;
  border-left: 0.5vw solid #fb6a5a;
  padding: 1.5vh 2vw;
  display: flex; flex-direction: column; justify-content: center;
}
.figure-card .fname { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 1.9vw; font-weight: 700; color: #0e8388; margin-bottom: 0.8vh; }
.figure-card .fdesc { font-size: 1.35vw; color: #3a4a4e; line-height: 1.5; }

/* ════════════════════════════════
   VOCABULARY
════════════════════════════════ */
.vocab-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 2vh 4vw 2vh;
  overflow: hidden;
}
.vocab-group-label {
  font-size: 1.1vw; letter-spacing: 0.2vw; text-transform: uppercase;
  color: #5e7377; font-weight: 700; margin: 1.2vh 0 1vh;
  padding-bottom: 0.6vh; border-bottom: 2px solid #d7e6e4;
  flex-shrink: 0;
}
.vocab-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 1.2vh 2vw; flex: 1;
}
.vcard {
  background: white; border-radius: 0.8vw;
  box-shadow: 0 3px 12px rgba(0,0,0,0.09);
  cursor: pointer; perspective: 900px;
}
.vcard-inner {
  width: 100%; height: 100%; position: relative;
  transform-style: preserve-3d; transition: transform 0.45s;
}
.vcard.flipped .vcard-inner { transform: rotateY(180deg); }
.vfront, .vback {
  position: absolute; width: 100%; height: 100%;
  border-radius: 0.8vw; padding: 1.8vh 1.8vw;
  backface-visibility: hidden;
  display: flex; flex-direction: column; justify-content: space-between;
}
.vfront { background: white; }
.vfront .term { font-size: 2vw; font-weight: 700; color: #1e2a2e; line-height: 1.3; flex: 1; display: flex; align-items: center; }
.vfront .vbottom { display: flex; flex-direction: column; gap: 0.6vh; flex-shrink: 0; }
.vfront .rtag { display: inline-block; font-size: 1vw; padding: 0.3vh 0.8vw; border-radius: 2vw; background: #e6f3f2; color: #0e8388; font-weight: 600; align-self: flex-start; }
.vfront .hint { font-size: 1.1vw; color: #9bb0b2; }
.vback { background: #e6f3f2; transform: rotateY(180deg); }
.vback .en { font-size: 1.8vw; font-weight: 700; color: #0e8388; margin-bottom: 1vh; }
.vback .ex { font-size: 1.2vw; font-style: italic; color: #1e2a2e; border-left: 0.3vw solid #fb6a5a; padding-left: 0.8vw; line-height: 1.55; flex: 1; }
.vback .rnote { font-size: 0.95vw; color: #5e7377; margin-top: 0.8vh; flex-shrink: 0; }

/* ════════════════════════════════
   GRAMMAR
════════════════════════════════ */
.gram-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.gram-block {
  background: white; border-radius: 1vw;
  padding: 3vh 3vw;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  border-left: 0.6vw solid #0a6e72;
  flex: 1; display: flex; flex-direction: column;
}
.gram-block h3 { color: #0e8388; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 2.5vw; margin-bottom: 1.5vh; line-height: 1.2; }
.gram-block .expl { font-size: 1.55vw; color: #3a4a4e; line-height: 1.7; margin-bottom: 2vh; flex-shrink: 0; }
.gram-block ul { list-style: none; padding: 0; flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
.gram-block ul li { background: #e6f3f2; border-radius: 0.6vw; padding: 1.5vh 1.5vw; font-size: 1.45vw; font-style: italic; line-height: 1.6; }
.gram-block ul li strong { font-style: normal; color: #fb6a5a; font-size: 1.5vw; }
.gram-block .snote { font-size: 1.35vw; color: #1E8449; font-weight: 600; margin-top: 2vh; line-height: 1.55; padding: 1.5vh 1.5vw; background: #EAFAF1; border-radius: 0.6vw; flex-shrink: 0; }

/* ════════════════════════════════
   COMPREHENSION
════════════════════════════════ */
.comp-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.comp-label { font-size: 1.2vw; letter-spacing: 0.2vw; text-transform: uppercase; color: #5e7377; margin-bottom: 2vh; font-weight: 700; padding-bottom: 1vh; border-bottom: 2px solid #d7e6e4; flex-shrink: 0; }
.qlist { flex: 1; display: flex; flex-direction: column; gap: 1.5vh; }
.qitem { background: white; border-radius: 0.8vw; padding: 2vh 2.5vw; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; gap: 1.5vw; font-size: 1.8vw; line-height: 1.65; flex: 1; align-items: center; }
.qnum { color: #fb6a5a; font-weight: 700; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 2.2vw; min-width: 2.5vw; flex-shrink: 0; }

/* ════════════════════════════════
   CULTURAL
════════════════════════════════ */
.cult-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.cult-block {
  background: white; border-radius: 1vw;
  padding: 3vh 3vw;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  border-left: 0.6vw solid #fb6a5a;
  flex: 1; display: flex; flex-direction: column;
}
.cult-block h3 { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; color: #0e8388; font-size: 2.4vw; margin-bottom: 2vh; line-height: 1.2; flex-shrink: 0; }
.cult-block p { font-size: 1.6vw; line-height: 1.8; flex: 1; }
.en-gl { font-style: italic; color: #5e7377; font-size: 1.2vw; margin-top: 1.5vh; display: block; flex-shrink: 0; }
.cult-hook { margin-top: 2.5vh; padding: 1.5vh 2vw; background: #fff1ef; border-radius: 0.6vw; font-size: 1.45vw; color: #e24e3e; line-height: 1.6; flex-shrink: 0; }

/* ════════════════════════════════
   EXERCISES
════════════════════════════════ */
.ex-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.ex-block {
  background: white; border-radius: 1vw;
  padding: 2.5vh 3vw;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  flex: 1; display: flex; flex-direction: column;
}
.ex-block h3 { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; color: #0e8388; font-size: 2.2vw; margin-bottom: 0.8vh; flex-shrink: 0; }
.ex-instr { font-size: 1.3vw; color: #5e7377; margin-bottom: 1.8vh; line-height: 1.6; flex-shrink: 0; }

/* Gap fill */
.word-bank { display: flex; flex-wrap: wrap; gap: 1vw; margin-bottom: 2vh; padding: 1.5vh 1.5vw; background: #e6f3f2; border-radius: 0.8vw; flex-shrink: 0; }
.dword { background: #0e8388; color: white; padding: 0.8vh 2vw; border-radius: 3vw; font-size: 1.5vw; cursor: pointer; user-select: none; font-weight: 600; }
.dword.sel-w { outline: 0.3vw solid #fb6a5a; outline-offset: 0.2vw; }
.dword.used { opacity: 0.3; cursor: default; }
.gap-sentences { flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
.gap-sentence { font-size: 1.6vw; line-height: 1.4; }
.drop-zone { display: inline-block; min-width: 10vw; border-bottom: 0.2vw solid #0e8388; margin: 0 0.5vw; padding: 0 0.5vw; color: #9bb0b2; font-style: italic; cursor: pointer; vertical-align: bottom; font-size: 1.5vw; }
.drop-zone.filled { color: #1e2a2e; font-style: normal; font-weight: 700; background: #e6f3f2; border-radius: 0.3vw; border-bottom-color: #0a6e72; }
.drop-zone.ok { border-bottom-color: #1E8449; background: #EAFAF1; color: #1E8449; }
.drop-zone.wrong { border-bottom-color: #fb6a5a; background: #ffeae6; color: #fb6a5a; }
.ex-btns { display: flex; gap: 1vw; margin-top: 1.5vh; flex-shrink: 0; }

/* Answer key slide */
.ak-slide {
  background: #EAFAF1;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.ak-slide .slide-head { border-color: #1E8449; }
.ak-slide .slide-head h2 { color: #1E8449; }
.ak-content { background: white; border-radius: 1vw; padding: 2vh 3vw; box-shadow: 0 4px 16px rgba(0,0,0,0.08); border-left: 0.6vw solid #1E8449; flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
.ak-item { display: flex; gap: 1.5vw; align-items: center; padding: 1.5vh 2vw; background: #F4FDF8; border-radius: 0.6vw; font-size: 1.55vw; line-height: 1.6; }
.ak-num { color: #1E8449; font-weight: 700; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 2vw; min-width: 2.5vw; }
.ak-word { font-weight: 700; color: #1E8449; }
.ak-quote { font-style: italic; color: #5e7377; }

/* Matching */
.match-wrap { flex: 1; display: flex; flex-direction: column; }
.match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2vw; flex: 1; margin-bottom: 1.5vh; }
.match-col-label { font-size: 1.1vw; letter-spacing: 0.2vw; text-transform: uppercase; color: #5e7377; margin-bottom: 1vh; font-weight: 700; }
.mitem { padding: 1.5vh 1.8vw; border-radius: 0.6vw; margin-bottom: 0.8vh; font-size: 1.45vw; cursor: pointer; border: 0.2vw solid transparent; background: #e6f3f2; transition: all 0.18s; line-height: 1.45; }
.mitem:hover { border-color: #0a6e72; }
.mitem.sel { border-color: #0e8388; background: #cde9e7; font-weight: 700; }
.mitem.matched { border-color: #1E8449; background: #EAFAF1; color: #1E8449; cursor: default; font-weight: 600; }
.mitem.bad { border-color: #fb6a5a; background: #ffeae6; }

/* VF */
.vf-list { flex: 1; display: flex; flex-direction: column; gap: 1.2vh; }
.vf-row { display: flex; gap: 1.5vw; align-items: center; padding: 1.8vh 2vw; background: white; border-radius: 0.8vw; box-shadow: 0 2px 8px rgba(0,0,0,0.06); font-size: 1.5vw; line-height: 1.6; flex: 1; }
.vf-btns { display: flex; gap: 0.6vw; flex-shrink: 0; }
.vfb { padding: 0.6vh 1.2vw; border-radius: 2vw; border: 0.2vw solid; font-size: 1.2vw; font-weight: 700; cursor: pointer; background: transparent; font-family: inherit; }
.vfb.V { border-color: #1E8449; color: #1E8449; }
.vfb.F { border-color: #fb6a5a; color: #fb6a5a; }
.vfb.N { border-color: #5e7377; color: #5e7377; }
.vfb.correct { background: #1E8449; color: white; border-color: #1E8449; }
.vfb.incorrect { background: #fb6a5a; color: white; border-color: #fb6a5a; }
.vf-note { font-size: 1.1vw; color: #1E8449; font-style: italic; margin-top: 0.5vh; display: none; }
.vf-note.show { display: block; }

/* Buttons */
.ak-btn { padding: 1vh 2vw; background: #1E8449; color: white; border: none; border-radius: 0.5vw; cursor: pointer; font-size: 1.3vw; font-weight: 700; font-family: inherit; flex-shrink: 0; }
.ak-btn:hover { opacity: 0.85; }
.ak-btn.grey { background: #5e7377; }
.answer-key { display: none; margin-top: 1.5vh; padding: 1.5vh 2vw; background: #EAFAF1; border-radius: 0.8vw; border-left: 0.4vw solid #1E8449; font-size: 1.3vw; line-height: 1.9; flex-shrink: 0; }
.answer-key.show { display: block; }

/* ════════════════════════════════
   DISCUSSION
════════════════════════════════ */
.disc-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.disc-card { background: white; border-radius: 1vw; padding: 2.5vh 3vw; box-shadow: 0 4px 16px rgba(0,0,0,0.08); flex: 1; display: flex; flex-direction: column; }
.disc-topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2vh; flex-shrink: 0; }
.disc-dots { display: flex; gap: 0.8vw; }
.disc-dot { width: 1.2vw; height: 1.2vw; border-radius: 50%; background: #e6f3f2; border: 0.2vw solid #0a6e72; cursor: pointer; }
.disc-dot.active { background: #0e8388; }
.disc-dot.done { background: #1E8449; border-color: #1E8449; }
.disc-qnum { font-size: 1.4vw; color: #5e7377; font-weight: 600; }
.disc-q { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 2vw; line-height: 1.6; color: #1e2a2e; margin-bottom: 2vh; flex-shrink: 0; }
.disc-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 2vw; flex: 1; min-height: 0; }
.disc-col { display: flex; flex-direction: column; min-height: 0; }
.disc-col-label { font-size: 1.1vw; letter-spacing: 0.2vw; text-transform: uppercase; color: #5e7377; margin-bottom: 0.8vh; font-weight: 700; flex-shrink: 0; }
.disc-user-box { flex: 1; padding: 1.5vh 1.5vw; border-radius: 0.8vw; background: #e6f3f2; font-size: 1.4vw; line-height: 1.7; border: 0.2vw solid transparent; min-height: 0; overflow-y: auto; }
.disc-user-box.listening { border-color: #fb6a5a; background: #ffeae6; }
.disc-user-box .ph { color: #9bb0b2; font-style: italic; }
.disc-model-box { flex: 1; padding: 1.5vh 1.5vw; border-radius: 0.8vw; background: #EAFAF1; font-size: 1.3vw; line-height: 1.8; min-height: 0; overflow-y: auto; }
.disc-model-box.blur .mtext { filter: blur(6px); user-select: none; }
.reveal-btn { display: inline-block; margin-top: 0.8vh; padding: 0.7vh 1.8vw; background: #1E8449; color: white; border: none; border-radius: 0.5vw; font-size: 1.2vw; font-weight: 700; cursor: pointer; font-family: inherit; flex-shrink: 0; }
.mic-row { display: flex; align-items: center; gap: 1.5vw; margin-top: 1.5vh; flex-shrink: 0; }
.mic-btn { width: 5vw; height: 5vw; border-radius: 50%; border: none; background: #fb6a5a; color: white; font-size: 2.2vw; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(192,57,43,0.38); flex-shrink: 0; }
.mic-btn.on { background: #1E8449; animation: pulse 1.2s infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(30,132,73,0.5); } 50% { box-shadow: 0 0 0 1vw rgba(30,132,73,0); } }
.mic-status { font-size: 1.2vw; color: #5e7377; line-height: 1.5; }
.disc-nav { display: flex; gap: 1vw; justify-content: flex-end; margin-top: 1.5vh; flex-shrink: 0; }

{"it": "prolungare la vita (di qualcosa)", "en": "to extend the life (of something)", "ex": "usare meno risorse e prolungare la vita dei prodotti", "reg": "neutral; noun: il prolungamento; opposite: accorciare"}, {"it": "entro il 2030", "en": "by 2030 (deadline)", "ex": "l'obiettivo è dimezzare le discariche entro il 2030", "reg": "neutral; entro = by a deadline, fra/tra due anni = two years from now"}, {"it": "il punto di partenza", "en": "the starting point", "ex": "il percorso dei rifiuti torna al punto di partenza", "reg": "neutral; opposite: il punto di arrivo; figurative and literal"}]}], "video": {"url": "https://www.youtube.com/watch?v=qlwVxIpvXh8", "title": "Ripensare i rifiuti: il percorso verso l'economia circolare", "channel": "euronews (in italiano)", "parts": [{"summary": "Il servizio segue il viaggio dei rifiuti, dal bidone di casa all'impianto. Nel mondo si producono ogni anno più di due miliardi di tonnellate di rifiuti urbani. A Sharjah, negli Emirati Arabi Uniti, le macchine separano plastica, metalli, carta e cartone dai rifiuti misti; ciò che resta diventa elettricità invece di finire in discarica. Alya Al Obeidli, ingegnere capo di Emirates Waste to Energy, spiega l'ordine giusto: prima il riciclo, che conserva i materiali, poi l'energia, infine la discarica. In Uzbekistan si producono circa 15 milioni di tonnellate di rifiuti domestici all'anno e solo il 5-6 per cento viene riciclato o trattato. Una nuova discarica di 24 ettari fuori Tashkent riceve tra 1.500 e 2.500 tonnellate al giorno; nelle vecchie discariche si è accumulato molto gas metano, che ora si vuole recuperare per produrre elettricità. Il Paese ha chiuso e bonificato 47 discariche e punta a dimezzarne il numero entro il 2030, mentre vicino a Samarcanda nasce un impianto da circa 1.500 tonnellate al giorno e 240 milioni di kilowattora all'anno. Alla fine il servizio torna al bidone: ad Angren l'azienda Zero Waste ha distribuito 10.000 sacchetti per la raccolta differenziata, ma solo l'1 per cento è tornato con i rifiuti separati."}]}, "reading": {"title": "Ripensare i rifiuti: il percorso verso l'economia circolare", "lead": "Dalla selezione avanzata dei rifiuti a Sharjah alle nuove infrastrutture in Uzbekistan, il recupero dei materiali e la produzione di energia stanno cambiando il destino della spazzatura.", "paragraphs": ["Ogni anno nel mondo si producono oltre due miliardi di tonnellate di rifiuti urbani. Quando il sacchetto sparisce dalla nostra vista, però, il viaggio comincia davvero: le bottiglie di plastica vengono riciclate, i rifiuti di cucina diventano compost o biogas, quello che non si può riciclare viene bruciato per produrre elettricità e solo alla fine il resto finisce in discarica. È il principio dell'economia circolare: tenere le risorse in uso il più a lungo possibile.", "A Sharjah, negli Emirati Arabi Uniti, le macchine di un grande impianto separano plastica, metalli, carta e cartone dai rifiuti misti. Ciò che resta non va direttamente in discarica, ma in un impianto che lo trasforma in energia. «Il riciclo preserva i materiali. La trasformazione dei rifiuti in energia si occupa di ciò che resta», spiega Alya Al Obeidli, ingegnere capo di Emirates Waste to Energy. L'ordine è importante: prima il recupero dei materiali, poi l'energia, infine la discarica.", "In Uzbekistan la situazione è diversa: si producono circa 15 milioni di tonnellate di rifiuti domestici all'anno, ma solo il 5-6 per cento viene riciclato o trattato da aziende specializzate. Una nuova discarica di 24 ettari fuori Tashkent riceve tra 1.500 e 2.500 tonnellate al giorno, racconta Shahzod Safarov dell'Agenzia per la gestione dei rifiuti: i rifiuti vengono compattati e coperti, e alcuni strati di protezione impediscono alle sostanze inquinanti di uscire.", "Sotto terra, però, la parte organica continua a decomporsi e produce gas metano. «Nella vecchia discarica si è accumulata una quantità molto elevata di gas metano», dice Rafael Bekmullin, direttore di una società di riciclo e smaltimento: ora un progetto vuole estrarlo e usarlo per produrre elettricità. Negli ultimi anni il Paese ha chiuso e bonificato 47 discariche e punta a dimezzarne il numero entro il 2030. Intanto vicino a Samarcanda è in costruzione un impianto che tratterà circa 1.500 tonnellate di rifiuti al giorno e produrrà circa 240 milioni di kilowattora all'anno.", "Alla fine il percorso torna al punto di partenza: il bidone di casa. Ad Angren, a est di Tashkent, l'azienda privata Zero Waste ha distribuito 10.000 sacchetti per un progetto pilota di raccolta differenziata, ma soltanto l'1 per cento circa è tornato con i rifiuti separati. «Senza la selezione dei rifiuti non si può ottenere nulla», dice Sobir Mashrabov, rappresentante regionale dell'azienda: gli impianti da soli non bastano, la separazione deve diventare un'abitudine quotidiana, insegnata dall'asilo all'università. E l'economia circolare, ricorda il servizio, comincia ancora prima: usare meno risorse e prolungare la vita dei prodotti."], "url": "https://it.euronews.com/2026/09/22/ripensare-i-rifiuti-il-percorso-verso-leconomia-circolare"}, "grammar": [{"label": "Grammatica — Nominalizzazione e infinito sostantivato", "subtitle": "il recupero dei materiali · la selezione dei rifiuti · l'usare meno risorse", "title": "«Il recupero dei materiali e la produzione di energia» — quando il verbo diventa nome", "expl": "L'italiano scritto, soprattutto quello dell'informazione e della tecnica, preferisce spesso il NOME al VERBO. Si chiama nominalizzazione: l'azione non viene raccontata con un verbo coniugato, ma «impacchettata» dentro un nome. 1) DAL VERBO AL NOME. Molti nomi di azione si formano con suffissi regolari: -zione (selezionare → la selezione, produrre → la produzione, trasformare → la trasformazione), -mento (trattare → il trattamento, smaltire → lo smaltimento), -tura / -sura (chiudere → la chiusura), -aggio (riciclare → il riciclaggio), oppure senza suffisso, dal verbo stesso (recuperare → il recupero, raccogliere → la raccolta, riciclare → il riciclo). 2) CHI FA E CHE COSA. Nel nome i ruoli della frase entrano con le preposizioni: l'oggetto diventa «di» (si selezionano i rifiuti → la selezione DEI rifiuti), l'agente diventa «di» o, se c'è anche l'oggetto, «da parte di» (la decisione da parte del governo). Così l'informazione resta, ma sparisce il tempo del verbo: «la chiusura di 47 discariche» non dice se sono già chiuse o se si chiuderanno. 3) DOPO UNA PREPOSIZIONE. Dove l'inglese usa la -ing form, l'italiano usa quasi sempre un nome: «senza la selezione dei rifiuti» = without sorting waste; «dopo la chiusura della discarica» = after closing the landfill. 4) L'INFINITO SOSTANTIVATO. L'infinito con l'articolo funziona anch'esso da nome: l'usare meno risorse, il riciclare, un continuo ripetere. È una forma più astratta e un po' letteraria; nella cronaca si preferisce il nome vero (l'uso, il riciclo). Senza articolo l'infinito resta il soggetto più normale: «usare meno risorse è la prima soluzione». 5) ATTENZIONE, TRADUTTORI: l'italiano nominale è spesso più pesante dell'inglese verbale. «The recovery of materials is changing» suona bene in italiano («il recupero dei materiali sta cambiando…»), ma tre nominalizzazioni di fila in una frase italiana diventano illeggibili in inglese: spesso conviene sciogliere il nome in un verbo.", "examples": [["il recupero dei materiali e la produzione di energia stanno cambiando il destino della spazzatura", " — due nominalizzazioni come soggetto: si recuperano i materiali e si produce energia"], ["la trasformazione dei rifiuti in energia si occupa di ciò che resta", " — dal verbo trasformare: l'oggetto entra con «di», il risultato resta con «in»"], ["senza la selezione dei rifiuti non si può ottenere nulla", " — dopo la preposizione l'italiano usa il nome; l'inglese userebbe la forma in -ing"], ["la chiusura e la bonifica di 47 discariche", " — -ura e -fica al posto di «sono state chiuse e bonificate»: sparisce anche il tempo del verbo"], ["usare meno risorse e prolungare la vita dei prodotti → l'usare meno risorse, il prolungare la vita dei prodotti", " — infinito sostantivato: con l'articolo l'infinito diventa un nome"]], "snote": "Regola pratica: verbo + -zione / -mento / -tura / -aggio, oppure il nome nudo del verbo (il recupero, la raccolta, il riciclo). L'oggetto entra con «di», l'agente con «da parte di». Per sciogliere una nominalizzazione, rimetti il verbo e chiediti chi fa che cosa: «la selezione dei rifiuti» → «si selezionano i rifiuti»."}], "comprehension": [{"label": "Comprensione", "h2": "Comprensione", "sub": "1–3: fatti dal servizio · 4–6: domande aperte", "compLabel": "📺 Fatti dal servizio (1–3)  ·  💭 Domande aperte (4–6)", "questions": [["1.", "Che cosa succede ai rifiuti nell'impianto di Sharjah, e che fine fa quello che resta?", "Le macchine separano dai rifiuti misti la plastica, i metalli, la carta e il cartone. Ciò che resta non va direttamente in discarica: viene trasformato in energia elettrica."], ["2.", "Quanti rifiuti domestici produce ogni anno l'Uzbekistan, e quanta parte viene riciclata o trattata?", "Circa 15 milioni di tonnellate all'anno. Solo il 5-6 per cento viene riciclato o trattato da aziende specializzate: quasi tutto il resto finisce in discarica."], ["3.", "Qual è l'ordine giusto, secondo il servizio: riciclo, discarica o energia?", "Prima il riciclo, che conserva i materiali; poi la valorizzazione energetica, che si occupa di ciò che resta; e solo alla fine la discarica, per quello che non si può più recuperare."], ["4.", "Ad Angren sono stati distribuiti 10.000 sacchetti, ma solo l'1 per cento circa è tornato con i rifiuti separati. Perché, secondo te, è così difficile cambiare questa abitudine?", "Perché la raccolta differenziata chiede tempo, spazio in casa e attenzione ogni giorno, mentre il vantaggio non si vede subito e non è personale. Inoltre molti non si fidano: se pensi che poi tutto finisca insieme nello stesso camion, non vale la pena. Per questo Sobir Mashrabov dice che gli impianti non bastano e che la separazione va insegnata dall'asilo all'università: è un'abitudine, non una tecnologia."], ["5.", "Bruciare i rifiuti per produrre elettricità riduce le discariche, ma può anche togliere materiali al riciclo. Come si spiega questo rischio?", "Un impianto costoso deve funzionare sempre, quindi ha bisogno di una quantità costante di rifiuti da bruciare. Se la città ricicla di più, l'impianto rischia di restare vuoto, e così finisce nel forno anche materiale che si poteva recuperare. Per questo il servizio insiste sull'ordine: prima il recupero dei materiali, poi l'energia. L'energia si ottiene una volta sola; un materiale riciclato può tornare nella produzione molte volte."], ["6.", "Il servizio dice che l'economia circolare comincia prima del bidone. Che cosa significa, in pratica, nella vita di tutti i giorni?", "Significa che la prima domanda non è «dove butto questo?», ma «mi serve davvero?». In pratica: comprare meno e meglio, scegliere prodotti che durano e che si possono riparare, far riparare le scarpe o il telefono invece di sostituirli, comprare l'usato, evitare gli imballaggi inutili. Il riciclo è l'ultima difesa, non la prima: un oggetto che non compriamo non ha bisogno né di essere riciclato né di essere bruciato."]]}], "gapfill": {"heading": "Completa le frasi in base al servizio!", "words": ["selezione", "discarica", "metano", "bonificate", "impianto"], "sents": [{"pre": "1.  Senza la", "blank": "selezione", "post": "dei rifiuti non si può ottenere nulla."}, {"pre": "2.  La nuova", "blank": "discarica", "post": "fuori Tashkent riceve tra 1.500 e 2.500 tonnellate al giorno."}, {"pre": "3.  Nella vecchia discarica si è accumulata una quantità molto elevata di gas", "blank": "metano", "post": "."}, {"pre": "4.  Negli ultimi anni sono state chiuse e", "blank": "bonificate", "post": "47 discariche."}, {"pre": "5.  Vicino a Samarcanda è in costruzione un", "blank": "impianto", "post": "che trasformerà i rifiuti in energia."}], "answers": [["1.", "selezione", "senza la selezione dei rifiuti non si può ottenere nulla"], ["2.", "discarica", "la nuova discarica di 24 ettari fuori Tashkent riceve tra 1.500 e 2.500 tonnellate al giorno"], ["3.", "metano", "nella vecchia discarica si è accumulata una quantità molto elevata di gas metano"], ["4.", "bonificate", "negli ultimi anni il Paese ha chiuso e bonificato 47 discariche"], ["5.", "impianto", "vicino a Samarcanda è in costruzione un impianto da circa 1.500 tonnellate al giorno"]]}, "verofalso": {"items": [{"s": "Nel mondo si producono ogni anno più di due miliardi di tonnellate di rifiuti urbani.", "a": "V", "note": ""}, {"s": "In Uzbekistan viene riciclata o trattata circa metà dei rifiuti domestici.", "a": "F", "note": "Solo il 5-6 per cento."}, {"s": "Nell'impianto di Sharjah le macchine separano plastica, metalli, carta e cartone.", "a": "V", "note": ""}, {"s": "L'Uzbekistan vuole dimezzare il numero delle discariche entro il 2030.", "a": "V", "note": ""}, {"s": "Ad Angren quasi tutti i sacchetti distribuiti sono tornati con i rifiuti separati.", "a": "F", "note": "È tornato soltanto l'1 per cento circa."}, {"s": "Il nuovo impianto vicino a Samarcanda è già in funzione.", "a": "N", "note": "Il servizio dice che è in costruzione, non quando entrerà in funzione."}], "key_html": "<b>1.</b> Vero &nbsp; <b>2.</b> Falso (5-6%) &nbsp; <b>3.</b> Vero &nbsp; <b>4.</b> Vero &nbsp; <b>5.</b> Falso (circa l'1%) &nbsp; <b>6.</b> Non detto"}, "discussion": [{"q": "Racconta come funziona la raccolta differenziata dove abiti tu: quanti bidoni ci sono, che cosa si può e che cosa non si può mettere dentro, e che cosa non funziona bene.", "m": "A Budapest, nel mio palazzo, ci sono tre contenitori in cortile: uno per la carta, uno per la plastica e il metallo insieme, e uno per tutto il resto. Il vetro no: per il vetro bisogna andare fino alla campana verde all'angolo della strada, e questo secondo me è il punto debole del sistema, perché chi ha fretta lo butta con l'indifferenziata. I rifiuti di cucina, poi, finiscono quasi sempre nel bidone normale: il compost esiste soprattutto nelle case con giardino. In generale la raccolta funziona, ma bisognerebbe spiegare meglio che cosa si può mettere davvero nella plastica: metà dei vicini, credo, butta lì dentro qualsiasi cosa e così il contenuto diventa inutilizzabile."}, {"q": "Riciclo, valorizzazione energetica, discarica: se tu fossi il sindaco della tua città e avessi i soldi per una cosa sola, che cosa faresti prima, e perché?", "m": "Metterei i soldi nella selezione, non nel forno. Un impianto che brucia i rifiuti è spettacolare e produce elettricità, ma costa moltissimo e poi ha bisogno di rifiuti per trent'anni: la città finisce per doverne produrre. Con la stessa cifra si possono comprare contenitori, camion e soprattutto informazione: nelle scuole, nei condomini, nei negozi. Certo, la raccolta differenziata da sola non basta, perché alla fine resta sempre qualcosa che non si può recuperare, e quel materiale è meglio bruciarlo che seppellirlo. Però l'ordine mi sembra chiaro: prima il recupero dei materiali, poi l'energia, la discarica il meno possibile."}, {"q": "Nel servizio il verbo sparisce spesso dietro un nome: «la selezione dei rifiuti», «il recupero dei materiali». Secondo te che effetto fa questo stile su chi legge o ascolta?", "m": "Fa sembrare tutto più tecnico e più neutro. Quando dico «la chiusura di 47 discariche», il lettore riceve un dato; quando dico «hanno chiuso 47 discariche», compare qualcuno che ha deciso e che si può lodare o criticare. Il nome, insomma, nasconde l'agente e anche il tempo: non si sa più se è già successo o se succederà. Nel mio lavoro di traduttore questa è una scelta quotidiana: l'inglese preferisce il verbo, l'italiano il nome, e se traduco parola per parola ottengo o una frase pesante o una frase troppo diretta. Per questo di solito sciolgo una nominalizzazione su due, e tengo il nome solo dove serve davvero il tono ufficiale."}], "homework": [{"label": "Compiti — Scrittura", "bgCls": "red", "blockCls": "red-b", "h3color": "#E24E3E", "h3text": "✍ Il percorso dei rifiuti (80–100 parole)", "bodyHTML": "Scrivi un breve testo di cronaca sul percorso dei rifiuti nella tua città o nel tuo Paese: che cosa succede davvero a quello che butti via.<br><br><b>Domande guida:</b> Che cosa si raccoglie separatamente? Dove finiscono i rifiuti misti: in discarica o in un impianto? Che cosa funziona bene e che cosa no? Che cosa dovrebbe cambiare entro il 2030?<br><br>Usa almeno <b>cinque parole</b> della lezione (per esempio: <i>la raccolta differenziata, la discarica, il recupero, l'impianto, prolungare la vita</i>) e almeno <b>tre nominalizzazioni</b> (<i>la selezione dei rifiuti, la chiusura della discarica, il trattamento dell'organico…</i>).<br><br>Poi, sotto il testo, <b>sciogli due</b> delle tue nominalizzazioni in una frase con il verbo (<i>la selezione dei rifiuti → si selezionano i rifiuti</i>).", "chips": ["80–100 parole", "5 parole nuove", "3 nominalizzazioni"]}], "grammar_practice": [{"title": "Nome o verbo? Riconosci la nominalizzazione", "instr": "Per ogni frase indica se l'azione è espressa da un VERBO coniugato oppure da una NOMINALIZZAZIONE (nome di azione o infinito sostantivato).", "items": ["1.  Il recupero dei materiali cambia il destino della spazzatura.", "2.  Si recuperano i materiali prima di bruciare il resto.", "3.  Senza la selezione dei rifiuti non si ottiene nulla.", "4.  Se non selezioni i rifiuti, non ottieni nulla.", "5.  La chiusura e la bonifica di 47 discariche sono costate molto.", "6.  L'usare meno risorse è la prima forma di economia circolare.", "7.  Negli ultimi anni hanno chiuso e bonificato 47 discariche.", "8.  La trasformazione dei rifiuti in energia si occupa di ciò che resta."], "answers": ["1.  NOMINALIZZAZIONE — il recupero (dal verbo recuperare), con l'oggetto introdotto da «di».", "2.  VERBO — si recuperano, con il si passivante.", "3.  NOMINALIZZAZIONE — la selezione: dopo una preposizione l'italiano preferisce il nome.", "4.  VERBO — la stessa idea, ma sciolta in una frase con «se».", "5.  NOMINALIZZAZIONE (doppia) — la chiusura (-ura) e la bonifica: sparisce anche il tempo del verbo.", "6.  NOMINALIZZAZIONE — infinito sostantivato: l'articolo trasforma l'infinito in un nome.", "7.  VERBO — hanno chiuso e bonificato: qui compare anche l'agente (loro).", "8.  NOMINALIZZAZIONE — la trasformazione, con «di» per l'oggetto e «in» per il risultato."]}, {"title": "Dal verbo al nome: scegli la forma giusta", "instr": "Cerchia il nome di azione corretto. Attenzione al suffisso e all'articolo.", "items": ["1.  selezionare  →  (la selezione / il selezionamento)", "2.  recuperare  →  (il recupero / la recuperazione)", "3.  smaltire  →  (lo smaltimento / la smaltizione)", "4.  chiudere  →  (la chiusura / la chiudenza)", "5.  raccogliere  →  (la raccolta / il raccoglimento dei rifiuti)", "6.  trattare  →  (il trattamento / la trattazione dei rifiuti)", "7.  riciclare  →  (il riciclo o il riciclaggio / la riciclazione)", "8.  produrre  →  (la produzione / il producimento)"], "answers": ["1.  la selezione — suffisso -zione, il più produttivo per i nomi di azione.", "2.  il recupero — nome «nudo», ricavato dal verbo senza suffisso.", "3.  lo smaltimento — suffisso -mento (verbi in -ire e -are).", "4.  la chiusura — suffisso -ura; così anche apertura, rottura.", "5.  la raccolta — dal participio; il raccoglimento esiste, ma significa concentrazione interiore.", "6.  il trattamento — la trattazione esiste, ma vale per un argomento, non per i rifiuti.", "7.  il riciclo o il riciclaggio — attenzione: riciclaggio significa anche riciclaggio di denaro.", "8.  la produzione — -zione, con l'oggetto introdotto da «di»."]}, {"title": "Sciogli la nominalizzazione", "instr": "Riscrivi l'espressione con un verbo, usando il si passivante o un soggetto generico. Scrivi solo la frase nuova.", "items": ["1.  la selezione dei rifiuti  →  ______", "2.  la chiusura di 47 discariche  →  ______", "3.  il recupero del gas metano  →  ______", "4.  la trasformazione dei rifiuti in energia  →  ______", "5.  la distribuzione di 10.000 sacchetti  →  ______", "6.  il prolungamento della vita dei prodotti  →  ______"], "answers": ["1.  Si selezionano i rifiuti. (oppure: i rifiuti vengono selezionati)", "2.  Sono state chiuse 47 discariche. (oppure: hanno chiuso 47 discariche)", "3.  Si recupera il gas metano. (oppure: il gas metano viene recuperato)", "4.  I rifiuti vengono trasformati in energia. (oppure: si trasformano i rifiuti in energia)", "5.  Sono stati distribuiti 10.000 sacchetti. (oppure: l'azienda ha distribuito 10.000 sacchetti)", "6.  Si prolunga la vita dei prodotti. (oppure: i prodotti durano più a lungo)", "Nota: sciogliendo il nome devi scegliere un tempo e spesso anche un agente — proprio l'informazione che la nominalizzazione lasciava fuori."]}]};

/* ════════════════════════════════════════════════════════════════

function makeSlide(label, cls) {
  const div = document.createElement('div');
  div.className = 'slide ' + cls;
  vp.appendChild(div);
  SLIDES.push({ label, el: div });
  if (cls !== 'title-slide' && cls !== 'sep-slide') {
    const bs = document.createElement('div'); bs.className = 'brand-strip';
    const n = document.createElement('span'); n.className = 'bs-name'; n.textContent = 'Goodman';
    const l = document.createElement('span'); l.className = 'bs-lang'; l.textContent = UI.brandLang;
    bs.appendChild(n); bs.appendChild(l); div.appendChild(bs);
  }
  return div;
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }
function ap(parent, ...children) { children.forEach(c => parent.appendChild(c)); return parent; }

// ── BUILD (B1 shape: warm-up → vocab → video → reading → grammar → comprehension → exercises → discussion → homework)
function build() {
  const D = SPEC.dividers || {};
  makeTitle(SPEC.title_slide || {});

  makeDivider(D.warmup);
  makeQuestionsSlide(UI.warmupLabel, UI.warmupH2, UI.warmupSub, UI.warmupBox, SPEC.warmup.questions);
  if (SPEC.warmup.episode) makeProseSlide('Riscaldamento — Di cosa parla?', SPEC.warmup.episode.h2, SPEC.warmup.episode.sub, SPEC.warmup.episode.body);
  if (SPEC.figures) makeFiguresSlide(SPEC.figures);

  makeDivider(D.vocab);
  const per = 2; // rule: 8 cards per slide (2 groups × 4)
  for (let i = 0; i < VOCAB.length; i += per) {
    makeVocabSlide('Parole chiave — ' + (Math.floor(i/per) + 1) + '/' + Math.ceil(VOCAB.length/per), VOCAB.slice(i, i + per));
  }

  if (SPEC.video && SPEC.video.parts && SPEC.video.parts.length) {
    makeDivider(D.video);
    const vid = ytId(SPEC.video.url || SPEC.video.video_id);
    SPEC.video.parts.forEach((p, i) => makeVideoPartSlide(p, i, SPEC.video.parts.length, vid));
  }

  if (SPEC.reading) { makeDivider(D.reading); makeReadingSlide(SPEC.reading); }

  if (SPEC.grammar && SPEC.grammar.length) { makeDivider(D.grammar); SPEC.grammar.forEach(makeGramSlide); }

  makeDivider(D.comprehension);
  (SPEC.comprehension || []).forEach(makeCompSlide);

  makeDivider(D.exercises);
  if (SPEC.gapfill) { makeGapSlide(SPEC.gapfill); makeGapAnswerSlide(SPEC.gapfill); }
  if (SPEC.match) makeMatchSlide(SPEC.match);
  if (SPEC.verofalso) makeVFSlide(SPEC.verofalso);

  makeDivider(D.discussion);
  makeDiscSlide();

  if (SPEC.homework && SPEC.homework.length) { makeDivider(D.homework); SPEC.homework.forEach(makeHWSlide); }
}
build();

// ── NAVIGATION ───────────────────────────────────────────────────
const TOTAL = SLIDES.length; let cur = 0;
SLIDES[0].el.classList.add('active');
const DISC_IDX = SLIDES.findIndex(s => s.el.classList.contains('disc-slide'));
function go(d) {
  SLIDES[cur].el.classList.remove('active');
  cur = Math.max(0, Math.min(TOTAL - 1, cur + d));
  SLIDES[cur].el.classList.add('active'); SLIDES[cur].el.scrollTop = 0; updateNav();
  if (cur === DISC_IDX) initMicPermission();
}
function updateNav() {
  document.getElementById('slide-label').textContent = (cur+1) + ' / ' + TOTAL + ' — ' + SLIDES[cur].label;
  document.getElementById('pb').style.width = ((cur+1)/TOTAL*100) + '%';
  document.getElementById('btn-prev').disabled = cur === 0;
  document.getElementById('btn-next').disabled = cur === TOTAL-1;
}
updateNav();
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(1);
  if (e.key === 'ArrowLeft') go(-1);
  if ((e.key==='r'||e.key==='R') && cur===DISC_IDX) toggleMic();
});

// ── GAP FILL ─────────────────────────────────────────────────────
let selWord = null;
function wireGap() {
  const wb = document.getElementById('wb'); const gs = document.getElementById('gap-sents'); if (!wb || !gs) return;
  [...GAP_WORDS].sort(()=>Math.random()-0.5).forEach(w => {
    const d = el('div','dword', w); d.dataset.w = w;
    d.onclick = () => { if (d.classList.contains('used')) return; document.querySelectorAll('.dword').forEach(x=>x.classList.remove('sel-w')); d.classList.add('sel-w'); selWord = w; };
    wb.appendChild(d);
  });
  GAP_SENTS.forEach(s => { const d = el('div','gap-sentence'); d.innerHTML = s.pre + ' <span class="drop-zone" data-blank="'+s.blank+'" onclick="fillZone(this)">_ _ _ _ _</span> ' + s.post; gs.appendChild(d); });
}
function fillZone(z) {
  if (!selWord || z.classList.contains('ok')) return;
  document.querySelectorAll('.drop-zone').forEach(oz=>{ if(oz!==z && oz.dataset.filled===selWord){oz.textContent='_ _ _ _ _';oz.classList.remove('filled','ok','wrong');oz.dataset.filled='';} });
  z.textContent = selWord; z.classList.add('filled'); z.dataset.filled = selWord;
  document.querySelectorAll('.dword').forEach(d=>d.classList.remove('sel-w')); selWord = null;
}
function checkGap() { document.querySelectorAll('.drop-zone').forEach(z=>{ z.classList.remove('ok','wrong'); if(z.dataset.filled===z.dataset.blank) z.classList.add('ok'); else if(z.dataset.filled) z.classList.add('wrong'); }); }
function resetGap() { document.querySelectorAll('.drop-zone').forEach(z=>{z.textContent='_ _ _ _ _';z.classList.remove('filled','ok','wrong');z.dataset.filled='';}); document.querySelectorAll('.dword').forEach(d=>d.classList.remove('used','sel-w')); selWord = null; }

// ── MATCHING ─────────────────────────────────────────────────────
let selTerm = null;
function wireMatch() {
  const tc = document.getElementById('mterms'), dc = document.getElementById('mdefs'); if (!tc || !dc) return;
  const shuffled = [...MATCH].sort(()=>Math.random()-0.5);
  MATCH.forEach((m,i)=>{ const e2 = el('div','mitem', m.t); e2.dataset.pair = i; e2.dataset.side='t';
    e2.onclick = () => { if (e2.classList.contains('matched')) return; document.querySelectorAll('.mitem[data-side="t"]').forEach(x=>x.classList.remove('sel')); e2.classList.add('sel'); selTerm = e2; };
    tc.appendChild(e2); });
  shuffled.forEach(m=>{ const oi = MATCH.findIndex(x=>x.d===m.d); const e2 = el('div','mitem', m.d); e2.dataset.pair = oi; e2.dataset.side='d';
    e2.onclick = () => { if (!selTerm || e2.classList.contains('matched')) return;
      if (selTerm.dataset.pair === e2.dataset.pair) { selTerm.classList.remove('sel'); selTerm.classList.add('matched'); e2.classList.add('matched'); selTerm = null; }
      else { e2.classList.add('bad'); setTimeout(()=>e2.classList.remove('bad'),500); const st = selTerm; selTerm = null; st.classList.add('bad'); setTimeout(()=>st.classList.remove('bad','sel'),500); } };
    dc.appendChild(e2); });
}

// ── VERO / FALSO / NON DETTO ──────────────────────────────────
function wireVF() {
  const root = document.getElementById('vf-root'); if (!root) return;
  VF.forEach((item,i)=>{
    const row = el('div','vf-row'); const btns = el('div','vf-btns');
    UI.vfBtns.forEach(([cls,val])=>{ const b = el('button','vfb '+cls, val); b.onclick = () => checkVF(b, cls, item.a, i); btns.appendChild(b); });
    const body = document.createElement('div'); body.style.flex='1';
    body.appendChild(el('div','', String(i+1)+'. '+item.s));
    if (item.note) { const n = el('div','vf-note','→ '+item.note); n.id='vfn'+i; body.appendChild(n); }
    ap(row, btns, body); root.appendChild(row);
  });
}
function checkVF(btn, chosen, correct, idx) {
  btn.closest('.vf-row').querySelectorAll('.vfb').forEach(b=>b.classList.remove('correct','incorrect'));
  if (chosen===correct) btn.classList.add('correct');
  else { btn.classList.add('incorrect'); const n=document.getElementById('vfn'+idx); if(n) n.classList.add('show'); }
}

// ── DISCUSSION + MIC ─────────────────────────────────────────────
let dIdx=0, recog=null, recording=false, micOK=false, micStream=null;
function wireDisc() {
  const dots = document.getElementById('ddots'); if (!dots) return;
  DISC.forEach((_,i)=>{ const d = el('div','disc-dot'+(i===0?' active':'')); d.onclick = () => gotoDisc(i); dots.appendChild(d); });
  loadDisc();
}
function loadDisc() {
  const dq = document.getElementById('dq'); if (!dq) return;
  dq.textContent = DISC[dIdx].q;
  document.getElementById('dqnum').textContent = (dIdx+1) + '. ' + UI.question + UI.ofN + DISC.length;
  document.getElementById('dmtext').textContent = DISC[dIdx].m;
  document.getElementById('dmbox').classList.add('blur');
  if (!recording) { const ub = document.getElementById('dubox'); ub.innerHTML=''; ub.appendChild(el('span','ph', UI.micPh)); ub.classList.remove('listening'); }
  document.querySelectorAll('.disc-dot').forEach((d,i)=>d.classList.toggle('active', i===dIdx));
  const pb = document.getElementById('dprev'), nb = document.getElementById('dnext');
  if (pb) pb.disabled = dIdx === 0;
  if (nb) { const last = dIdx >= DISC.length - 1; nb.textContent = last ? UI.nextSlide : UI.next; nb.classList.toggle('to-slide', last); }
}
function dNav(d) { document.querySelectorAll('.disc-dot')[dIdx].classList.add('done'); dIdx = Math.max(0, Math.min(DISC.length-1, dIdx+d)); loadDisc(); }
function gotoDisc(i){ dIdx=i; loadDisc(); }
function revealModel(){ document.getElementById('dmbox').classList.toggle('blur'); }
function initMicPermission() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { const w=document.getElementById('swarn'); if(w) w.style.display='block'; return; }
  if (micOK && micStream && micStream.active) return;
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(stream => { micStream = stream; micOK = true; const st = document.getElementById('micstat'); if (st) st.textContent = UI.micReady; })
      .catch(e => { if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) { const w=document.getElementById('swarn'); if(w) w.style.display='block'; } });
  }
}
function toggleMic(){ recording ? stopMic() : startMic(); }
function startMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) return;
  recog = new SR(); recog.lang='it-IT'; recog.continuous=true; recog.interimResults=true;
  const box = document.getElementById('dubox'); box.innerHTML=''; box.classList.add('listening');
  let final='';
  recog.onresult = e => { let interim=''; for (let i=e.resultIndex; i<e.results.length; i++) { if (e.results[i].isFinal) final += e.results[i][0].transcript + ' '; else interim += e.results[i][0].transcript; } box.textContent = final + interim; micOK = true; };
  recog.onerror = e => { if (e.error!=='no-speech') stopMic(); };
  recog.onend = () => { if (recording) recog.start(); };
  recog.start(); recording = true;
  document.getElementById('micbtn').classList.add('on'); document.getElementById('micbtn').textContent = '⏹';
  document.getElementById('micstat').textContent = UI.micRec;
}
function stopMic() {
  if (recog) { recog.stop(); recog=null; } recording=false;
  document.getElementById('micbtn').classList.remove('on'); document.getElementById('micbtn').textContent = '🎤';
  document.getElementById('micstat').textContent = UI.micPause; document.getElementById('dubox').classList.remove('listening');
}
function toggleAK(id){ document.getElementById(id).classList.toggle('show'); }

wireGap(); wireMatch(); wireVF(); wireDisc();

// ── Text-size control ────────────────────────────────────────────
(function(){
  let z = 100;
  const bar = document.createElement('div'); bar.id='tsize';
  bar.innerHTML = '<span>' + UI.tsize + '</span><button id="tsm">A−</button><span id="tsv">100%</span><button id="tsp">A+</button><button id="tsr">⟲</button>';
  const _tb=document.getElementById('topbar'), _nb=document.getElementById('nav-btns');
  if(_tb && _nb) _tb.insertBefore(bar, _nb); else document.body.appendChild(bar);
  function apply(){ document.getElementById('viewport').style.zoom = (z/100); document.getElementById('tsv').textContent = z+'%'; }
  document.getElementById('tsm').onclick = ()=>{ z=Math.max(70,z-10); apply(); };
  document.getElementById('tsp').onclick = ()=>{ z=Math.min(220,z+10); apply(); };
  document.getElementById('tsr').onclick = ()=>{ z=100; apply(); };
})();
</script>
