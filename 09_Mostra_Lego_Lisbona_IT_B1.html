<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quindici milioni di mattoncini: la più grande mostra Lego d&#x27;Europa — Goodman Italiano B1</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: Calibri, 'Segoe UI', sans-serif;
  background: #0e8388;
  color: #1e2a2e;
}

/* ── TOP BAR ── */
#pb-wrap { position: fixed; top: 0; left: 0; right: 0; height: 5px; background: rgba(255,255,255,0.2); z-index: 200; }
#pb { height: 5px; background: #fb6a5a; transition: width 0.3s; width: 0%; }

#topbar {
  position: fixed; top: 5px; left: 0; right: 0; height: 50px;
  background: #0e8388; z-index: 199;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2vw;
  border-bottom: 1px solid rgba(255,255,255,0.18);
}
#slide-label { color: white; font-size: 1.5vw; font-weight: 700; }
#nav-btns { display: flex; gap: 1vw; }
.nbtn {
  background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.3);
  color: white; padding: 0.4vh 1.5vw; border-radius: 5px;
  cursor: pointer; font-size: 1.3vw; font-family: inherit; font-weight: 600;
}
.nbtn:hover { background: rgba(255,255,255,0.28); }
.nbtn:disabled { opacity: 0.3; cursor: default; }

/* ── VIEWPORT ── */
#viewport {
  position: fixed;
  top: 55px; left: 0; right: 0; bottom: 0;
}

/* ── SLIDES ── */
.slide {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease;
  overflow: hidden;
}
.slide.active { opacity: 1; pointer-events: all; }

/* ════════════════════════════════
   DIVIDER SLIDES
════════════════════════════════ */
.div-slide {
  background: linear-gradient(160deg, #073c40 0%, #0e8388 60%, #0a5458 100%);
  color: white;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  padding: 3vh 6vw;
  position: relative;
}
.div-slide::after {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0;
  height: 0.8vh; background: #fb6a5a;
}
.div-icon { font-size: 7vw; line-height: 1; margin-bottom: 2vh; }
.div-num { font-size: 1.2vw; letter-spacing: 0.4vw; text-transform: uppercase; opacity: 0.5; margin-bottom: 1.5vh; font-weight: 700; }
.div-slide h2 { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 5.5vw; line-height: 1.1; margin-bottom: 2.5vh; }
.div-desc { font-size: 1.7vw; opacity: 0.78; max-width: 70vw; line-height: 1.6; margin-bottom: 3.5vh; }
.div-tags { display: flex; flex-wrap: wrap; gap: 1vw; justify-content: center; max-width: 75vw; }
.div-tag {
  background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.28);
  border-radius: 3vw; padding: 0.8vh 2vw; font-size: 1.3vw;
}

/* ════════════════════════════════
   TITLE SLIDE
════════════════════════════════ */
.title-slide {
  background: linear-gradient(150deg, #052b2e 0%, #0e8388 100%);
  color: white;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  padding: 3vh 4vw;
}
.pod-label { font-size: 1.5vw; letter-spacing: 0.4vw; text-transform: uppercase; color: #fb6a5a; margin-bottom: 3vh; font-weight: 700; }
.title-slide h1 { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 6.5vw; line-height: 1.15; width: 90vw; margin-bottom: 3.5vh; }
.red-line { width: 6vw; height: 0.6vh; background: #fb6a5a; margin: 0 auto 3vh; }
.title-meta { display: flex; gap: 4vw; font-size: 1.8vw; opacity: 0.65; flex-wrap: wrap; justify-content: center; }

/* ════════════════════════════════
   CONTENT SLIDE BASE
════════════════════════════════ */
.con-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.slide-head {
  border-left: 0.5vw solid #fb6a5a;
  padding-left: 1.5vw;
  margin-bottom: 2.5vh;
  flex-shrink: 0;
}
.slide-head h2 { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; color: #0e8388; font-size: 3.2vw; line-height: 1.15; margin-bottom: 0.4vh; }
.sub { color: #5e7377; font-size: 1.3vw; }

/* ════════════════════════════════
   ANTICIPAZIONE — split slides
════════════════════════════════ */
.single-box {
  flex: 1;
  background: #e6f3f2;
  border-radius: 1vw;
  padding: 3vh 3vw;
  border-top: 0.5vh solid #0e8388;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.single-box h3 { color: #0e8388; font-size: 2.2vw; margin-bottom: 2.5vh; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; }
.single-box ol { padding-left: 2.5vw; flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
.single-box ol li { font-size: 2vw; line-height: 1.6; }
.single-box p { font-size: 2vw; line-height: 1.75; flex: 1; display: flex; align-items: center; }

/* ════════════════════════════════
   FIGURE CHIAVE
════════════════════════════════ */
.figures-slide {
  background: #ffeae6;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.figures-slide .slide-head { border-color: #fb6a5a; }
.figures-slide .slide-head h2 { color: #e24e3e; }
.figures-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr 1fr;
  gap: 1.5vh 2vw;
  flex: 1;
}
.figure-card {
  background: white; border-radius: 0.8vw;
  border-left: 0.5vw solid #fb6a5a;
  padding: 1.5vh 2vw;
  display: flex; flex-direction: column; justify-content: center;
}
.figure-card .fname { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 1.9vw; font-weight: 700; color: #0e8388; margin-bottom: 0.8vh; }
.figure-card .fdesc { font-size: 1.35vw; color: #3a4a4e; line-height: 1.5; }

/* ════════════════════════════════
   VOCABULARY
════════════════════════════════ */
.vocab-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 2vh 4vw 2vh;
  overflow: hidden;
}
.vocab-group-label {
  font-size: 1.1vw; letter-spacing: 0.2vw; text-transform: uppercase;
  color: #5e7377; font-weight: 700; margin: 1.2vh 0 1vh;
  padding-bottom: 0.6vh; border-bottom: 2px solid #d7e6e4;
  flex-shrink: 0;
}
.vocab-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 1.2vh 2vw; flex: 1;
}
.vcard {
  background: white; border-radius: 0.8vw;
  box-shadow: 0 3px 12px rgba(0,0,0,0.09);
  cursor: pointer; perspective: 900px;
}
.vcard-inner {
  width: 100%; height: 100%; position: relative;
  transform-style: preserve-3d; transition: transform 0.45s;
}
.vcard.flipped .vcard-inner { transform: rotateY(180deg); }
.vfront, .vback {
  position: absolute; width: 100%; height: 100%;
  border-radius: 0.8vw; padding: 1.8vh 1.8vw;
  backface-visibility: hidden;
  display: flex; flex-direction: column; justify-content: space-between;
}
.vfront { background: white; }
.vfront .term { font-size: 2vw; font-weight: 700; color: #1e2a2e; line-height: 1.3; flex: 1; display: flex; align-items: center; }
.vfront .vbottom { display: flex; flex-direction: column; gap: 0.6vh; flex-shrink: 0; }
.vfront .rtag { display: inline-block; font-size: 1vw; padding: 0.3vh 0.8vw; border-radius: 2vw; background: #e6f3f2; color: #0e8388; font-weight: 600; align-self: flex-start; }
.vfront .hint { font-size: 1.1vw; color: #9bb0b2; }
.vback { background: #e6f3f2; transform: rotateY(180deg); }
.vback .en { font-size: 1.8vw; font-weight: 700; color: #0e8388; margin-bottom: 1vh; }
.vback .ex { font-size: 1.2vw; font-style: italic; color: #1e2a2e; border-left: 0.3vw solid #fb6a5a; padding-left: 0.8vw; line-height: 1.55; flex: 1; }
.vback .rnote { font-size: 0.95vw; color: #5e7377; margin-top: 0.8vh; flex-shrink: 0; }

/* ════════════════════════════════
   GRAMMAR
════════════════════════════════ */
.gram-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.gram-block {
  background: white; border-radius: 1vw;
  padding: 3vh 3vw;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  border-left: 0.6vw solid #0a6e72;
  flex: 1; display: flex; flex-direction: column;
}
.gram-block h3 { color: #0e8388; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 2.5vw; margin-bottom: 1.5vh; line-height: 1.2; }
.gram-block .expl { font-size: 1.55vw; color: #3a4a4e; line-height: 1.7; margin-bottom: 2vh; flex-shrink: 0; }
.gram-block ul { list-style: none; padding: 0; flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
.gram-block ul li { background: #e6f3f2; border-radius: 0.6vw; padding: 1.5vh 1.5vw; font-size: 1.45vw; font-style: italic; line-height: 1.6; }
.gram-block ul li strong { font-style: normal; color: #fb6a5a; font-size: 1.5vw; }
.gram-block .snote { font-size: 1.35vw; color: #1E8449; font-weight: 600; margin-top: 2vh; line-height: 1.55; padding: 1.5vh 1.5vw; background: #EAFAF1; border-radius: 0.6vw; flex-shrink: 0; }

/* ════════════════════════════════
   COMPREHENSION
════════════════════════════════ */
.comp-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.comp-label { font-size: 1.2vw; letter-spacing: 0.2vw; text-transform: uppercase; color: #5e7377; margin-bottom: 2vh; font-weight: 700; padding-bottom: 1vh; border-bottom: 2px solid #d7e6e4; flex-shrink: 0; }
.qlist { flex: 1; display: flex; flex-direction: column; gap: 1.5vh; }
.qitem { background: white; border-radius: 0.8vw; padding: 2vh 2.5vw; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; gap: 1.5vw; font-size: 1.8vw; line-height: 1.65; flex: 1; align-items: center; }
.qnum { color: #fb6a5a; font-weight: 700; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 2.2vw; min-width: 2.5vw; flex-shrink: 0; }

/* ════════════════════════════════
   CULTURAL
════════════════════════════════ */
.cult-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.cult-block {
  background: white; border-radius: 1vw;
  padding: 3vh 3vw;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  border-left: 0.6vw solid #fb6a5a;
  flex: 1; display: flex; flex-direction: column;
}
.cult-block h3 { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; color: #0e8388; font-size: 2.4vw; margin-bottom: 2vh; line-height: 1.2; flex-shrink: 0; }
.cult-block p { font-size: 1.6vw; line-height: 1.8; flex: 1; }
.en-gl { font-style: italic; color: #5e7377; font-size: 1.2vw; margin-top: 1.5vh; display: block; flex-shrink: 0; }
.cult-hook { margin-top: 2.5vh; padding: 1.5vh 2vw; background: #fff1ef; border-radius: 0.6vw; font-size: 1.45vw; color: #e24e3e; line-height: 1.6; flex-shrink: 0; }

/* ════════════════════════════════
   EXERCISES
════════════════════════════════ */
.ex-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.ex-block {
  background: white; border-radius: 1vw;
  padding: 2.5vh 3vw;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  flex: 1; display: flex; flex-direction: column;
}
.ex-block h3 { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; color: #0e8388; font-size: 2.2vw; margin-bottom: 0.8vh; flex-shrink: 0; }
.ex-instr { font-size: 1.3vw; color: #5e7377; margin-bottom: 1.8vh; line-height: 1.6; flex-shrink: 0; }

/* Gap fill */
.word-bank { display: flex; flex-wrap: wrap; gap: 1vw; margin-bottom: 2vh; padding: 1.5vh 1.5vw; background: #e6f3f2; border-radius: 0.8vw; flex-shrink: 0; }
.dword { background: #0e8388; color: white; padding: 0.8vh 2vw; border-radius: 3vw; font-size: 1.5vw; cursor: pointer; user-select: none; font-weight: 600; }
.dword.sel-w { outline: 0.3vw solid #fb6a5a; outline-offset: 0.2vw; }
.dword.used { opacity: 0.3; cursor: default; }
.gap-sentences { flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
.gap-sentence { font-size: 1.6vw; line-height: 1.4; }
.drop-zone { display: inline-block; min-width: 10vw; border-bottom: 0.2vw solid #0e8388; margin: 0 0.5vw; padding: 0 0.5vw; color: #9bb0b2; font-style: italic; cursor: pointer; vertical-align: bottom; font-size: 1.5vw; }
.drop-zone.filled { color: #1e2a2e; font-style: normal; font-weight: 700; background: #e6f3f2; border-radius: 0.3vw; border-bottom-color: #0a6e72; }
.drop-zone.ok { border-bottom-color: #1E8449; background: #EAFAF1; color: #1E8449; }
.drop-zone.wrong { border-bottom-color: #fb6a5a; background: #ffeae6; color: #fb6a5a; }
.ex-btns { display: flex; gap: 1vw; margin-top: 1.5vh; flex-shrink: 0; }

/* Answer key slide */
.ak-slide {
  background: #EAFAF1;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.ak-slide .slide-head { border-color: #1E8449; }
.ak-slide .slide-head h2 { color: #1E8449; }
.ak-content { background: white; border-radius: 1vw; padding: 2vh 3vw; box-shadow: 0 4px 16px rgba(0,0,0,0.08); border-left: 0.6vw solid #1E8449; flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
.ak-item { display: flex; gap: 1.5vw; align-items: center; padding: 1.5vh 2vw; background: #F4FDF8; border-radius: 0.6vw; font-size: 1.55vw; line-height: 1.6; }
.ak-num { color: #1E8449; font-weight: 700; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 2vw; min-width: 2.5vw; }
.ak-word { font-weight: 700; color: #1E8449; }
.ak-quote { font-style: italic; color: #5e7377; }

/* Matching */
.match-wrap { flex: 1; display: flex; flex-direction: column; }
.match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2vw; flex: 1; margin-bottom: 1.5vh; }
.match-col-label { font-size: 1.1vw; letter-spacing: 0.2vw; text-transform: uppercase; color: #5e7377; margin-bottom: 1vh; font-weight: 700; }
.mitem { padding: 1.5vh 1.8vw; border-radius: 0.6vw; margin-bottom: 0.8vh; font-size: 1.45vw; cursor: pointer; border: 0.2vw solid transparent; background: #e6f3f2; transition: all 0.18s; line-height: 1.45; }
.mitem:hover { border-color: #0a6e72; }
.mitem.sel { border-color: #0e8388; background: #cde9e7; font-weight: 700; }
.mitem.matched { border-color: #1E8449; background: #EAFAF1; color: #1E8449; cursor: default; font-weight: 600; }
.mitem.bad { border-color: #fb6a5a; background: #ffeae6; }

/* VF */
.vf-list { flex: 1; display: flex; flex-direction: column; gap: 1.2vh; }
.vf-row { display: flex; gap: 1.5vw; align-items: center; padding: 1.8vh 2vw; background: white; border-radius: 0.8vw; box-shadow: 0 2px 8px rgba(0,0,0,0.06); font-size: 1.5vw; line-height: 1.6; flex: 1; }
.vf-btns { display: flex; gap: 0.6vw; flex-shrink: 0; }
.vfb { padding: 0.6vh 1.2vw; border-radius: 2vw; border: 0.2vw solid; font-size: 1.2vw; font-weight: 700; cursor: pointer; background: transparent; font-family: inherit; }
.vfb.V { border-color: #1E8449; color: #1E8449; }
.vfb.F { border-color: #fb6a5a; color: #fb6a5a; }
.vfb.N { border-color: #5e7377; color: #5e7377; }
.vfb.correct { background: #1E8449; color: white; border-color: #1E8449; }
.vfb.incorrect { background: #fb6a5a; color: white; border-color: #fb6a5a; }
.vf-note { font-size: 1.1vw; color: #1E8449; font-style: italic; margin-top: 0.5vh; display: none; }
.vf-note.show { display: block; }

/* Buttons */
.ak-btn { padding: 1vh 2vw; background: #1E8449; color: white; border: none; border-radius: 0.5vw; cursor: pointer; font-size: 1.3vw; font-weight: 700; font-family: inherit; flex-shrink: 0; }
.ak-btn:hover { opacity: 0.85; }
.ak-btn.grey { background: #5e7377; }
.answer-key { display: none; margin-top: 1.5vh; padding: 1.5vh 2vw; background: #EAFAF1; border-radius: 0.8vw; border-left: 0.4vw solid #1E8449; font-size: 1.3vw; line-height: 1.9; flex-shrink: 0; }
.answer-key.show { display: block; }

/* ════════════════════════════════
   DISCUSSION
════════════════════════════════ */
.disc-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.disc-card { background: white; border-radius: 1vw; padding: 2.5vh 3vw; box-shadow: 0 4px 16px rgba(0,0,0,0.08); flex: 1; display: flex; flex-direction: column; }
.disc-topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2vh; flex-shrink: 0; }
.disc-dots { display: flex; gap: 0.8vw; }
.disc-dot { width: 1.2vw; height: 1.2vw; border-radius: 50%; background: #e6f3f2; border: 0.2vw solid #0a6e72; cursor: pointer; }
.disc-dot.active { background: #0e8388; }
.disc-dot.done { background: #1E8449; border-color: #1E8449; }
.disc-qnum { font-size: 1.4vw; color: #5e7377; font-weight: 600; }
.disc-q { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 2vw; line-height: 1.6; color: #1e2a2e; margin-bottom: 2vh; flex-shrink: 0; }
.disc-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 2vw; flex: 1; min-height: 0; }
.disc-col { display: flex; flex-direction: column; min-height: 0; }
.disc-col-label { font-size: 1.1vw; letter-spacing: 0.2vw; text-transform: uppercase; color: #5e7377; margin-bottom: 0.8vh; font-weight: 700; flex-shrink: 0; }
.disc-user-box { flex: 1; padding: 1.5vh 1.5vw; border-radius: 0.8vw; background: #e6f3f2; font-size: 1.4vw; line-height: 1.7; border: 0.2vw solid transparent; min-height: 0; overflow-y: auto; }
.disc-user-box.listening { border-color: #fb6a5a; background: #ffeae6; }
.disc-user-box .ph { color: #9bb0b2; font-style: italic; }
.disc-model-box { flex: 1; padding: 1.5vh 1.5vw; border-radius: 0.8vw; background: #EAFAF1; font-size: 1.3vw; line-height: 1.8; min-height: 0; overflow-y: auto; }
.disc-model-box.blur .mtext { filter: blur(6px); user-select: none; }
.reveal-btn { display: inline-block; margin-top: 0.8vh; padding: 0.7vh 1.8vw; background: #1E8449; color: white; border: none; border-radius: 0.5vw; font-size: 1.2vw; font-weight: 700; cursor: pointer; font-family: inherit; flex-shrink: 0; }
.mic-row { display: flex; align-items: center; gap: 1.5vw; margin-top: 1.5vh; flex-shrink: 0; }
.mic-btn { width: 5vw; height: 5vw; border-radius: 50%; border: none; background: #fb6a5a; color: white; font-size: 2.2vw; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(192,57,43,0.38); flex-shrink: 0; }
.mic-btn.on { background: #1E8449; animation: pulse 1.2s infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(30,132,73,0.5); } 50% { box-shadow: 0 0 0 1vw rgba(30,132,73,0); } }
.mic-status { font-size: 1.2vw; color: #5e7377; line-height: 1.5; }
.disc-nav { display: flex; gap: 1vw; justify-content: flex-end; margin-top: 1.5vh; flex-shrink: 0; }

ulti, appassionati o semplicemente curiosi: nella più grande esposizione di modelli Lego d'Europa c'è spazio per tutti. I limiti sono solo quelli che impone la fantasia. Le cifre parlano da sole: duemila metri quadrati colmi di modelli costruiti con i famosi mattoncini colorati.", "Sono oltre 15 milioni i pezzi utilizzati per realizzare più di 120 modelli, fra cui quattro «super-modelli». Secondo Lukas Siwiec, responsabile della mostra, si tratta di strutture composte da più di mezzo milione di pezzi Lego, che quindi hanno un'imponenza diversa dalle altre.", "È il caso della replica dell'Air Force One. Il numero esatto dei pezzi non è noto: si stima che circa un milione di mattoncini sostengano questo Boeing 747 in scala 1:7, che ha richiesto sei mesi di lavoro a una squadra di sei persone. Secondo l'organizzazione, il modello è lungo quasi 11 metri, largo 10 e alto 3.", "Nonostante sia imponente, l'aereo non è l'unica attrazione. Alla mostra, allestita alla Cordoaria Nacional, si può ammirare anche il «Rei dos Mares», un modello ispirato a una nave da crociera per il quale sono stati utilizzati oltre 700 mila pezzi. Sul posto si vedono poi il «Grande Dragão Vermelho», ispirato a un drago medievale, e uno Spinosauro costruito con 900 mila pezzi. Ma questi sono solo i modelli di dimensioni maggiori: si trovano strutture di ogni tipo, con i temi più diversi. «Abbiamo anche diverse aree tematiche, dedicate al mondo del cinema, dello sport, a Star Wars e a contenuti educativi di geografia, biologia e altre scienze», ha spiegato il responsabile.", "La mostra, che ha già toccato 11 Paesi europei, arriva ora a Lisbona per una nuova tappa; dopo il Portogallo si dovrebbe proseguire verso Madrid, Barcellona e altre grandi città spagnole. La maggior parte dei modelli esposti è stata ideata, progettata e costruita dall'organizzazione stessa. In questa mostra non ci si limita a guardare: si può anche giocare. La cosiddetta Fun Zone è divisa in tre aree ed è aperta a tutti i visitatori, di qualsiasi età, che possono dare libero sfogo alla fantasia. C'è infine la 3D Trick Gallery, uno spazio dedicato alle fotografie e alle illusioni ottiche, accessibile però solo a fronte di un costo extra. La mostra è visitabile fino al 10 gennaio."], "url": "https://it.euronews.com/2026/09/21/lisbona-ospita-la-piu-grande-mostra-europea-di-modelli-con-pezzi-lego"}, "grammar": [{"label": "Grammatica — Il «si» impersonale e il «si» passivante", "subtitle": "si può ammirare · si trovano · si stima che · ci si limita", "title": "«In questa mostra non ci si limita a guardare: si può anche giocare»", "expl": "Il piccolo «si» dell'italiano fa due lavori diversi. 1) SI IMPERSONALE: quando non si vuole dire chi fa l'azione, si usa «si» + verbo alla terza persona SINGOLARE. Vale con i verbi intransitivi e con i verbi transitivi senza oggetto: in questa mostra si gioca, a Lisbona si arriva in aereo, qui si lavora bene. Corrisponde all'inglese «one / you / people». 2) SI PASSIVANTE: quando il verbo è transitivo e ha un oggetto, quell'oggetto diventa il SOGGETTO grammaticale e il verbo concorda con lui: si ammira il modello (singolare) ma si ammirano i modelli (plurale); si trova una struttura ma si trovano strutture di ogni tipo. È la trappola principale: molti dicono «si trova strutture», ma l'italiano corretto mette il plurale. Il senso è passivo — «i modelli sono ammirati» — però l'agente non si può esprimere: non si dice «si ammirano i modelli dai visitatori». 3) CON I VERBI MODALI il concordo si fa sul verbo modale: si può ammirare il «Rei dos Mares», ma si possono ammirare tutti i modelli. 4) NEI TEMPI COMPOSTI l'ausiliare è SEMPRE essere, anche per i verbi che normalmente vogliono avere: si è lavorato molto (impersonale: participio al maschile singolare), si sono utilizzati oltre 700 mila pezzi (passivante: il participio concorda con il soggetto). 5) CON GLI AGGETTIVI e i nomi, dopo il «si» impersonale l'aggettivo va al MASCHILE PLURALE, anche se il verbo è singolare: quando si è stanchi non si costruisce bene; da bambini si è curiosi. 6) CON I VERBI RIFLESSIVI due «si» sono impossibili, e il primo diventa «ci»: ci si limita, ci si diverte, ci si annoia; nei tempi composti, ci si è divertiti. Lo stesso accade con «ne»: se ne parla molto (si + ne → se ne). Nota infine la differenza di stile: il passivo con essere o venire (sono stati utilizzati 700 mila pezzi) mette l'accento sul risultato o sull'evento; il «si» passivante è più leggero, più parlato, e in Italia è la forma normale di avvisi, istruzioni e cronaca: si prega di non toccare, si affitta, qui si parla italiano.", "examples": [["si può ammirare il «Rei dos Mares»", " — modale al singolare perché l'oggetto è singolare; con il plurale: si possono ammirare i modelli"], ["si trovano strutture di ogni tipo", " — si passivante: il verbo concorda con «strutture», non con un soggetto invisibile"], ["si stima che circa un milione di mattoncini sostengano la struttura", " — si passivante di un verbo di opinione; la frase che segue va al congiuntivo"], ["non ci si limita a guardare", " — verbo riflessivo (limitarsi): si + si è impossibile, quindi il primo diventa ci"], ["si è lavorato sei mesi · si sono utilizzati 700 mila pezzi", " — tempi composti: sempre essere; il participio concorda solo nel si passivante"]], "snote": "Regola pratica: prima cerca l'oggetto. Se c'è, è lui il soggetto e comanda il verbo (si vende la casa / si vendono le case). Se non c'è, il verbo resta al singolare (si dorme, si parte). Tempi composti → sempre essere. Aggettivo dopo si impersonale → maschile plurale (si è contenti). Verbo riflessivo → ci si."}], "comprehension": [{"label": "Comprensione", "h2": "Comprensione", "sub": "1–3: fatti dal servizio · 4–6: domande aperte", "compLabel": "📺 Fatti (1–3)  ·  💭 Domande aperte (4–6)", "questions": [["1.", "Quanto è grande la mostra di Lisbona: quanti metri quadrati, quanti pezzi e quanti modelli?", "Duemila metri quadrati, oltre 15 milioni di mattoncini e più di 120 modelli, fra cui quattro «super-modelli» composti da più di mezzo milione di pezzi ciascuno."], ["2.", "Che cosa sappiamo della replica dell'Air Force One?", "È un Boeing 747 in scala 1:7. Il numero esatto dei pezzi non è noto: si stima circa un milione di mattoncini. È lungo quasi 11 metri, largo 10 e alto 3, e sono serviti sei mesi di lavoro a una squadra di sei persone."], ["3.", "Che cosa si può fare nella Fun Zone, e che cosa si paga a parte?", "Nella Fun Zone, divisa in tre aree e aperta ai visitatori di ogni età, non ci si limita a guardare: si possono costruire le proprie creazioni. La 3D Trick Gallery, con fotografie e illusioni ottiche, è invece accessibile solo a fronte di un costo extra."], ["4.", "Il responsabile dice che i «super-modelli» hanno «un'imponenza diversa dalle altre» strutture. Perché, secondo te, una mostra del genere punta così tanto sui numeri e sulle dimensioni?", "Perché i numeri sono immediati: quindici milioni di pezzi o un milione di mattoncini si capiscono subito, mentre la qualità di un modello va guardata da vicino. Le cifre servono anche a giustificare il biglietto e a trasformare un gioco per bambini in un'impresa da adulti: sei mesi di lavoro, una squadra di sei persone, undici metri di aereo. C'è però un rischio: se conta solo la grandezza, i modelli piccoli e più curati passano in secondo piano."], ["5.", "«Non ci si limita a guardare: si può anche giocare.» Secondo te una mostra dove si tocca e si costruisce è più utile di una mostra tradizionale, o si perde qualcosa?", "Credo che dipenda dal pubblico. Per i bambini la parte interattiva è quasi tutto: si impara costruendo, e un museo dove non si tocca niente si dimentica in fretta. Per gli adulti, invece, il piacere è anche il silenzio e il tempo per guardare i dettagli, e in una sala dove si gioca questo si perde. La soluzione migliore mi sembra quella di Lisbona: si separano gli spazi, così ognuno trova quello che cerca."], ["6.", "Una mostra commerciale di modelli Lego viene allestita in un edificio storico come la Cordoaria Nacional. Ti sembra un buon uso del patrimonio, o no?", "A me sembra un buon uso, a certe condizioni. Un edificio storico vuoto si degrada, mentre con una mostra del genere entra gente che altrimenti non ci metterebbe piede, e i biglietti aiutano a mantenerlo. A Budapest si sono recuperati così vecchi magazzini e fabbriche. La condizione è che l'edificio non venga danneggiato e che non diventi soltanto un capannone: se si spiega anche che cos'era la Cordoaria, il visitatore porta a casa due cose invece di una."]]}], "gapfill": {"heading": "Completa le frasi in base al servizio!", "words": ["mattoncini", "modelli", "scala", "tappa", "visitabile"], "sents": [{"pre": "1.  La mostra è stata realizzata con oltre 15 milioni di", "blank": "mattoncini", "post": "colorati."}, {"pre": "2.  In duemila metri quadrati si possono vedere più di 120", "blank": "modelli", "post": "."}, {"pre": "3.  La replica dell'Air Force One è un Boeing 747 in", "blank": "scala", "post": "1:7."}, {"pre": "4.  Dopo undici Paesi europei, Lisbona è una nuova", "blank": "tappa", "post": "della mostra."}, {"pre": "5.  L'esposizione è", "blank": "visitabile", "post": "fino al 10 gennaio."}], "answers": [["1.", "mattoncini", "oltre 15 milioni di pezzi danno vita a questa mostra"], ["2.", "modelli", "sono oltre 120 i modelli esposti, fra cui quattro super-modelli"], ["3.", "scala", "un Boeing 747 in scala 1:7, lungo quasi 11 metri"], ["4.", "tappa", "la mostra ha già toccato 11 Paesi europei e arriva ora a Lisbona"], ["5.", "visitabile", "la mostra è visitabile fino al 10 gennaio"]]}, "verofalso": {"items": [{"s": "L'esposizione occupa duemila metri quadrati.", "a": "V", "note": ""}, {"s": "Per costruire la replica dell'Air Force One è bastato un mese di lavoro.", "a": "F", "note": "Ci sono voluti sei mesi e una squadra di sei persone."}, {"s": "Lo Spinosauro è stato costruito con 900 mila pezzi.", "a": "V", "note": ""}, {"s": "Nella Fun Zone i visitatori possono costruire da soli.", "a": "V", "note": ""}, {"s": "L'ingresso alla 3D Trick Gallery è compreso nel biglietto della mostra.", "a": "F", "note": "È accessibile solo a fronte di un costo extra."}, {"s": "A Lisbona la mostra ha già superato i centomila visitatori.", "a": "N", "note": "Il servizio non dice quante persone l'abbiano visitata."}], "key_html": "<b>1.</b> Vero &nbsp; <b>2.</b> Falso (sei mesi) &nbsp; <b>3.</b> Vero &nbsp; <b>4.</b> Vero &nbsp; <b>5.</b> Falso (costo extra) &nbsp; <b>6.</b> Non detto"}, "discussion": [{"q": "Racconta una mostra o un museo che hai visitato e che ti è piaciuto davvero: che cosa si vedeva, che cosa si poteva fare e perché te lo ricordi ancora? Usa almeno tre volte il «si».", "m": "Qualche anno fa sono stato al Museo delle Arti Applicate di Budapest, poco prima che chiudesse per i lavori. Si entrava in un palazzo pieno di ceramiche colorate e già dall'ingresso si capiva che l'edificio stesso era il pezzo più bello della collezione. Dentro si potevano vedere mobili, tessuti e oggetti di uso quotidiano, e in una sala si spiegava come venivano fabbricati. Non ci si limitava a guardare: in alcune vetrine si potevano toccare i materiali. Me lo ricordo ancora perché per la prima volta ho pensato che anche una sedia può essere un'opera d'arte."}, {"q": "Quindici milioni di mattoncini per una mostra: secondo te giochi come i Lego sono soltanto un prodotto commerciale molto ben venduto, o hanno un valore educativo vero?", "m": "Secondo me le due cose stanno insieme, e non c'è niente di male. È chiaro che si tratta di un prodotto: i set costano cari, escono in continuazione e si costruiscono seguendo istruzioni scritte da qualcun altro. Però quando si finisce il modello e si smonta tutto, comincia la parte interessante, perché si inventa qualcosa di proprio. Si impara la pazienza, la geometria, l'ordine. Da traduttore direi che somiglia al mio lavoro: si parte da pezzi già dati e il risultato dipende da come li si mette insieme."}, {"q": "Il video dice che dopo Lisbona la mostra dovrebbe andare a Madrid o a Barcellona. Che cosa cambia, per una città, quando arriva una grande mostra itinerante? Pensa anche alla tua città.", "m": "Cambia soprattutto il pubblico. Una mostra itinerante porta gente che normalmente non va nei musei: famiglie, gruppi scolastici, turisti di passaggio. Per i negozi e i bar della zona è un guadagno immediato, e per la città è pubblicità. Però resta poco: quando la mostra riparte, non rimane una collezione, rimane solo il ricordo. A Budapest si vedono spesso mostre di questo tipo nei vecchi capannoni, e secondo me funzionano se si collegano a qualcosa di locale — un laboratorio per le scuole, per esempio. Altrimenti si paga il biglietto, si fanno le fotografie e si dimentica tutto in una settimana."}], "homework": [{"label": "Compiti — Scrittura", "bgCls": "red", "blockCls": "red-b", "h3color": "#E24E3E", "h3text": "✍ Una mostra o una collezione (80–100 parole)", "bodyHTML": "Presenta una mostra, un museo o una collezione (anche la tua!) come se scrivessi la pagina informativa per i visitatori.<br><br><b>Domande guida:</b> Dove si trova e quando è visitabile? Che cosa si può vedere? Che cosa non si può fare? Che cosa si paga a parte? Quanto tempo ci vuole per visitarla?<br><br>Usa almeno <b>cinque parole</b> della lezione (per esempio: <i>allestire, la tappa, visitabile, colmo di, dare libero sfogo alla fantasia</i>) e almeno <b>quattro costruzioni con il «si»</b>: una impersonale (<i>si entra, si arriva</i>), una passivante al singolare (<i>si vede il modello</i>), una passivante al plurale (<i>si vedono i modelli</i>) e una con un verbo riflessivo (<i>ci si diverte, non ci si limita a…</i>). Attenzione all'accordo!", "chips": ["80–100 parole", "5 parole nuove", "si impersonale / si passivante"]}], "grammar_practice": [{"title": "Impersonale o passivante?", "instr": "Per ogni frase indica se il «si» è IMPERSONALE (nessun oggetto: il verbo resta al singolare) o PASSIVANTE (c'è un oggetto che diventa soggetto e comanda l'accordo).", "items": ["1.  Alla Cordoaria Nacional si ammirano più di 120 modelli.", "2.  In questa mostra si gioca anche.", "3.  Si stima che i pezzi siano circa un milione.", "4.  Con i Lego si costruiscono navi, aerei e dinosauri.", "5.  Alla mostra si arriva facilmente con i mezzi pubblici.", "6.  Per la 3D Trick Gallery si paga un costo extra.", "7.  Quando si è stanchi, non si costruisce bene.", "8.  Nella Fun Zone si possono creare le proprie costruzioni."], "answers": ["1.  PASSIVANTE — l'oggetto «più di 120 modelli» è il soggetto: verbo al plurale (si ammirano).", "2.  IMPERSONALE — giocare è intransitivo: terza persona singolare, sempre.", "3.  PASSIVANTE — «si stima» + che: il verbo resta singolare perché il soggetto è tutta la frase che segue (e va al congiuntivo).", "4.  PASSIVANTE — soggetto plurale (navi, aerei e dinosauri) → si costruiscono.", "5.  IMPERSONALE — arrivare è intransitivo; «alla mostra» è un complemento, non un oggetto.", "6.  PASSIVANTE — l'oggetto «un costo extra» è singolare, quindi si paga; con i prezzi: si pagano dieci euro.", "7.  IMPERSONALE — attenzione all'aggettivo: dopo il si impersonale va al maschile plurale (stanchi), anche se il verbo è singolare.", "8.  PASSIVANTE con modale — l'accordo si fa sul modale: si possono creare (soggetto plurale)."]}, {"title": "Singolare o plurale?", "instr": "Cerchia la forma corretta. Ricorda: nel si passivante comanda l'oggetto, e con i verbi modali l'accordo si fa sul modale.", "items": ["1.  In duemila metri quadrati (si vede / si vedono) più di 120 modelli.", "2.  All'ingresso (si compra / si comprano) il biglietto.", "3.  Per costruire l'aereo (si è usato / si sono usati) circa un milione di mattoncini.", "4.  Nella Fun Zone (si può / si possono) costruire le proprie creazioni.", "5.  In questa sala (si può / si possono) ammirare lo Spinosauro.", "6.  Dopo Lisbona (si visiterà / si visiteranno) altre grandi città spagnole.", "7.  Alla mostra (si entra / si entrano) anche con i bambini piccoli.", "8.  Per i super-modelli (si è impiegato / si sono impiegati) sei mesi di lavoro."], "answers": ["1.  si vedono — soggetto plurale (più di 120 modelli).", "2.  si compra — soggetto singolare (il biglietto).", "3.  si sono usati — tempo composto: ausiliare essere e participio concordato con «mattoncini».", "4.  si possono — l'accordo va sul modale, e il soggetto (le proprie creazioni) è plurale.", "5.  si può — soggetto singolare (lo Spinosauro).", "6.  si visiteranno — futuro, soggetto plurale (altre grandi città).", "7.  si entra — entrare è intransitivo: si impersonale, sempre singolare.", "8.  si sono impiegati — soggetto plurale (sei mesi); con essere il participio concorda."]}, {"title": "Riscrivi con il «si»", "instr": "Trasforma la frase usando il «si» impersonale o passivante. Non cambiare il tempo verbale e attenzione ai verbi riflessivi (si + si → ci si).", "items": ["1.  Alla mostra i visitatori ammirano modelli di ogni tipo.  →  Alla mostra ______ modelli di ogni tipo.", "2.  In questa mostra la gente non si limita a guardare.  →  In questa mostra non ______ a guardare.", "3.  L'organizzazione ha progettato quasi tutti i modelli.  →  Quasi tutti i modelli ______ dall'organizzazione stessa. (passivo con essere)", "4.  I visitatori si divertono molto nella Fun Zone.  →  Nella Fun Zone ______ molto.", "5.  Per la 3D Trick Gallery il pubblico paga un supplemento.  →  Per la 3D Trick Gallery ______ un supplemento.", "6.  Ieri i bambini si sono annoiati poco.  →  Ieri ______ poco."], "answers": ["1.  si ammirano — passivante, soggetto plurale.", "2.  ci si limita — limitarsi è riflessivo: il primo si diventa ci.", "3.  sono stati progettati — qui l'agente è espresso (dall'organizzazione), quindi il si passivante non è possibile: serve il passivo con essere.", "4.  ci si diverte — divertirsi, riflessivo → ci si.", "5.  si paga — soggetto singolare (un supplemento).", "6.  ci si è annoiati — riflessivo al passato: ausiliare essere e participio al maschile plurale."]}]};

function makeSlide(label, cls) {
  const div = document.createElement('div');

  vp.appendChild(div);
  SLIDES.push({ label, el: div });
  if (cls !== 'title-slide' && cls !== 'sep-slide') {
    const bs = document.createElement('div'); bs.className = 'brand-strip';
    const n = document.createElement('span'); n.className = 'bs-name'; n.textContent = 'Goodman';
    const l = document.createElement('span'); l.className = 'bs-lang'; l.textContent = UI.brandLang;
    bs.appendChild(n); bs.appendChild(l); div.appendChild(bs);

}

function ap(parent, ...children) { children.forEach(c => parent.appendChild(c)); return parent; }

// ── BUILD (B1 shape: warm-up → vocab → video → reading → grammar → comprehension → exercises → discussion → homework)
function build() {
  const D = SPEC.dividers || {};
  makeTitle(SPEC.title_slide || {});

  makeDivider(D.warmup);
  makeQuestionsSlide(UI.warmupLabel, UI.warmupH2, UI.warmupSub, UI.warmupBox, SPEC.warmup.questions);
  if (SPEC.warmup.episode) makeProseSlide('Riscaldamento — Di cosa parla?', SPEC.warmup.episode.h2, SPEC.warmup.episode.sub, SPEC.warmup.episode.body);
  if (SPEC.figures) makeFiguresSlide(SPEC.figures);

  makeDivider(D.vocab);
  const per = 2; // rule: 8 cards per slide (2 groups × 4)
  for (let i = 0; i < VOCAB.length; i += per) {
    makeVocabSlide('Parole chiave — ' + (Math.floor(i/per) + 1) + '/' + Math.ceil(VOCAB.length/per), VOCAB.slice(i, i + per));
  }

  if (SPEC.video && SPEC.video.parts && SPEC.video.parts.length) {
    makeDivider(D.video);
    const vid = ytId(SPEC.video.url || SPEC.video.video_id);
    SPEC.video.parts.forEach((p, i) => makeVideoPartSlide(p, i, SPEC.video.parts.length, vid));
  }

  if (SPEC.reading) { makeDivider(D.reading); makeReadingSlide(SPEC.reading); }

  if (SPEC.grammar && SPEC.grammar.length) { makeDivider(D.grammar); SPEC.grammar.forEach(makeGramSlide); }

  makeDivider(D.comprehension);
  (SPEC.comprehension || []).forEach(makeCompSlide);

  makeDivider(D.exercises);
  if (SPEC.gapfill) { makeGapSlide(SPEC.gapfill); makeGapAnswerSlide(SPEC.gapfill); }
  if (SPEC.match) makeMatchSlide(SPEC.match);
  if (SPEC.verofalso) makeVFSlide(SPEC.verofalso);

  makeDivider(D.discussion);
  makeDiscSlide();

  if (SPEC.homework && SPEC.homework.length) { makeDivider(D.homework); SPEC.homework.forEach(makeHWSlide); }
}
build();

const TOTAL = SLIDES.length; let cur = 0;
SLIDES[0].el.classList.add('active');
const DISC_IDX = SLIDES.findIndex(s => s.el.classList.contains('disc-slide'));
function go(d) {
  SLIDES[cur].el.classList.remove('active');
  cur = Math.max(0, Math.min(TOTAL - 1, cur + d));
  SLIDES[cur].el.classList.add('active'); SLIDES[cur].el.scrollTop = 0; updateNav();
  if (cur === DISC_IDX) initMicPermission();
}
function updateNav() {
  document.getElementById('slide-label').textContent = (cur+1) + ' / ' + TOTAL + ' — ' + SLIDES[cur].label;
  document.getElementById('pb').style.width = ((cur+1)/TOTAL*100) + '%';
  document.getElementById('btn-prev').disabled = cur === 0;
  document.getElementById('btn-next').disabled = cur === TOTAL-1;
}
updateNav();
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(1);
  if (e.key === 'ArrowLeft') go(-1);
  if ((e.key==='r'||e.key==='R') && cur===DISC_IDX) toggleMic();
});

// ── GAP FILL ─────────────────────────────────────────────────────
let selWord = null;
function wireGap() {
  const wb = document.getElementById('wb'); const gs = document.getElementById('gap-sents'); if (!wb || !gs) return;
  [...GAP_WORDS].sort(()=>Math.random()-0.5).forEach(w => {
    const d = el('div','dword', w); d.dataset.w = w;
    d.onclick = () => { if (d.classList.contains('used')) return; document.querySelectorAll('.dword').forEach(x=>x.classList.remove('sel-w')); d.classList.add('sel-w'); selWord = w; };
    wb.appendChild(d);
  });
  GAP_SENTS.forEach(s => { const d = el('div','gap-sentence'); d.innerHTML = s.pre + ' <span class="drop-zone" data-blank="'+s.blank+'" onclick="fillZone(this)">_ _ _ _ _</span> ' + s.post; gs.appendChild(d); });
}
function fillZone(z) {
  if (!selWord || z.classList.contains('ok')) return;
  document.querySelectorAll('.drop-zone').forEach(oz=>{ if(oz!==z && oz.dataset.filled===selWord){oz.textContent='_ _ _ _ _';oz.classList.remove('filled','ok','wrong');oz.dataset.filled='';} });
  z.textContent = selWord; z.classList.add('filled'); z.dataset.filled = selWord;
  document.querySelectorAll('.dword').forEach(d=>d.classList.remove('sel-w')); selWord = null;
}
function checkGap() { document.querySelectorAll('.drop-zone').forEach(z=>{ z.classList.remove('ok','wrong'); if(z.dataset.filled===z.dataset.blank) z.classList.add('ok'); else if(z.dataset.filled) z.classList.add('wrong'); }); }
function resetGap() { document.querySelectorAll('.drop-zone').forEach(z=>{z.textContent='_ _ _ _ _';z.classList.remove('filled','ok','wrong');z.dataset.filled='';}); document.querySelectorAll('.dword').forEach(d=>d.classList.remove('used','sel-w')); selWord = null; }

// ── MATCHING ─────────────────────────────────────────────────────
let selTerm = null;
function wireMatch() {
  const tc = document.getElementById('mterms'), dc = document.getElementById('mdefs'); if (!tc || !dc) return;
  const shuffled = [...MATCH].sort(()=>Math.random()-0.5);
  MATCH.forEach((m,i)=>{ const e2 = el('div','mitem', m.t); e2.dataset.pair = i; e2.dataset.side='t';
    e2.onclick = () => { if (e2.classList.contains('matched')) return; document.querySelectorAll('.mitem[data-side="t"]').forEach(x=>x.classList.remove('sel')); e2.classList.add('sel'); selTerm = e2; };
    tc.appendChild(e2); });
  shuffled.forEach(m=>{ const oi = MATCH.findIndex(x=>x.d===m.d); const e2 = el('div','mitem', m.d); e2.dataset.pair = oi; e2.dataset.side='d';
    e2.onclick = () => { if (!selTerm || e2.classList.contains('matched')) return;
      if (selTerm.dataset.pair === e2.dataset.pair) { selTerm.classList.remove('sel'); selTerm.classList.add('matched'); e2.classList.add('matched'); selTerm = null; }
      else { e2.classList.add('bad'); setTimeout(()=>e2.classList.remove('bad'),500); const st = selTerm; selTerm = null; st.classList.add('bad'); setTimeout(()=>st.classList.remove('bad','sel'),500); } };
    dc.appendChild(e2); });
}

// ── VERO / FALSO / NON DETTO ──────────────────────────────────
function wireVF() {
  const root = document.getElementById('vf-root'); if (!root) return;
  VF.forEach((item,i)=>{
    const row = el('div','vf-row'); const btns = el('div','vf-btns');
    UI.vfBtns.forEach(([cls,val])=>{ const b = el('button','vfb '+cls, val); b.onclick = () => checkVF(b, cls, item.a, i); btns.appendChild(b); });
    const body = document.createElement('div'); body.style.flex='1';
    body.appendChild(el('div','', String(i+1)+'. '+item.s));
    if (item.note) { const n = el('div','vf-note','→ '+item.note); n.id='vfn'+i; body.appendChild(n); }
    ap(row, btns, body); root.appendChild(row);
  });
}
function checkVF(btn, chosen, correct, idx) {
  btn.closest('.vf-row').querySelectorAll('.vfb').forEach(b=>b.classList.remove('correct','incorrect'));
  if (chosen===correct) btn.classList.add('correct');
  else { btn.classList.add('incorrect'); const n=document.getElementById('vfn'+idx); if(n) n.classList.add('show'); }
}

// ── DISCUSSION + MIC ─────────────────────────────────────────────
let dIdx=0, recog=null, recording=false, micOK=false, micStream=null;
function wireDisc() {
  const dots = document.getElementById('ddots'); if (!dots) return;
  DISC.forEach((_,i)=>{ const d = el('div','disc-dot'+(i===0?' active':'')); d.onclick = () => gotoDisc(i); dots.appendChild(d); });
  loadDisc();
}
function loadDisc() {
  const dq = document.getElementById('dq'); if (!dq) return;
  dq.textContent = DISC[dIdx].q;
  document.getElementById('dqnum').textContent = (dIdx+1) + '. ' + UI.question + UI.ofN + DISC.length;
  document.getElementById('dmtext').textContent = DISC[dIdx].m;
  document.getElementById('dmbox').classList.add('blur');
  if (!recording) { const ub = document.getElementById('dubox'); ub.innerHTML=''; ub.appendChild(el('span','ph', UI.micPh)); ub.classList.remove('listening'); }
  document.querySelectorAll('.disc-dot').forEach((d,i)=>d.classList.toggle('active', i===dIdx));
  const pb = document.getElementById('dprev'), nb = document.getElementById('dnext');
  if (pb) pb.disabled = dIdx === 0;
  if (nb) { const last = dIdx >= DISC.length - 1; nb.textContent = last ? UI.nextSlide : UI.next; nb.classList.toggle('to-slide', last); }
}
function dNav(d) { document.querySelectorAll('.disc-dot')[dIdx].classList.add('done'); dIdx = Math.max(0, Math.min(DISC.length-1, dIdx+d)); loadDisc(); }
function gotoDisc(i){ dIdx=i; loadDisc(); }
function revealModel(){ document.getElementById('dmbox').classList.toggle('blur'); }
function initMicPermission() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { const w=document.getElementById('swarn'); if(w) w.style.display='block'; return; }
  if (micOK && micStream && micStream.active) return;
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(stream => { micStream = stream; micOK = true; const st = document.getElementById('micstat'); if (st) st.textContent = UI.micReady; })
      .catch(e => { if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) { const w=document.getElementById('swarn'); if(w) w.style.display='block'; } });
  }
}
function toggleMic(){ recording ? stopMic() : startMic(); }
function startMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) return;
  recog = new SR(); recog.lang='it-IT'; recog.continuous=true; recog.interimResults=true;
  const box = document.getElementById('dubox'); box.innerHTML=''; box.classList.add('listening');
  let final='';
  recog.onresult = e => { let interim=''; for (let i=e.resultIndex; i<e.results.length; i++) { if (e.results[i].isFinal) final += e.results[i][0].transcript + ' '; else interim += e.results[i][0].transcript; } box.textContent = final + interim; micOK = true; };
  recog.onerror = e => { if (e.error!=='no-speech') stopMic(); };
  recog.onend = () => { if (recording) recog.start(); };
  recog.start(); recording = true;
  document.getElementById('micbtn').classList.add('on'); document.getElementById('micbtn').textContent = '⏹';
  document.getElementById('micstat').textContent = UI.micRec;
}
function stopMic() {
  if (recog) { recog.stop(); recog=null; } recording=false;
  document.getElementById('micbtn').classList.remove('on'); document.getElementById('micbtn').textContent = '🎤';
  document.getElementById('micstat').textContent = UI.micPause; document.getElementById('dubox').classList.remove('listening');
}
function toggleAK(id){ document.getElementById(id).classList.toggle('show'); }

wireGap(); wireMatch(); wireVF(); wireDisc();

// ── Text-size control ────────────────────────────────────────────
(function(){
  let z = 100;
  const bar = document.createElement('div'); bar.id='tsize';
  bar.innerHTML = '<span>' + UI.tsize + '</span><button id="tsm">A−</button><span id="tsv">100%</span><button id="tsp">A+</button><button id="tsr">⟲</button>';
  const _tb=document.getElementById('topbar'), _nb=document.getElementById('nav-btns');
  if(_tb && _nb) _tb.insertBefore(bar, _nb); else document.body.appendChild(bar);
  function apply(){ document.getElementById('viewport').style.zoom = (z/100); document.getElementById('tsv').textContent = z+'%'; }
  document.getElementById('tsm').onclick = ()=>{ z=Math.max(70,z-10); apply(); };
  document.getElementById('tsp').onclick = ()=>{ z=Math.min(220,z+10); apply(); };
  document.getElementById('tsr').onclick = ()=>{ z=100; apply(); };
})();
</script>
