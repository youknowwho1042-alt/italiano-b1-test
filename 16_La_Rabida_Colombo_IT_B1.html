<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Rábida: il monastero dove Colombo trovò i suoi alleati — Goodman Italiano B1</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: Calibri, 'Segoe UI', sans-serif;
  background: #0e8388;
  color: #1e2a2e;
}

/* ── TOP BAR ── */
#pb-wrap { position: fixed; top: 0; left: 0; right: 0; height: 5px; background: rgba(255,255,255,0.2); z-index: 200; }
#pb { height: 5px; background: #fb6a5a; transition: width 0.3s; width: 0%; }

#topbar {
  position: fixed; top: 5px; left: 0; right: 0; height: 50px;
  background: #0e8388; z-index: 199;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2vw;
  border-bottom: 1px solid rgba(255,255,255,0.18);
}
#slide-label { color: white; font-size: 1.5vw; font-weight: 700; }
#nav-btns { display: flex; gap: 1vw; }
.nbtn {
  background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.3);
  color: white; padding: 0.4vh 1.5vw; border-radius: 5px;
  cursor: pointer; font-size: 1.3vw; font-family: inherit; font-weight: 600;
}
.nbtn:hover { background: rgba(255,255,255,0.28); }
.nbtn:disabled { opacity: 0.3; cursor: default; }

/* ── VIEWPORT ── */
#viewport {
  position: fixed;
  top: 55px; left: 0; right: 0; bottom: 0;
}

/* ── SLIDES ── */
.slide {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease;
  overflow: hidden;
}
.slide.active { opacity: 1; pointer-events: all; }

/* ════════════════════════════════
   DIVIDER SLIDES
════════════════════════════════ */
.div-slide {
  background: linear-gradient(160deg, #073c40 0%, #0e8388 60%, #0a5458 100%);
  color: white;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  padding: 3vh 6vw;
  position: relative;
}
.div-slide::after {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0;
  height: 0.8vh; background: #fb6a5a;
}
.div-icon { font-size: 7vw; line-height: 1; margin-bottom: 2vh; }
.div-num { font-size: 1.2vw; letter-spacing: 0.4vw; text-transform: uppercase; opacity: 0.5; margin-bottom: 1.5vh; font-weight: 700; }
.div-slide h2 { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 5.5vw; line-height: 1.1; margin-bottom: 2.5vh; }
.div-desc { font-size: 1.7vw; opacity: 0.78; max-width: 70vw; line-height: 1.6; margin-bottom: 3.5vh; }
.div-tags { display: flex; flex-wrap: wrap; gap: 1vw; justify-content: center; max-width: 75vw; }
.div-tag {
  background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.28);
  border-radius: 3vw; padding: 0.8vh 2vw; font-size: 1.3vw;
}

/* ════════════════════════════════
   TITLE SLIDE
════════════════════════════════ */
.title-slide {
  background: linear-gradient(150deg, #052b2e 0%, #0e8388 100%);
  color: white;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  padding: 3vh 4vw;
}
.pod-label { font-size: 1.5vw; letter-spacing: 0.4vw; text-transform: uppercase; color: #fb6a5a; margin-bottom: 3vh; font-weight: 700; }
.title-slide h1 { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 6.5vw; line-height: 1.15; width: 90vw; margin-bottom: 3.5vh; }
.red-line { width: 6vw; height: 0.6vh; background: #fb6a5a; margin: 0 auto 3vh; }
.title-meta { display: flex; gap: 4vw; font-size: 1.8vw; opacity: 0.65; flex-wrap: wrap; justify-content: center; }

/* ════════════════════════════════
   CONTENT SLIDE BASE
════════════════════════════════ */
.con-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.slide-head {
  border-left: 0.5vw solid #fb6a5a;
  padding-left: 1.5vw;
  margin-bottom: 2.5vh;
  flex-shrink: 0;
}
.slide-head h2 { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; color: #0e8388; font-size: 3.2vw; line-height: 1.15; margin-bottom: 0.4vh; }
.sub { color: #5e7377; font-size: 1.3vw; }

/* ════════════════════════════════
   ANTICIPAZIONE — split slides
════════════════════════════════ */
.single-box {
  flex: 1;
  background: #e6f3f2;
  border-radius: 1vw;
  padding: 3vh 3vw;
  border-top: 0.5vh solid #0e8388;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.single-box h3 { color: #0e8388; font-size: 2.2vw; margin-bottom: 2.5vh; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; }
.single-box ol { padding-left: 2.5vw; flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
.single-box ol li { font-size: 2vw; line-height: 1.6; }
.single-box p { font-size: 2vw; line-height: 1.75; flex: 1; display: flex; align-items: center; }

/* ════════════════════════════════
   FIGURE CHIAVE
════════════════════════════════ */
.figures-slide {
  background: #ffeae6;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.figures-slide .slide-head { border-color: #fb6a5a; }
.figures-slide .slide-head h2 { color: #e24e3e; }
.figures-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr 1fr;
  gap: 1.5vh 2vw;
  flex: 1;
}
.figure-card {
  background: white; border-radius: 0.8vw;
  border-left: 0.5vw solid #fb6a5a;
  padding: 1.5vh 2vw;
  display: flex; flex-direction: column; justify-content: center;
}
.figure-card .fname { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 1.9vw; font-weight: 700; color: #0e8388; margin-bottom: 0.8vh; }
.figure-card .fdesc { font-size: 1.35vw; color: #3a4a4e; line-height: 1.5; }

/* ════════════════════════════════
   VOCABULARY
════════════════════════════════ */
.vocab-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 2vh 4vw 2vh;
  overflow: hidden;
}
.vocab-group-label {
  font-size: 1.1vw; letter-spacing: 0.2vw; text-transform: uppercase;
  color: #5e7377; font-weight: 700; margin: 1.2vh 0 1vh;
  padding-bottom: 0.6vh; border-bottom: 2px solid #d7e6e4;
  flex-shrink: 0;
}
.vocab-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 1.2vh 2vw; flex: 1;
}
.vcard {
  background: white; border-radius: 0.8vw;
  box-shadow: 0 3px 12px rgba(0,0,0,0.09);
  cursor: pointer; perspective: 900px;
}
.vcard-inner {
  width: 100%; height: 100%; position: relative;
  transform-style: preserve-3d; transition: transform 0.45s;
}
.vcard.flipped .vcard-inner { transform: rotateY(180deg); }
.vfront, .vback {
  position: absolute; width: 100%; height: 100%;
  border-radius: 0.8vw; padding: 1.8vh 1.8vw;
  backface-visibility: hidden;
  display: flex; flex-direction: column; justify-content: space-between;
}
.vfront { background: white; }
.vfront .term { font-size: 2vw; font-weight: 700; color: #1e2a2e; line-height: 1.3; flex: 1; display: flex; align-items: center; }
.vfront .vbottom { display: flex; flex-direction: column; gap: 0.6vh; flex-shrink: 0; }
.vfront .rtag { display: inline-block; font-size: 1vw; padding: 0.3vh 0.8vw; border-radius: 2vw; background: #e6f3f2; color: #0e8388; font-weight: 600; align-self: flex-start; }
.vfront .hint { font-size: 1.1vw; color: #9bb0b2; }
.vback { background: #e6f3f2; transform: rotateY(180deg); }
.vback .en { font-size: 1.8vw; font-weight: 700; color: #0e8388; margin-bottom: 1vh; }
.vback .ex { font-size: 1.2vw; font-style: italic; color: #1e2a2e; border-left: 0.3vw solid #fb6a5a; padding-left: 0.8vw; line-height: 1.55; flex: 1; }
.vback .rnote { font-size: 0.95vw; color: #5e7377; margin-top: 0.8vh; flex-shrink: 0; }

/* ════════════════════════════════
   GRAMMAR
════════════════════════════════ */
.gram-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.gram-block {
  background: white; border-radius: 1vw;
  padding: 3vh 3vw;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  border-left: 0.6vw solid #0a6e72;
  flex: 1; display: flex; flex-direction: column;
}
.gram-block h3 { color: #0e8388; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 2.5vw; margin-bottom: 1.5vh; line-height: 1.2; }
.gram-block .expl { font-size: 1.55vw; color: #3a4a4e; line-height: 1.7; margin-bottom: 2vh; flex-shrink: 0; }
.gram-block ul { list-style: none; padding: 0; flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
.gram-block ul li { background: #e6f3f2; border-radius: 0.6vw; padding: 1.5vh 1.5vw; font-size: 1.45vw; font-style: italic; line-height: 1.6; }
.gram-block ul li strong { font-style: normal; color: #fb6a5a; font-size: 1.5vw; }
.gram-block .snote { font-size: 1.35vw; color: #1E8449; font-weight: 600; margin-top: 2vh; line-height: 1.55; padding: 1.5vh 1.5vw; background: #EAFAF1; border-radius: 0.6vw; flex-shrink: 0; }

/* ════════════════════════════════
   COMPREHENSION
════════════════════════════════ */
.comp-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.comp-label { font-size: 1.2vw; letter-spacing: 0.2vw; text-transform: uppercase; color: #5e7377; margin-bottom: 2vh; font-weight: 700; padding-bottom: 1vh; border-bottom: 2px solid #d7e6e4; flex-shrink: 0; }
.qlist { flex: 1; display: flex; flex-direction: column; gap: 1.5vh; }
.qitem { background: white; border-radius: 0.8vw; padding: 2vh 2.5vw; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; gap: 1.5vw; font-size: 1.8vw; line-height: 1.65; flex: 1; align-items: center; }
.qnum { color: #fb6a5a; font-weight: 700; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 2.2vw; min-width: 2.5vw; flex-shrink: 0; }

/* ════════════════════════════════
   CULTURAL
════════════════════════════════ */
.cult-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.cult-block {
  background: white; border-radius: 1vw;
  padding: 3vh 3vw;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  border-left: 0.6vw solid #fb6a5a;
  flex: 1; display: flex; flex-direction: column;
}
.cult-block h3 { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; color: #0e8388; font-size: 2.4vw; margin-bottom: 2vh; line-height: 1.2; flex-shrink: 0; }
.cult-block p { font-size: 1.6vw; line-height: 1.8; flex: 1; }
.en-gl { font-style: italic; color: #5e7377; font-size: 1.2vw; margin-top: 1.5vh; display: block; flex-shrink: 0; }
.cult-hook { margin-top: 2.5vh; padding: 1.5vh 2vw; background: #fff1ef; border-radius: 0.6vw; font-size: 1.45vw; color: #e24e3e; line-height: 1.6; flex-shrink: 0; }

/* ════════════════════════════════
   EXERCISES
════════════════════════════════ */
.ex-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.ex-block {
  background: white; border-radius: 1vw;
  padding: 2.5vh 3vw;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  flex: 1; display: flex; flex-direction: column;
}
.ex-block h3 { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; color: #0e8388; font-size: 2.2vw; margin-bottom: 0.8vh; flex-shrink: 0; }
.ex-instr { font-size: 1.3vw; color: #5e7377; margin-bottom: 1.8vh; line-height: 1.6; flex-shrink: 0; }

/* Gap fill */
.word-bank { display: flex; flex-wrap: wrap; gap: 1vw; margin-bottom: 2vh; padding: 1.5vh 1.5vw; background: #e6f3f2; border-radius: 0.8vw; flex-shrink: 0; }
.dword { background: #0e8388; color: white; padding: 0.8vh 2vw; border-radius: 3vw; font-size: 1.5vw; cursor: pointer; user-select: none; font-weight: 600; }
.dword.sel-w { outline: 0.3vw solid #fb6a5a; outline-offset: 0.2vw; }
.dword.used { opacity: 0.3; cursor: default; }
.gap-sentences { flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
.gap-sentence { font-size: 1.6vw; line-height: 1.4; }
.drop-zone { display: inline-block; min-width: 10vw; border-bottom: 0.2vw solid #0e8388; margin: 0 0.5vw; padding: 0 0.5vw; color: #9bb0b2; font-style: italic; cursor: pointer; vertical-align: bottom; font-size: 1.5vw; }
.drop-zone.filled { color: #1e2a2e; font-style: normal; font-weight: 700; background: #e6f3f2; border-radius: 0.3vw; border-bottom-color: #0a6e72; }
.drop-zone.ok { border-bottom-color: #1E8449; background: #EAFAF1; color: #1E8449; }
.drop-zone.wrong { border-bottom-color: #fb6a5a; background: #ffeae6; color: #fb6a5a; }
.ex-btns { display: flex; gap: 1vw; margin-top: 1.5vh; flex-shrink: 0; }

/* Answer key slide */
.ak-slide {
  background: #EAFAF1;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.ak-slide .slide-head { border-color: #1E8449; }
.ak-slide .slide-head h2 { color: #1E8449; }
.ak-content { background: white; border-radius: 1vw; padding: 2vh 3vw; box-shadow: 0 4px 16px rgba(0,0,0,0.08); border-left: 0.6vw solid #1E8449; flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
.ak-item { display: flex; gap: 1.5vw; align-items: center; padding: 1.5vh 2vw; background: #F4FDF8; border-radius: 0.6vw; font-size: 1.55vw; line-height: 1.6; }
.ak-num { color: #1E8449; font-weight: 700; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 2vw; min-width: 2.5vw; }
.ak-word { font-weight: 700; color: #1E8449; }
.ak-quote { font-style: italic; color: #5e7377; }

/* Matching */
.match-wrap { flex: 1; display: flex; flex-direction: column; }
.match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2vw; flex: 1; margin-bottom: 1.5vh; }
.match-col-label { font-size: 1.1vw; letter-spacing: 0.2vw; text-transform: uppercase; color: #5e7377; margin-bottom: 1vh; font-weight: 700; }
.mitem { padding: 1.5vh 1.8vw; border-radius: 0.6vw; margin-bottom: 0.8vh; font-size: 1.45vw; cursor: pointer; border: 0.2vw solid transparent; background: #e6f3f2; transition: all 0.18s; line-height: 1.45; }
.mitem:hover { border-color: #0a6e72; }
.mitem.sel { border-color: #0e8388; background: #cde9e7; font-weight: 700; }
.mitem.matched { border-color: #1E8449; background: #EAFAF1; color: #1E8449; cursor: default; font-weight: 600; }
.mitem.bad { border-color: #fb6a5a; background: #ffeae6; }

/* VF */
.vf-list { flex: 1; display: flex; flex-direction: column; gap: 1.2vh; }
.vf-row { display: flex; gap: 1.5vw; align-items: center; padding: 1.8vh 2vw; background: white; border-radius: 0.8vw; box-shadow: 0 2px 8px rgba(0,0,0,0.06); font-size: 1.5vw; line-height: 1.6; flex: 1; }
.vf-btns { display: flex; gap: 0.6vw; flex-shrink: 0; }
.vfb { padding: 0.6vh 1.2vw; border-radius: 2vw; border: 0.2vw solid; font-size: 1.2vw; font-weight: 700; cursor: pointer; background: transparent; font-family: inherit; }
.vfb.V { border-color: #1E8449; color: #1E8449; }
.vfb.F { border-color: #fb6a5a; color: #fb6a5a; }
.vfb.N { border-color: #5e7377; color: #5e7377; }
.vfb.correct { background: #1E8449; color: white; border-color: #1E8449; }
.vfb.incorrect { background: #fb6a5a; color: white; border-color: #fb6a5a; }
.vf-note { font-size: 1.1vw; color: #1E8449; font-style: italic; margin-top: 0.5vh; display: none; }
.vf-note.show { display: block; }

/* Buttons */
.ak-btn { padding: 1vh 2vw; background: #1E8449; color: white; border: none; border-radius: 0.5vw; cursor: pointer; font-size: 1.3vw; font-weight: 700; font-family: inherit; flex-shrink: 0; }
.ak-btn:hover { opacity: 0.85; }
.ak-btn.grey { background: #5e7377; }
.answer-key { display: none; margin-top: 1.5vh; padding: 1.5vh 2vw; background: #EAFAF1; border-radius: 0.8vw; border-left: 0.4vw solid #1E8449; font-size: 1.3vw; line-height: 1.9; flex-shrink: 0; }
.answer-key.show { display: block; }

/* ════════════════════════════════
   DISCUSSION
════════════════════════════════ */
.disc-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.disc-card { background: white; border-radius: 1vw; padding: 2.5vh 3vw; box-shadow: 0 4px 16px rgba(0,0,0,0.08); flex: 1; display: flex; flex-direction: column; }
.disc-topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2vh; flex-shrink: 0; }
.disc-dots { display: flex; gap: 0.8vw; }
.disc-dot { width: 1.2vw; height: 1.2vw; border-radius: 50%; background: #e6f3f2; border: 0.2vw solid #0a6e72; cursor: pointer; }
.disc-dot.active { background: #0e8388; }
.disc-dot.done { background: #1E8449; border-color: #1E8449; }
.disc-qnum { font-size: 1.4vw; color: #5e7377; font-weight: 600; }
.disc-q { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 2vw; line-height: 1.6; color: #1e2a2e; margin-bottom: 2vh; flex-shrink: 0; }
.disc-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 2vw; flex: 1; min-height: 0; }
.disc-col { display: flex; flex-direction: column; min-height: 0; }
.disc-col-label { font-size: 1.1vw; letter-spacing: 0.2vw; text-transform: uppercase; color: #5e7377; margin-bottom: 0.8vh; font-weight: 700; flex-shrink: 0; }
.disc-user-box { flex: 1; padding: 1.5vh 1.5vw; border-radius: 0.8vw; background: #e6f3f2; font-size: 1.4vw; line-height: 1.7; border: 0.2vw solid transparent; min-height: 0; overflow-y: auto; }
.disc-user-box.listening { border-color: #fb6a5a; background: #ffeae6; }
.disc-user-box .ph { color: #9bb0b2; font-style: italic; }
.disc-model-box { flex: 1; padding: 1.5vh 1.5vw; border-radius: 0.8vw; background: #EAFAF1; font-size: 1.3vw; line-height: 1.8; min-height: 0; overflow-y: auto; }
.disc-model-box.blur .mtext { filter: blur(6px); user-select: none; }
.reveal-btn { display: inline-block; margin-top: 0.8vh; padding: 0.7vh 1.8vw; background: #1E8449; color: white; border: none; border-radius: 0.5vw; font-size: 1.2vw; font-weight: 700; cursor: pointer; font-family: inherit; flex-shrink: 0; }
.mic-row { display: flex; align-items: center; gap: 1.5vw; margin-top: 1.5vh; flex-shrink: 0; }
.mic-btn { width: 5vw; height: 5vw; border-radius: 50%; border: none; background: #fb6a5a; color: white; font-size: 2.2vw; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(192,57,43,0.38); flex-shrink: 0; }
.mic-btn.on { background: #1E8449; animation: pulse 1.2s infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(30,132,73,0.5); } 50% { box-shadow: 0 0 0 1vw rgba(30,132,73,0); } }
.mic-status { font-size: 1.2vw; color: #5e7377; line-height: 1.5; }
.disc-nav { display: flex; gap: 1vw; justify-content: flex-end; margin-top: 1.5vh; flex-shrink: 0; }

sata", "en": "the crossing (by sea)", "ex": "una traversata che molti giudicavano una follia", "reg": "neutral; from attraversare; la traversata atlantica"}]}, {"group": "🤝 Appoggio e mediazione", "items": [{"it": "l'appoggio", "en": "the support, the backing", "ex": "Colombo trovò a La Rábida l'appoggio dei frati francescani", "reg": "neutral; near-synonym il sostegno; appoggiare qualcuno = to back somebody"}, {"it": "intercedere (presso)", "en": "to intercede, to put in a word (with)", "ex": "i frati decisero di intercedere presso la corte dei Re cattolici", "reg": "formal; intercedere presso qualcuno per qualcuno"}, {"it": "finanziare", "en": "to fund, to finance", "ex": "la sovrana decise di finanziare la spedizione", "reg": "neutral; il finanziamento = the funding"}, {"it": "l'udienza", "en": "the audience, the (official) hearing", "ex": "grazie a quella mediazione il navigatore ottenne finalmente un'udienza", "reg": "formal; concedere / ottenere un'udienza; in court it is a hearing"}]}, {"group": "🌍 Storia ed eredità", "items": [{"it": "l'impresa", "en": "the feat, the undertaking", "ex": "la scoperta dell'America resta una delle più grandi imprese della storia", "reg": "careful: l'impresa also means 'a firm, a business' — here it is 'feat'"}, {"it": "l'eredità", "en": "the legacy", "ex": "un'eredità con luci e ombre", "reg": "also 'inheritance' in law; luci e ombre = the bright and the dark sides"}, {"it": "i popoli originari", "en": "indigenous peoples", "ex": "episodi di violenza nei confronti dei popoli originari", "reg": "today's neutral term; the report also uses gli indigeni"}, {"it": "lo scambio", "en": "the exchange", "ex": "il più grande scambio culturale, economico e biologico della storia moderna", "reg": "neutral; scambiare = to exchange; lo scambio di idee"}]}], "video": {"url": "https://www.youtube.com/watch?v=U9A3dqWYPGA", "title": "La Rábida, il monastero dove Colombo convinse la Castiglia a scoprire l'America", "channel": "euronews (in italiano)", "parts": [{"summary": "Il servizio visita il monastero francescano di Santa María de la Rábida, su un promontorio di Huelva, dove il Rio Tinto e l'Odiel si uniscono prima dell'Atlantico. Racconta come Cristoforo Colombo, dopo anni di rifiuti in Portogallo, in Francia e in Italia, trovò qui l'appoggio dei frati — in particolare di fra Juan Pérez, già confessore della regina — e come quella mediazione gli aprì le porte della corte dei Re cattolici e il sostegno di Isabella I di Castiglia. Si vede poi la cappella con l'immagine di Nostra Signora dei Miracoli, davanti alla quale, secondo la tradizione, Colombo pregò prima di partire, e si ricorda il ruolo decisivo dei fratelli Pinzón, che reclutarono l'equipaggio a Palos de la Frontera e comandarono La Pinta e La Niña. Il servizio si chiude sull'eredità di quel viaggio — gli scambi, ma anche le ombre — e sul monastero come luogo di visita, insieme alle ricostruzioni delle tre navi al Muelle de las Carabelas."}]}, "reading": {"title": "Il monastero di La Rábida: il luogo dove Colombo convinse la Castiglia", "lead": "Prima di salpare verso l'America, Cristoforo Colombo trovò in un piccolo monastero di Huelva l'appoggio dei frati francescani e dei fratelli Pinzón: senza di loro, probabilmente, le tre navi non sarebbero mai partite.", "paragraphs": ["Su un piccolo promontorio a Huelva, nel punto in cui il Rio Tinto si unisce all'Odiel prima di arrivare all'Atlantico, sorge il monastero di Santa María de la Rábida. I frati francescani si stabilirono in questo eremo all'inizio del XIII secolo. Per decenni fu un luogo tranquillo di preghiera, lontano dal rumore del mondo; poi l'insistenza di un navigatore lo trasformò nell'epicentro di un episodio che avrebbe cambiato la storia.", "Quando Colombo arrivò in queste terre, cercava da anni una corona europea disposta a fidarsi del suo progetto: una rotta verso occidente per raggiungere le Indie. Aveva chiesto appoggio in Portogallo, in Francia e in Italia, senza successo. Anche Castiglia e Aragona avevano detto no: i sovrani di allora erano concentrati sulla campagna di Granada, l'ultima tappa della Reconquista.", "Nel convento di La Rábida, però, il navigatore trovò più di un semplice alloggio: trovò alleati. Fra Juan Pérez, che era stato confessore della regina, ascoltò il progetto e decise di intercedere presso la corte dei Re cattolici. Grazie a quella mediazione Colombo ottenne finalmente un'udienza, che si sarebbe tradotta nel sostegno di Isabella I di Castiglia, la sovrana che avrebbe finanziato la spedizione.", "Convincere la Corona, però, non bastava. Serviva un equipaggio disposto a imbarcarsi in una traversata che molti marinai consideravano un viaggio senza ritorno. Entrarono allora in gioco i fratelli Pinzón, una delle famiglie più influenti di Palos de la Frontera. Martín Alonso mise la propria reputazione al servizio del progetto e aiutò a reclutare gli uomini: comandò La Pinta, mentre il fratello Vicente Yáñez prese il comando della Niña. Il 3 agosto 1492 le tre navi salparono dal porto di Palos.", "L'eredità di quel viaggio ha luci e ombre. Dall'incontro fra i due mondi arrivarono in Europa alimenti oggi indispensabili — la patata, il pomodoro, la canna da zucchero, il cacao — ma l'impresa fu segnata anche da violenze e sottomissione nei confronti dei popoli originari. Oggi il convento francescano conserva documenti, modellini e oggetti del XV secolo, e le ricostruzioni delle tre navi si possono visitare al Muelle de las Carabelas."], "url": "https://it.euronews.com/2026/09/28/il-monastero-di-la-rabida-il-luogo-dove-colombo-convinse-castiglia-a-scoprire-lamerica"}, "grammar": [{"label": "Grammatica — Discorso indiretto e concordanza dei tempi", "subtitle": "disse che era · aveva parlato · avrebbe finanziato: il futuro visto dal passato", "title": "«Un'udienza che si sarebbe tradotta nel sostegno della regina» — il futuro nel passato", "expl": "Quando il verbo che introduce le parole di qualcuno è al passato (disse, spiegò, raccontò, promise, chiese), i tempi delle parole riportate si spostano indietro. È la concordanza dei tempi, e funziona con tre regole. 1) PRESENTE → IMPERFETTO: «Il mio progetto è possibile» → Colombo disse che il suo progetto era possibile. 2) PASSATO (prossimo o remoto) → TRAPASSATO PROSSIMO: «Ho già parlato con la regina» → il frate spiegò che aveva già parlato con la regina. 3) FUTURO → CONDIZIONALE COMPOSTO: «Recluteremo noi l'equipaggio» → i Pinzón promisero che avrebbero reclutato l'equipaggio. Questo terzo caso è il punto più importante: il condizionale composto (avrei fatto, sarei partito) è il FUTURO NEL PASSATO, cioè quello che, da un punto del passato, doveva ancora succedere. Cambiano anche i pronomi e le espressioni di tempo e luogo: oggi → quel giorno, ieri → il giorno prima, domani → il giorno dopo, adesso → allora, qui → lì. E dopo un verbo di opinione al passato si usa il congiuntivo imperfetto: molti credevano che la traversata fosse una follia. Attenzione a due cose. Primo: nella narrazione storica il futuro nel passato si usa anche SENZA verbo dichiarativo, per annunciare quello che succederà dopo — «una decisione che avrebbe segnato il destino di due continenti», «la sovrana che avrebbe finanziato la spedizione». Secondo: avrebbe / sarebbe + participio ha due valori diversi, e solo il contesto li distingue — futuro nel passato (avrebbe cambiato la storia: e infatti la cambiò) oppure ipotesi non realizzata (senza i frati non sarebbe mai salpato: e infatti salpò). L'inglese usa would per entrambi, ed è esattamente lì che nasce l'ambiguità in traduzione.", "examples": [["Colombo disse ai frati che il suo progetto era possibile", " — presente → imperfetto (he said his plan was possible)"], ["fra Juan Pérez spiegò che aveva già parlato con la regina", " — passato → trapassato prossimo (he had already spoken)"], ["i Pinzón promisero che avrebbero reclutato l'equipaggio", " — futuro → condizionale composto: futuro nel passato (they would recruit)"], ["ottenne un'udienza, che si sarebbe tradotta nel sostegno della regina", " — futuro nel passato senza verbo dichiarativo: ciò che succederà dopo"], ["senza i frati, l'impresa non sarebbe mai salpata", " — stessa forma, valore diverso: ipotesi non realizzata (would never have set sail)"], ["molti credevano che la traversata fosse una follia", " — opinione al passato → congiuntivo imperfetto"], ["il navigatore annunciò che il giorno dopo le navi sarebbero partite", " — domani → il giorno dopo; futuro → condizionale composto"]], "snote": "Regola pratica: chiediti da quale punto nel tempo si guarda. Se il punto di osservazione è nel passato e il fatto è ancora da venire, serve il condizionale composto — mai il futuro semplice. E per distinguere i due valori di avrebbe + participio chiediti: è poi successo davvero? Sì → futuro nel passato. No → ipotesi."}], "comprehension": [{"label": "Comprensione", "h2": "Comprensione", "sub": "1–3: fatti dal servizio · 4–6: domande aperte", "compLabel": "📻 Fatti (1–3)  ·  💭 Domande aperte (4–6)", "questions": [["1.", "Dove si trova il monastero di La Rábida, e chi vi abitava?", "Su un promontorio a Huelva, nel sud della Spagna, dove il Rio Tinto si unisce all'Odiel prima dell'Atlantico. Vi abitavano i frati francescani, arrivati all'inizio del XIII secolo — e ci sono ancora."], ["2.", "Che cosa cercava Colombo quando arrivò a La Rábida, e che cosa trovò?", "Cercava da anni una corona disposta a fidarsi del suo progetto: una rotta verso occidente per arrivare alle Indie. In Portogallo, in Francia e in Italia aveva ricevuto solo rifiuti. A La Rábida trovò alleati: i frati, e in particolare fra Juan Pérez, che intercedettero per lui presso la corte."], ["3.", "Che ruolo hanno avuto i fratelli Pinzón?", "Furono il pezzo che mancava: reclutarono l'equipaggio a Palos de la Frontera e comandarono due delle tre navi — Martín Alonso La Pinta, Vicente Yáñez La Niña."], ["4.", "Perché, secondo te, la storia ricorda il nome dei protagonisti e dimentica quello di chi li ha aiutati?", "Perché raccontare è più facile con una persona sola: un nome, una data, una decisione. Un frate che parla con la regina, una famiglia di marinai che convince trenta uomini a imbarcarsi — sono passaggi lenti, e nei libri di scuola non c'è spazio. Secondo me però è proprio lì che sta la storia vera: nessuno parte da solo, e chi apre la porta conta quanto chi la attraversa."], ["5.", "Il servizio parla di «un'eredità con luci e ombre». Come si può raccontare oggi un evento storico così, senza né celebrarlo né condannarlo in blocco?", "Credo che si debba dire tutto e nello stesso ordine: che cosa è cambiato per il mondo e che cosa è costato a chi già viveva in quelle terre. Non serve giudicare il Quattrocento con le nostre parole, ma non serve nemmeno tacere. Un museo può fare esattamente questo: mostrare le tre caravelle e, accanto, spiegare chi c'era dall'altra parte dell'oceano."], ["6.", "C'è nel tuo Paese un luogo piccolo e poco conosciuto che ha avuto un ruolo grande nella storia? Quale, e perché?", "In Ungheria mi viene in mente Visegrád: oggi è un paese di poche migliaia di abitanti, ma nel 1335 lì si incontrarono i re di Ungheria, Polonia e Boemia, e quel nome è tornato sei secoli dopo in politica europea. Mi piace l'idea che un luogo piccolo possa restare nel vocabolario di tutti senza che nessuno ricordi perché."]]}], "gapfill": {"heading": "Completa le frasi in base al servizio!", "words": ["appoggio", "udienza", "equipaggio", "salparono", "eredità"], "sents": [{"pre": "1.  A La Rábida Colombo trovò l'", "blank": "appoggio", "post": " dei frati francescani."}, {"pre": "2.  Grazie alla mediazione di fra Juan Pérez, il navigatore ottenne finalmente un'", "blank": "udienza", "post": " alla corte dei Re cattolici."}, {"pre": "3.  I fratelli Pinzón aiutarono Colombo a reclutare l'", "blank": "equipaggio", "post": " a Palos de la Frontera."}, {"pre": "4.  Le tre navi", "blank": "salparono", "post": " dal porto di Palos il 3 agosto 1492."}, {"pre": "5.  Il servizio parla di un'", "blank": "eredità", "post": " con luci e ombre."}], "answers": [["1.", "appoggio", "Colombo trovò l'appoggio dei frati francescani (e dei fratelli Pinzón)"], ["2.", "udienza", "grazie a quella mediazione ottenne finalmente un'udienza"], ["3.", "equipaggio", "serviva un equipaggio disposto a imbarcarsi in una traversata senza ritorno"], ["4.", "salparono", "il 3 agosto 1492 le tre navi salparono dal porto di Palos"], ["5.", "eredità", "un'eredità con luci e ombre: gli scambi, ma anche le violenze"]]}, "verofalso": {"items": [{"s": "Il monastero di La Rábida si trova vicino al punto in cui il Rio Tinto e l'Odiel arrivano all'Atlantico.", "a": "V"}, {"s": "Prima di arrivare in Spagna, Colombo aveva già ottenuto l'appoggio del Portogallo.", "a": "F", "note": "Aveva cercato appoggio in Portogallo, in Francia e in Italia, ma senza successo."}, {"s": "Fra Juan Pérez era stato confessore della regina Isabella.", "a": "V"}, {"s": "Martín Alonso Pinzón comandò la Santa María.", "a": "F", "note": "Comandò La Pinta; la Santa María era comandata da Colombo stesso."}, {"s": "Le ricostruzioni delle tre navi si possono visitare al Muelle de las Carabelas.", "a": "V"}, {"s": "Oggi il monastero è il luogo storico più visitato dell'Andalusia.", "a": "N", "note": "Il servizio dice che è un punto di riferimento turistico e culturale, ma non lo confronta con altri luoghi."}], "key_html": "<b>1.</b> Vero &nbsp; <b>2.</b> Falso (solo rifiuti) &nbsp; <b>3.</b> Vero &nbsp; <b>4.</b> Falso (La Pinta) &nbsp; <b>5.</b> Vero &nbsp; <b>6.</b> Non detto"}, "discussion": [{"q": "Visitare un luogo storico cambia il modo in cui capiamo la storia, o basta leggere un buon libro?", "m": "Secondo me le due cose fanno lavori diversi. Il libro dà le date, le cause, i documenti: senza quello, un luogo resta soltanto un bel paesaggio. Ma stare lì aggiunge una cosa che il libro non può dare, ed è la misura. A La Rábida capisci che il monastero è piccolo, che l'estuario è vicino, che tutto è successo in poche stanze e in pochi mesi. Io ho avuto questa impressione in altri posti: leggi per anni di una battaglia e poi vedi che il campo è largo come due campi da calcio. Quindi direi: prima il libro, poi il luogo, e possibilmente di nuovo il libro."}, {"q": "Colombo cercò appoggio per anni e ricevette solo rifiuti. Che cosa pensi di questa ostinazione: è una virtù o un difetto?", "m": "Dipende da come finisce, e questo è il problema. Se il progetto funziona, chiamiamo ostinazione la stessa cosa che, se fallisce, chiamiamo testardaggine. Nel caso di Colombo l'idea di partenza era anche sbagliata — la distanza era molto più grande di quanto lui credesse — e però proprio quell'errore lo ha portato dove nessuno lo aspettava. Io penso che l'ostinazione sia utile solo con una condizione: che la persona continui a cercare qualcuno che le dica di no. Colombo, in fondo, ha passato quindici anni ad ascoltare dei no, e ha cambiato ogni volta un pezzo del progetto."}, {"q": "Oggi molti monumenti legati alla colonizzazione sono discussi. Secondo te si dovrebbero spiegare, cambiare o lasciare come sono?", "m": "Io sono per spiegare. Togliere una statua non cancella la storia, e lasciarla senza una parola la trasforma in una celebrazione. La soluzione più onesta mi sembra il cartello, il pannello, la sala del museo: qui c'è la caravella, e qui c'è chi viveva dall'altra parte dell'oceano. È meno spettacolare di una polemica, ma dura più a lungo. Poi ci sono casi estremi, monumenti costruiti proprio per umiliare qualcuno: quelli, forse, è meglio spostarli in un museo. La differenza, per me, è tra un oggetto che racconta un'epoca e un oggetto che continua a fare male oggi."}], "homework": [{"label": "Compiti — Scrittura", "bgCls": "red", "blockCls": "red-b", "h3color": "#E24E3E", "h3text": "✍ Una pagina di storia (80–100 parole)", "bodyHTML": "Racconta, in 80–100 parole, una decisione del passato che ha cambiato qualcosa: un episodio della storia del tuo Paese, della tua città o anche della tua famiglia.<br><br><b>Domande guida:</b> Chi ha deciso, e quando? Chi lo ha aiutato? Che cosa sembrava impossibile in quel momento? Che cosa è cambiato dopo?<br><br>Usa almeno <b>cinque parole</b> della lezione (per esempio: <i>l'appoggio, intercedere, finanziare, l'impresa, l'eredità</i>) e almeno <b>tre volte il futuro nel passato</b>, cioè il condizionale composto (<i>avrebbe cambiato, sarebbe diventato, si sarebbe tradotto in…</i>). Se ci riesci, aggiungi anche <b>una frase al discorso indiretto</b> con un verbo dichiarativo al passato (<i>disse che…</i>)!", "chips": ["80–100 parole", "5 parole nuove", "3 futuri nel passato"]}], "grammar_practice": [{"title": "Futuro nel passato o ipotesi non realizzata?", "instr": "Ogni frase contiene un condizionale composto. Scrivi accanto FUTURO NEL PASSATO (il fatto è poi successo davvero) oppure IPOTESI (il fatto non è successo).", "items": ["1. Colombo ottenne un'udienza che si sarebbe tradotta nel sostegno della regina. → ..............................", "2. Senza i frati di La Rábida, l'impresa non sarebbe mai salpata da Palos. → ..............................", "3. Nel 1485 nessuno immaginava che quel navigatore avrebbe ridisegnato la mappa del mondo. → ..............................", "4. Se i sovrani non fossero stati occupati a Granada, avrebbero ascoltato Colombo molto prima. → ..............................", "5. Martín Alonso Pinzón avrebbe comandato La Pinta per tutta la traversata. → ..............................", "6. Senza l'appoggio dei Pinzón, difficilmente l'equipaggio si sarebbe imbarcato. → ..............................", "7. La regina scrisse un testamento che avrebbe anticipato l'idea moderna dei diritti umani. → ..............................", "8. Colombo credeva di essere arrivato alle Indie: non avrebbe mai saputo di aver toccato un altro continente. → .............................."], "answers": ["1. FUTURO NEL PASSATO — l'udienza portò davvero al sostegno di Isabella.", "2. IPOTESI — la partenza ci fu; la frase immagina un mondo senza i frati (senza + nome = protasi implicita).", "3. FUTURO NEL PASSATO — dal 1485 il fatto era ancora da venire, ma poi avvenne.", "4. IPOTESI — periodo ipotetico dell'irrealtà: non lo ascoltarono prima.", "5. FUTURO NEL PASSATO — comandò effettivamente La Pinta.", "6. IPOTESI — l'equipaggio invece si imbarcò.", "7. FUTURO NEL PASSATO — il testamento anticipò davvero quell'idea.", "8. FUTURO NEL PASSATO — dal punto di vista del 1492 il fatto era futuro, e in effetti Colombo morì senza saperlo."]}, {"title": "Dal discorso diretto al discorso indiretto", "instr": "Riscrivi le frasi al discorso indiretto. Il verbo dichiarativo è al passato: attenzione ai tempi, ai pronomi e alle espressioni di tempo.", "items": ["1. Colombo disse: «Il mio progetto è possibile». → Colombo disse che ..............................", "2. Fra Juan Pérez spiegò: «Ho già parlato con la regina». → Fra Juan Pérez spiegò che ..............................", "3. I fratelli Pinzón promisero: «Recluteremo noi l'equipaggio». → I Pinzón promisero che ..............................", "4. La regina rispose: «Finanzierò la spedizione». → La regina rispose che ..............................", "5. Un marinaio disse: «Domani saliremo a bordo». → Un marinaio disse che ..............................", "6. Colombo scrisse: «Ieri ho visto degli uccelli: la terra è vicina». → Colombo scrisse che ..............................", "7. I frati chiesero: «Perché nessuno ti ascolta?». → I frati gli chiesero ..............................", "8. La regina ordinò: «Trattateli come cittadini castigliani». → La regina ordinò .............................."], "answers": ["1. … che il suo progetto era possibile. (presente → imperfetto; mio → suo)", "2. … che aveva già parlato con la regina. (passato prossimo → trapassato prossimo)", "3. … che avrebbero reclutato loro l'equipaggio. (futuro → condizionale composto)", "4. … che avrebbe finanziato la spedizione. (futuro → condizionale composto)", "5. … che il giorno dopo sarebbero saliti a bordo. (domani → il giorno dopo)", "6. … che il giorno prima aveva visto degli uccelli e che la terra era vicina. (ieri → il giorno prima)", "7. … perché nessuno lo ascoltasse. (domanda indiretta: congiuntivo imperfetto; ti → lo)", "8. … di trattarli come cittadini castigliani. (ordine → di + infinito)"]}, {"title": "Scegli la forma corretta", "instr": "Scegli fra le due forme e, se puoi, di' in una parola perché.", "items": ["1. Colombo disse che il suo piano (era / è) realizzabile.", "2. I frati raccontarono che (avevano conosciuto / hanno conosciuto) il navigatore l'anno prima.", "3. La regina promise che (finanzierà / avrebbe finanziato) la spedizione.", "4. Molti marinai credevano che la traversata (fosse / era) una follia.", "5. Il navigatore annunciò che (il giorno dopo / domani) le navi sarebbero partite.", "6. Nessuno sapeva che quel viaggio (cambierà / avrebbe cambiato) la storia.", "7. Se i frati non avessero parlato con la corte, Colombo non (otteneva / avrebbe ottenuto) l'udienza.", "8. Pinzón disse ai marinai che (li / vi) avrebbe pagati lui."], "answers": ["1. era — concordanza: verbo dichiarativo al passato, quindi presente → imperfetto.", "2. avevano conosciuto — anteriorità rispetto a «raccontarono»: trapassato prossimo.", "3. avrebbe finanziato — futuro nel passato: il futuro semplice è impossibile dopo un verbo al passato.", "4. fosse — opinione al passato: congiuntivo imperfetto.", "5. il giorno dopo — nel discorso indiretto gli avverbi di tempo si spostano (domani → il giorno dopo).", "6. avrebbe cambiato — futuro nel passato, e il fatto è poi avvenuto.", "7. avrebbe ottenuto — periodo ipotetico dell'irrealtà: congiuntivo trapassato + condizionale composto.", "8. li — terza persona nel discorso indiretto: «vi pagherò io» → che li avrebbe pagati lui."]}]};

function makeSlide(label, cls) {
  const div = document.createElement('div');

  vp.appendChild(div);
  SLIDES.push({ label, el: div });
  if (cls !== 'title-slide' && cls !== 'sep-slide') {
    const bs = document.createElement('div'); bs.className = 'brand-strip';
    const n = document.createElement('span'); n.className = 'bs-name'; n.textContent = 'Goodman';
    const l = document.createElement('span'); l.className = 'bs-lang'; l.textContent = UI.brandLang;
    bs.appendChild(n); bs.appendChild(l); div.appendChild(bs);

  return div;
}

function ap(parent, ...children) { children.forEach(c => parent.appendChild(c)); return parent; }

// ── BUILD (B1 shape: warm-up → vocab → video → reading → grammar → comprehension → exercises → discussion → homework)
function build() {
  const D = SPEC.dividers || {};
  makeTitle(SPEC.title_slide || {});

  makeDivider(D.warmup);
  makeQuestionsSlide(UI.warmupLabel, UI.warmupH2, UI.warmupSub, UI.warmupBox, SPEC.warmup.questions);
  if (SPEC.warmup.episode) makeProseSlide('Riscaldamento — Di cosa parla?', SPEC.warmup.episode.h2, SPEC.warmup.episode.sub, SPEC.warmup.episode.body);
  if (SPEC.figures) makeFiguresSlide(SPEC.figures);

  makeDivider(D.vocab);
  const per = 2; // rule: 8 cards per slide (2 groups × 4)
  for (let i = 0; i < VOCAB.length; i += per) {
    makeVocabSlide('Parole chiave — ' + (Math.floor(i/per) + 1) + '/' + Math.ceil(VOCAB.length/per), VOCAB.slice(i, i + per));
  }

  if (SPEC.video && SPEC.video.parts && SPEC.video.parts.length) {
    makeDivider(D.video);
    const vid = ytId(SPEC.video.url || SPEC.video.video_id);
    SPEC.video.parts.forEach((p, i) => makeVideoPartSlide(p, i, SPEC.video.parts.length, vid));
  }

  if (SPEC.reading) { makeDivider(D.reading); makeReadingSlide(SPEC.reading); }

  if (SPEC.grammar && SPEC.grammar.length) { makeDivider(D.grammar); SPEC.grammar.forEach(makeGramSlide); }

  makeDivider(D.comprehension);
  (SPEC.comprehension || []).forEach(makeCompSlide);

  makeDivider(D.exercises);
  if (SPEC.gapfill) { makeGapSlide(SPEC.gapfill); makeGapAnswerSlide(SPEC.gapfill); }
  if (SPEC.match) makeMatchSlide(SPEC.match);
  if (SPEC.verofalso) makeVFSlide(SPEC.verofalso);

  makeDivider(D.discussion);
  makeDiscSlide();

  if (SPEC.homework && SPEC.homework.length) { makeDivider(D.homework); SPEC.homework.forEach(makeHWSlide); }
}
build();

const TOTAL = SLIDES.length; let cur = 0;
SLIDES[0].el.classList.add('active');
const DISC_IDX = SLIDES.findIndex(s => s.el.classList.contains('disc-slide'));
function go(d) {
  SLIDES[cur].el.classList.remove('active');
  cur = Math.max(0, Math.min(TOTAL - 1, cur + d));
  SLIDES[cur].el.classList.add('active'); SLIDES[cur].el.scrollTop = 0; updateNav();
  if (cur === DISC_IDX) initMicPermission();
}
function updateNav() {
  document.getElementById('slide-label').textContent = (cur+1) + ' / ' + TOTAL + ' — ' + SLIDES[cur].label;
  document.getElementById('pb').style.width = ((cur+1)/TOTAL*100) + '%';
  document.getElementById('btn-prev').disabled = cur === 0;
  document.getElementById('btn-next').disabled = cur === TOTAL-1;
}
updateNav();
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(1);
  if (e.key === 'ArrowLeft') go(-1);
  if ((e.key==='r'||e.key==='R') && cur===DISC_IDX) toggleMic();
});

// ── GAP FILL ─────────────────────────────────────────────────────
let selWord = null;
function wireGap() {
  const wb = document.getElementById('wb'); const gs = document.getElementById('gap-sents'); if (!wb || !gs) return;
  [...GAP_WORDS].sort(()=>Math.random()-0.5).forEach(w => {
    const d = el('div','dword', w); d.dataset.w = w;
    d.onclick = () => { if (d.classList.contains('used')) return; document.querySelectorAll('.dword').forEach(x=>x.classList.remove('sel-w')); d.classList.add('sel-w'); selWord = w; };
    wb.appendChild(d);
  });
  GAP_SENTS.forEach(s => { const d = el('div','gap-sentence'); d.innerHTML = s.pre + ' <span class="drop-zone" data-blank="'+s.blank+'" onclick="fillZone(this)">_ _ _ _ _</span> ' + s.post; gs.appendChild(d); });
}
function fillZone(z) {
  if (!selWord || z.classList.contains('ok')) return;
  document.querySelectorAll('.drop-zone').forEach(oz=>{ if(oz!==z && oz.dataset.filled===selWord){oz.textContent='_ _ _ _ _';oz.classList.remove('filled','ok','wrong');oz.dataset.filled='';} });
  z.textContent = selWord; z.classList.add('filled'); z.dataset.filled = selWord;
  document.querySelectorAll('.dword').forEach(d=>d.classList.remove('sel-w')); selWord = null;
}
function checkGap() { document.querySelectorAll('.drop-zone').forEach(z=>{ z.classList.remove('ok','wrong'); if(z.dataset.filled===z.dataset.blank) z.classList.add('ok'); else if(z.dataset.filled) z.classList.add('wrong'); }); }
function resetGap() { document.querySelectorAll('.drop-zone').forEach(z=>{z.textContent='_ _ _ _ _';z.classList.remove('filled','ok','wrong');z.dataset.filled='';}); document.querySelectorAll('.dword').forEach(d=>d.classList.remove('used','sel-w')); selWord = null; }

// ── MATCHING ─────────────────────────────────────────────────────
let selTerm = null;
function wireMatch() {
  const tc = document.getElementById('mterms'), dc = document.getElementById('mdefs'); if (!tc || !dc) return;
  const shuffled = [...MATCH].sort(()=>Math.random()-0.5);
  MATCH.forEach((m,i)=>{ const e2 = el('div','mitem', m.t); e2.dataset.pair = i; e2.dataset.side='t';
    e2.onclick = () => { if (e2.classList.contains('matched')) return; document.querySelectorAll('.mitem[data-side="t"]').forEach(x=>x.classList.remove('sel')); e2.classList.add('sel'); selTerm = e2; };
    tc.appendChild(e2); });
  shuffled.forEach(m=>{ const oi = MATCH.findIndex(x=>x.d===m.d); const e2 = el('div','mitem', m.d); e2.dataset.pair = oi; e2.dataset.side='d';
    e2.onclick = () => { if (!selTerm || e2.classList.contains('matched')) return;
      if (selTerm.dataset.pair === e2.dataset.pair) { selTerm.classList.remove('sel'); selTerm.classList.add('matched'); e2.classList.add('matched'); selTerm = null; }
      else { e2.classList.add('bad'); setTimeout(()=>e2.classList.remove('bad'),500); const st = selTerm; selTerm = null; st.classList.add('bad'); setTimeout(()=>st.classList.remove('bad','sel'),500); } };
    dc.appendChild(e2); });
}

// ── VERO / FALSO / NON DETTO ──────────────────────────────────
function wireVF() {
  const root = document.getElementById('vf-root'); if (!root) return;
  VF.forEach((item,i)=>{
    const row = el('div','vf-row'); const btns = el('div','vf-btns');
    UI.vfBtns.forEach(([cls,val])=>{ const b = el('button','vfb '+cls, val); b.onclick = () => checkVF(b, cls, item.a, i); btns.appendChild(b); });
    const body = document.createElement('div'); body.style.flex='1';
    body.appendChild(el('div','', String(i+1)+'. '+item.s));
    if (item.note) { const n = el('div','vf-note','→ '+item.note); n.id='vfn'+i; body.appendChild(n); }
    ap(row, btns, body); root.appendChild(row);
  });
}
function checkVF(btn, chosen, correct, idx) {
  btn.closest('.vf-row').querySelectorAll('.vfb').forEach(b=>b.classList.remove('correct','incorrect'));
  if (chosen===correct) btn.classList.add('correct');
  else { btn.classList.add('incorrect'); const n=document.getElementById('vfn'+idx); if(n) n.classList.add('show'); }
}

// ── DISCUSSION + MIC ─────────────────────────────────────────────
let dIdx=0, recog=null, recording=false, micOK=false, micStream=null;
function wireDisc() {
  const dots = document.getElementById('ddots'); if (!dots) return;
  DISC.forEach((_,i)=>{ const d = el('div','disc-dot'+(i===0?' active':'')); d.onclick = () => gotoDisc(i); dots.appendChild(d); });
  loadDisc();
}
function loadDisc() {
  const dq = document.getElementById('dq'); if (!dq) return;
  dq.textContent = DISC[dIdx].q;
  document.getElementById('dqnum').textContent = (dIdx+1) + '. ' + UI.question + UI.ofN + DISC.length;
  document.getElementById('dmtext').textContent = DISC[dIdx].m;
  document.getElementById('dmbox').classList.add('blur');
  if (!recording) { const ub = document.getElementById('dubox'); ub.innerHTML=''; ub.appendChild(el('span','ph', UI.micPh)); ub.classList.remove('listening'); }
  document.querySelectorAll('.disc-dot').forEach((d,i)=>d.classList.toggle('active', i===dIdx));
  const pb = document.getElementById('dprev'), nb = document.getElementById('dnext');
  if (pb) pb.disabled = dIdx === 0;
  if (nb) { const last = dIdx >= DISC.length - 1; nb.textContent = last ? UI.nextSlide : UI.next; nb.classList.toggle('to-slide', last); }
}
function dNav(d) { document.querySelectorAll('.disc-dot')[dIdx].classList.add('done'); dIdx = Math.max(0, Math.min(DISC.length-1, dIdx+d)); loadDisc(); }
function gotoDisc(i){ dIdx=i; loadDisc(); }
function revealModel(){ document.getElementById('dmbox').classList.toggle('blur'); }
function initMicPermission() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { const w=document.getElementById('swarn'); if(w) w.style.display='block'; return; }
  if (micOK && micStream && micStream.active) return;
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(stream => { micStream = stream; micOK = true; const st = document.getElementById('micstat'); if (st) st.textContent = UI.micReady; })
      .catch(e => { if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) { const w=document.getElementById('swarn'); if(w) w.style.display='block'; } });
  }
}
function toggleMic(){ recording ? stopMic() : startMic(); }
function startMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) return;
  recog = new SR(); recog.lang='it-IT'; recog.continuous=true; recog.interimResults=true;
  const box = document.getElementById('dubox'); box.innerHTML=''; box.classList.add('listening');
  let final='';
  recog.onresult = e => { let interim=''; for (let i=e.resultIndex; i<e.results.length; i++) { if (e.results[i].isFinal) final += e.results[i][0].transcript + ' '; else interim += e.results[i][0].transcript; } box.textContent = final + interim; micOK = true; };
  recog.onerror = e => { if (e.error!=='no-speech') stopMic(); };
  recog.onend = () => { if (recording) recog.start(); };
  recog.start(); recording = true;
  document.getElementById('micbtn').classList.add('on'); document.getElementById('micbtn').textContent = '⏹';
  document.getElementById('micstat').textContent = UI.micRec;
}
function stopMic() {
  if (recog) { recog.stop(); recog=null; } recording=false;
  document.getElementById('micbtn').classList.remove('on'); document.getElementById('micbtn').textContent = '🎤';
  document.getElementById('micstat').textContent = UI.micPause; document.getElementById('dubox').classList.remove('listening');
}
function toggleAK(id){ document.getElementById(id).classList.toggle('show'); }

wireGap(); wireMatch(); wireVF(); wireDisc();

// ── Text-size control ────────────────────────────────────────────
(function(){
  let z = 100;
  const bar = document.createElement('div'); bar.id='tsize';
  bar.innerHTML = '<span>' + UI.tsize + '</span><button id="tsm">A−</button><span id="tsv">100%</span><button id="tsp">A+</button><button id="tsr">⟲</button>';
  const _tb=document.getElementById('topbar'), _nb=document.getElementById('nav-btns');
  if(_tb && _nb) _tb.insertBefore(bar, _nb); else document.body.appendChild(bar);
  function apply(){ document.getElementById('viewport').style.zoom = (z/100); document.getElementById('tsv').textContent = z+'%'; }
  document.getElementById('tsm').onclick = ()=>{ z=Math.max(70,z-10); apply(); };
  document.getElementById('tsp').onclick = ()=>{ z=Math.min(220,z+10); apply(); };
  document.getElementById('tsr').onclick = ()=>{ z=100; apply(); };
})();
</script>
